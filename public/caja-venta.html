<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sabores Royal — Caja</title>
<style>
:root {
  --navy: #0f1c45;
  --navy2: #1a2a5e;
  --navy3: #22357a;
  --gold: #c5a028;
  --gold2: #e0bb4a;
  --ok: #3ecf8e;
  --danger: #e5566d;
  --warn: #e0a83c;
  --glass: rgba(255,255,255,.06);
  --glass2: rgba(255,255,255,.10);
  --bd: rgba(255,255,255,.12);
  --muted: rgba(255,255,255,.45);
  --text: #f0f2ff;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--navy);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 16px;
  overscroll-behavior: none;
}
#app { min-height: 100vh; display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 20px; background: rgba(15,28,69,.9);
  border-bottom: 1px solid var(--bd);
}
.topbar .caja-badge {
  background: var(--gold); color: #000; font-weight: 800;
  padding: 5px 12px; border-radius: 8px; font-size: 14px;
}
.topbar .cajero-name { font-weight: 700; color: var(--gold2); }
.topbar .spacer { flex: 1; }
.topbar button {
  background: var(--glass); border: 1px solid var(--bd); border-radius: 8px;
  padding: 8px 14px; font-size: 13px; color: var(--text);
}
.topbar button:hover { background: var(--glass2); }
.brand-logo { border-radius: 8px; object-fit: cover; flex: none; }

/* ── BANNER DE CAJA (oferta) ── */
.pos-banner {
  position: relative; border-radius: 14px; overflow: hidden; flex: none;
  min-height: 90px; display: flex; align-items: flex-end; padding: 14px 16px;
  background-size: cover; background-position: center;
}
.pos-banner::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.05) 70%);
}
.pos-banner-text { position: relative; z-index: 1; }
.pos-banner-title { font-size: 16px; font-weight: 800; color: #fff; }
.pos-banner-subtitle { font-size: 12.5px; color: rgba(255,255,255,.85); margin-top: 2px; }

/* ── SIDEBAR ── */
.app-shell { flex: 1; display: flex; min-height: 0; }
.sidebar {
  width: 84px; flex: none; background: rgba(15,28,69,.95); border-right: 1px solid var(--bd);
  display: flex; flex-direction: column; align-items: stretch; padding: 10px 6px; gap: 4px; overflow-y: auto;
}
.sidebar-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px;
  border-radius: 10px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: center;
}
.sidebar-btn .sb-icon { font-size: 20px; }
.sidebar-btn.active { background: var(--gold); color: #000; }
.sidebar-btn:hover:not(.active) { background: var(--glass2); color: var(--text); }
.sidebar-spacer { flex: 1; }
.sidebar-foot-btn { font-size: 10px; color: var(--muted); padding: 8px 4px; border-radius: 8px; text-align: center; }
.sidebar-foot-btn:hover { background: var(--glass2); color: var(--text); }
.main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }

/* ── SECCIONES (Clientes / Comprobantes / Cierre X-Z) ── */
.section-wrap { flex: 1; display: flex; flex-direction: column; padding: 16px 20px 20px; gap: 12px; max-width: 700px; margin: 0 auto; width: 100%; }
.section-title { color: var(--gold2); font-size: 18px; }
.comp-meta { font-size: 12px; color: var(--muted); }
.section-actions { display: flex; gap: 10px; margin-top: 8px; }
.section-actions button { flex: 1; }

.btn-primary, .btn-secondary, .btn-danger {
  padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
}
.btn-primary { background: var(--gold); color: #000; }
.btn-secondary { background: var(--glass); border: 1px solid var(--bd); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }

.search-inline { display: flex; gap: 8px; }
.search-inline input {
  flex: 1; background: var(--glass2); border: 2px solid var(--bd); border-radius: 12px;
  padding: 13px 16px; color: var(--text); font-size: 15px; outline: none;
}
.search-inline input:focus { border-color: var(--gold); }

.form-row { display: flex; flex-direction: column; gap: 4px; }
.form-row label { font-size: 12px; color: var(--muted); }
.form-row input, .form-row select {
  background: var(--glass2); border: 1px solid var(--bd); border-radius: 10px;
  padding: 11px 14px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
}
.form-row input:focus, .form-row select:focus { border-color: var(--gold); }
.form-row select option { background: var(--navy2); }

.list-wrap { display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--bd); border-radius: 12px; overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--bd);
}
.list-row:last-child { border-bottom: none; }
.list-row.clickable:hover { background: var(--glass2); cursor: pointer; }
.list-row.anulada { opacity: .5; }
.list-row .lr-info { flex: 1; min-width: 0; }
.list-row .lr-title { font-size: 14px; font-weight: 600; }
.list-row .lr-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.list-row .lr-amount { font-weight: 700; color: var(--gold2); }
.badge-anulada {
  background: rgba(229,86,109,.2); color: var(--danger); font-size: 9px; font-weight: 800;
  padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle;
}

/* ── ETIQUETAS ── */
.list-row.etq-row.checked { background: var(--glass2); }
.etq-check {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--bd); flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.etq-row.checked .etq-check { background: var(--gold); border-color: var(--gold); color: #000; }
.etq-qty { display: flex; align-items: center; gap: 6px; flex: none; }
.etq-qty button { width: 26px; height: 26px; border-radius: 8px; background: var(--glass2); font-size: 15px; font-weight: 700; }
.etq-qty span { min-width: 18px; text-align: center; font-size: 13px; font-weight: 700; }

/* ── SELECT CAJA / LOGIN screens ── */
.center-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 24px; gap: 22px;
}
.center-wrap h1 { font-size: 22px; color: var(--gold2); text-align: center; }
.big-choice-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.big-choice {
  background: var(--glass); border: 1px solid var(--bd); border-radius: 16px;
  padding: 26px 40px; font-size: 20px; font-weight: 700; color: var(--text);
  min-width: 160px; text-align: center;
}
.big-choice:hover { background: var(--glass2); border-color: var(--gold); }

.pin-dots { display: flex; gap: 14px; margin: 6px 0 4px; }
.pin-dot {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bd);
}
.pin-dot.filled { background: var(--gold); border-color: var(--gold); }
.keypad { display: grid; grid-template-columns: repeat(3, 74px); gap: 12px; }
.keypad button {
  width: 74px; height: 60px; border-radius: 12px; background: var(--glass);
  border: 1px solid var(--bd); font-size: 22px; font-weight: 700;
}
.keypad button:active { background: var(--glass2); }
.keypad button.wide { grid-column: span 1; font-size: 14px; color: var(--muted); }
.pin-error { color: var(--danger); font-size: 13px; min-height: 18px; }

/* ── VENTA screen ── */
.venta-wrap { flex: 1; display: flex; flex-direction: column; padding: 16px 20px 20px; gap: 14px; max-width: 900px; margin: 0 auto; width: 100%; }
.scan-box {
  display: flex; gap: 10px;
}
.scan-box input {
  flex: 1; background: var(--glass2); border: 2px solid var(--bd); border-radius: 12px;
  padding: 16px 18px; color: var(--text); font-size: 20px; outline: none;
}
.scan-box input:focus { border-color: var(--gold); }
.scan-box .cam-btn {
  flex: none; width: 56px; background: var(--glass2); border: 2px solid var(--bd);
  border-radius: 12px; font-size: 22px;
}
.scan-box .cam-btn:hover { border-color: var(--gold); }
.search-results {
  background: var(--navy2); border: 1px solid var(--bd); border-radius: 10px;
  max-height: 260px; overflow-y: auto; display: none;
}
.search-results.show { display: block; }
.search-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--bd); font-size: 14px;
}
.search-row:last-child { border-bottom: none; }
.search-row:hover { background: var(--glass2); }
.search-row .sr-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.search-row .sr-stock { font-size: 11px; color: var(--muted); }
.search-row .sr-stock.low { color: var(--warn); }
.search-row .sr-stock.none { color: var(--danger); }

.thumb { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; background: var(--glass2); flex: none; }
.thumb-ph {
  width: 38px; height: 38px; border-radius: 8px; background: var(--glass2); flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted);
}

/* ── CHIPS DE CATEGORÍA / GRILLA DE PRODUCTOS ── */
.cat-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.cat-chips::-webkit-scrollbar { display: none; }
.cat-chip {
  flex: none; background: var(--glass); border: 1.5px solid var(--bd); border-radius: 20px;
  padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap;
}
.cat-chip.active { background: var(--gold); color: #000; border-color: var(--gold); }

.grid-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.product-grid {
  flex: 3; min-height: 160px; overflow-y: auto; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;
  align-content: start;
}
.product-card {
  background: var(--glass); border: 1px solid var(--bd); border-radius: 12px;
  padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left;
}
.product-card:hover { border-color: var(--gold); background: var(--glass2); }
.product-card .pc-thumb { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: var(--glass2); }
.product-card .pc-thumb-ph {
  width: 100%; aspect-ratio: 1; border-radius: 8px; background: var(--glass2);
  display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--muted);
}
.product-card .pc-name {
  font-size: 12.5px; font-weight: 600; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.product-card .pc-price { font-size: 14px; font-weight: 800; color: var(--gold2); }
.product-card .pc-stock { font-size: 10.5px; color: var(--muted); }
.product-card .pc-stock.low { color: var(--warn); }
.product-card .pc-stock.none { color: var(--danger); }

.cart-wrap { flex: 2; min-height: 120px; overflow-y: auto; background: var(--glass); border: 1px solid var(--bd); border-radius: 12px; }
.cart-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.cart-row {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-bottom: 1px solid var(--bd);
}
.cart-row:last-child { border-bottom: none; }
.cart-row .cr-name { flex: 1; font-size: 14px; font-weight: 600; }
.cart-row .cr-unit { font-size: 11px; color: var(--muted); }
.cart-row .cr-qty-ctl { display: flex; align-items: center; gap: 6px; }
.cart-row .cr-qty-ctl button {
  width: 28px; height: 28px; border-radius: 8px; background: var(--glass2);
  border: 1px solid var(--bd); font-size: 16px; font-weight: 700;
}
.cart-row .cr-qty-ctl span { min-width: 22px; text-align: center; font-weight: 700; }
.cart-row .cr-total { min-width: 90px; text-align: right; font-weight: 700; }
.cart-row .cr-del { color: var(--danger); font-size: 18px; padding: 4px 6px; }

.totals-bar { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px; }
.totals-bar .tb-label { color: var(--muted); font-size: 14px; }
.totals-bar .tb-value { font-size: 26px; font-weight: 800; color: var(--gold2); }

.pay-methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pay-methods button {
  background: var(--glass); border: 1.5px solid var(--bd); border-radius: 10px;
  padding: 12px 6px; font-size: 12px; font-weight: 700; color: var(--text);
}
.pay-methods button.active { background: var(--gold); color: #000; border-color: var(--gold); }

.client-toggle {
  background: none; border: none; color: var(--gold2); font-size: 13px;
  text-align: left; padding: 2px 4px; text-decoration: underline;
}
.client-box { display: flex; gap: 8px; flex-wrap: wrap; }
.client-box input {
  flex: 1; min-width: 140px; background: var(--glass2); border: 1px solid var(--bd);
  border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; outline: none;
}
.client-box input:focus { border-color: var(--gold); }
.client-found { font-size: 12px; color: var(--ok); }

/* ── ESCANEO POR CÁMARA ── */
.scan-video-wrap {
  position: relative; border-radius: 14px; overflow: hidden; background: #000;
  min-height: 220px; margin-bottom: 10px;
}
.scan-video-wrap video { width: 100%; max-height: 280px; display: block; object-fit: cover; }
.scan-frame {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 80%; height: 90px; border: 2px solid var(--gold); border-radius: 10px; pointer-events: none;
}

.btn-cobrar {
  background: var(--ok); color: #06281a; font-weight: 800; font-size: 18px;
  padding: 16px; border-radius: 12px; text-align: center;
}
.btn-cobrar:disabled { opacity: .4; }
.btn-cobrar:active { transform: scale(.98); }

.banner { border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
.banner.err { background: rgba(229,86,109,.15); border: 1px solid rgba(229,86,109,.3); color: var(--danger); }
.banner.ok { background: rgba(62,207,142,.15); border: 1px solid rgba(62,207,142,.3); color: var(--ok); }

/* ── RESUMEN DEL DIA modal ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(5,10,30,.8); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
  background: var(--navy2); border-radius: 18px; padding: 20px;
}
.modal h2 { color: var(--gold2); font-size: 17px; margin-bottom: 14px; }
.sale-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--bd); font-size: 13px; }
.sale-row:last-child { border-bottom: none; }
.sale-row .s-time { color: var(--muted); }
.sale-row .s-pay { font-size: 10px; text-transform: uppercase; color: var(--gold2); }
.modal .close-btn { margin-top: 14px; width: 100%; background: var(--glass); border: 1px solid var(--bd); border-radius: 10px; padding: 10px; }

#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity .2s; z-index: 999; pointer-events: none; color: #fff;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
'use strict';

/* ── SUPABASE — mismo proyecto que Sabores Royal, sin login de admin:
   el cajero se identifica por PIN, no por sesión. Archivo standalone,
   solo comparte la base de datos (mismo criterio que caja-diaria.html). ── */
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcGd1bndlcWV6dGVkaGh0aGJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDczMjgsImV4cCI6MjA5ODMyMzMyOH0.KfZ8f8GlKoQoRxdPk-lrNDSTRcjd21z6d8CgITHf3WU';
const SUPABASE_URL = (()=>{ try{ const r=JSON.parse(atob(SUPABASE_KEY.split('.')[1])).ref; return 'https://'+r+'.supabase.co'; }catch(e){ return 'https://topgunweqeztedhhthbl.supabase.co'; } })();

async function posFetch(path, method, body, prefer){
  const headers = {'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
  if(prefer) headers['Prefer'] = prefer;
  const res = await fetch(SUPABASE_URL + '/rest/v1' + path, { method: method||'GET', headers, body: body?JSON.stringify(body):undefined });
  const text = await res.text();
  if(!res.ok){ let err; try{ err=JSON.parse(text); }catch(e){ err={message:text}; } throw new Error(err.message || 'HTTP '+res.status); }
  return text ? JSON.parse(text) : null;
}

/* ── STATE ── */
let screen = 'loading'; // loading | select-caja | login | venta
let caja = localStorage.getItem('pos_caja') || null;
let posConfig = { cajeros: [] };
let fiscal = { razonSocial:'Sabores Royal SRL', cuit:'30-71698572-1', domicilio:'Maipú 734, Rosario' };
let posBanner = null; // {image, title, subtitle, active} — cargado desde app_settings.pos_banner
let cajero = null;
let pinBuffer = '';
let pinError = '';
let products = [];
let cart = []; // [{id,name,price,qty,barcode}]
let payMethod = null;
let searchQuery = '';
let submitting = false;
let saleError = '';
let showClientBox = false;
let clientPhone = '';
let clientName = '';
let activeCategory = null; // null = "Todas"
let section = 'vender'; // vender | clientes | comprobantes | cierreX | cierreZ

/* ── CLIENTES ── */
let clienteQuery = '';
let clienteResults = [];
let clienteSearching = false;
let clienteEditando = null; // {phone,full_name,address,email} o null

/* ── COMPROBANTES ── */
let compVentas = [];
let compLoading = false;
let compDetalle = null;
let compFiltro = 'hoy'; // hoy | ayer | 7d | todos | rango
let compDesde = '';
let compHasta = '';
let compCliente = '';
let compPago = 'todos'; // todos | efectivo | debito | credito | qr

/* ── CIERRE X / Z ── */
let cierrePreview = null; // {periodStart, periodEnd, total, count, byPayment}
let cierreLoading = false;

const PAY_LABELS = {efectivo:'Efectivo', debito:'Débito', credito:'Crédito', qr:'QR / Mercado Pago'};
const SECCIONES = [
  {key:'vender', icon:'🛒', label:'Vender'},
  {key:'clientes', icon:'👤', label:'Clientes'},
  {key:'comprobantes', icon:'🧾', label:'Comprobantes'},
  {key:'etiquetas', icon:'🏷️', label:'Etiquetas'},
  {key:'cierreX', icon:'📊', label:'Cierre X'},
  {key:'cierreZ', icon:'🔒', label:'Cierre Z'},
];

/* ── ETIQUETAS DE PRECIO ── */
let etqQuery = '';
let etqCat = null; // null = todas
let etqSelected = {}; // id -> qty

/* ── ESCANEO POR CÁMARA (respaldo del lector USB) ──
   Versión recortada, standalone, de openBarcodeScannerModal() en
   index.html (líneas ~5050-5265): mismo motor de dos pasos (BarcodeDetector
   nativo, con @zxing/browser por CDN de respaldo), pero solo el modo
   "single scan" — acá siempre se busca un producto para agregar al
   carrito, no hace falta el modo de asignación masiva de Admin Productos. */
const BARCODE_FORMATS_NATIVE = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf','qr_code'];
let _barcodeStream = null;
let _barcodePollTimer = null;
let _zxingControls = null;
let _zxingLoadPromise = null;

function render(){
  const el = document.getElementById('app');
  if(screen === 'loading') el.innerHTML = `<div class="center-wrap"><h1>Cargando…</h1></div>`;
  else if(screen === 'select-caja') el.innerHTML = renderSelectCaja();
  else if(screen === 'login') el.innerHTML = renderLogin();
  else if(screen === 'venta') el.innerHTML = renderVenta();
  if(screen === 'venta' && section === 'vender'){
    const inp = document.getElementById('scan-input');
    if(inp) inp.focus();
  }
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='err' ? '#c0392b' : type==='ok' ? '#1e7e34' : '#8a6800';
  t.className = 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className=''; }, 2600);
}

/* ── SELECT CAJA ── */
function logoHtml(size){
  return `<img src="apple-touch-icon.png" class="brand-logo" style="width:${size}px; height:${size}px;" onerror="this.style.display='none'">`;
}
function renderSelectCaja(){
  return `<div class="center-wrap">
    ${logoHtml(72)}
    <h1>¿Esta computadora es Caja 1 o Caja 2?</h1>
    <div class="big-choice-row">
      <button class="big-choice" onclick="chooseCaja('Caja 1')">Caja 1</button>
      <button class="big-choice" onclick="chooseCaja('Caja 2')">Caja 2</button>
    </div>
  </div>`;
}
function chooseCaja(c){
  caja = c;
  localStorage.setItem('pos_caja', c);

function filterProducts(){
  const q = norm(searchQuery);
  if(q.length < 2) return [];
  return products.filter(p => norm(p.name).includes(q)).slice(0,50);
}
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }

function onSearchInput(v){
  searchQuery = v;

  render();
  const inp = document.getElementById('scan-input');

function onScanKeydown(ev){
  if(ev.key !== 'Enter') return;
  const raw = searchQuery.trim();
  if(!raw) return;
  const byBarcode = products.find(p => p.barcode && p.barcode === raw);
  if(byBarcode){ addToCart(byBarcode.id); return; }
  const matches = filterProducts();
  if(matches.length === 1){ addToCart(matches[0].id); return; }
  toast(matches.length ? 'Hay varias coincidencias, elegí de la lista' : 'No se encontró el producto', 'err');
}
function addToCart(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const existing = cart.find(it=>it.id===id);
  if(existing) existing.qty += 1;
  else cart.push({id:p.id, name:p.name, price:p.price, qty:1, barcode:p.barcode||'', photo_url:p.photo_url, photo_clean_url:p.photo_clean_url});
  searchQuery = '';
  saleError = '';
  render();
}
function changeQty(i, delta){
  cart[i].qty += delta;
  if(cart[i].qty <= 0) cart.splice(i,1);
  render();
}
function removeFromCart(i){ cart.splice(i,1); render(); }
function cartTotal(){ return cart.reduce((s,it)=>s+it.price*it.qty,0); }
function money(n){ return '$' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function confirmSale(){
  if(!cart.length || !payMethod || submitting) return;
  submitting = true; saleError=''; render();
  const items = cart.map(it=>({id:it.id, name:it.name, qty:it.qty, price:it.price, lineTotal:it.price*it.qty, barcode:it.barcode}));
  const subtotal = cartTotal();
  try{
    const rpcBody = {
      p_caja: caja, p_cajero: cajero, p_items: items,
      p_subtotal: subtotal, p_total: subtotal, p_payment_method: payMethod
    };
    // Solo se manda el cliente si se cargó algo — así una venta sin cliente
    // sigue funcionando igual aunque todavía no se haya corrido la migración
    // que le agrega esos dos parámetros a create_pos_sale().
    if(clientPhone.trim()){ rpcBody.p_client_phone = clientPhone.trim(); rpcBody.p_client_name = clientName.trim(); }
    const rows = await posFetch('/rpc/create_pos_sale', 'POST', rpcBody, 'return=representation');
    const sale = Array.isArray(rows) ? rows[0] : rows;
    cart.forEach(it=>{ const p = products.find(x=>x.id===it.id); if(p) p.stock -= it.qty; });
    printTicket(sale || {id:'', items, total:subtotal, payment_method:payMethod, created_at:new Date().toISOString(), client_phone:clientPhone, client_name:clientName});
    cart = []; payMethod = null; clientPhone = ''; clientName = ''; showClientBox = false;
    toast('Venta cobrada', 'ok');
  }catch(e){
    const m = String(e.message||'');
    if(m.startsWith('sin_stock:')) saleError = 'Sin stock suficiente: ' + m.slice(10);
    else saleError = 'Error al cobrar: ' + m;
    toast(saleError, 'err');
  }finally{
    submitting = false; render();
  }
}

function openCameraScanner(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeCameraScanner()"><div class="modal">
    <h2>Escanear producto</h2>
    <div class="scan-video-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    <p id="cam-status" style="font-size:12px; color:var(--muted); text-align:center; margin-bottom:10px;">Apuntá la cámara al código de barras…</p>
    <button class="close-btn" onclick="closeCameraScanner()">Cancelar</button>
  </div></div>`;
  startBarcodeCamera();
}
function closeCameraScanner(){
  pauseBarcodeCamera();
  closeModal();
}
function setCamStatus(msg){ const el = document.getElementById('cam-status'); if(el) el.textContent = msg; }
function onBarcodeDetected(code){
  if(!code) return;
  closeCameraScanner();
  const p = products.find(x => x.barcode && x.barcode === code);
  if(p) addToCart(p.id);
  else toast('Código no encontrado: ' + code, 'err');
}
function loadZXingLib(){
  if(window.ZXingBrowser) return Promise.resolve();
  if(_zxingLoadPromise) return _zxingLoadPromise;
  _zxingLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/browser@0.1.5';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _zxingLoadPromise=null; reject(new Error('No se pudo cargar el lector de respaldo')); };
    document.head.appendChild(s);
  });
  return _zxingLoadPromise;
}
function startBarcodeCamera(){
  const video = document.getElementById('cam-video');
  if(video) video.addEventListener('loadedmetadata', ()=>{ video.play().catch(()=>{}); });
  let decided = false;
  const fallbackTimer = setTimeout(()=>{ if(!decided){ decided=true; startBarcodeCameraZXing(); } }, 2500);
  if(window.BarcodeDetector){
    BarcodeDetector.getSupportedFormats().then(supported=>{
      if(decided) return; decided=true; clearTimeout(fallbackTimer);
      const wanted = BARCODE_FORMATS_NATIVE.filter(f=>supported.includes(f));
      if(wanted.length) startBarcodeCameraNative(wanted); else startBarcodeCameraZXing();
    }).catch(()=>{ if(decided) return; decided=true; clearTimeout(fallbackTimer); startBarcodeCameraZXing(); });
  } else {
    decided = true; clearTimeout(fallbackTimer);
    startBarcodeCameraZXing();
  }
}
function startBarcodeCameraNative(formats){
  const video = document.getElementById('cam-video');
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} } }).then(stream=>{
    _barcodeStream = stream;
    video.srcObject = stream;
    video.play().catch(()=>{});
    try{
      const detector = new BarcodeDetector({formats});
      _barcodePollTimer = setInterval(()=>{
        if(!video || video.readyState < 2) return;
        detector.detect(video).then(codes=>{
          if(codes && codes.length) onBarcodeDetected(codes[0].rawValue);
        }).catch(()=>{});
      }, 180);
    }catch(e){
      pauseBarcodeCamera();
      startBarcodeCameraZXing();
    }
  }).catch(err=>{ setCamStatus('No se pudo abrir la cámara: '+(err.message||err)); });
}
function startBarcodeCameraZXing(){
  const video = document.getElementById('cam-video');
  loadZXingLib().then(()=>{
    let hints = undefined;
    try{
      if(ZXingBrowser.DecodeHintType && ZXingBrowser.BarcodeFormat){
        const F = ZXingBrowser.BarcodeFormat;
        hints = new Map();
        hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS, [
          F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODABAR, F.ITF, F.QR_CODE,
        ]);
      }
    }catch(e){ hints = undefined; }
    const codeReader = new ZXingBrowser.BrowserMultiFormatReader(hints);
    codeReader.decodeFromConstraints(
      { video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080} } },
      video,
      (result)=>{ if(result) onBarcodeDetected(result.getText()); }
    ).then(controls=>{ _zxingControls = controls; })
    .catch(err=>{ setCamStatus('No se pudo abrir la cámara: '+(err.message||err)); });
  }).catch(err=>{ setCamStatus(err.message); });
}
function pauseBarcodeCamera(){
  if(_barcodePollTimer){ clearInterval(_barcodePollTimer); _barcodePollTimer=null; }
  if(_zxingControls){ try{ _zxingControls.stop(); }catch(e){} _zxingControls=null; }
  if(_barcodeStream){ _barcodeStream.getTracks().forEach(t=>t.stop()); _barcodeStream=null; }
  const video = document.getElementById('cam-video');
  if(video) video.srcObject = null;
}

/* ── COMPROBANTES (buscar / ver / anular) ── */
async function cargarComprobantes(){
  compLoading = true; compDetalle = null; render();
  try{
    let q = '/pos_sales?caja=eq.'+encodeURIComponent(caja)+'&order=created_at.desc&select=*&limit=500';
    if(compFiltro==='hoy' || compFiltro==='ayer' || compFiltro==='7d'){
      const d = new Date();
      if(compFiltro==='ayer') d.setDate(d.getDate()-1);
      if(compFiltro==='7d') d.setDate(d.getDate()-6);
      d.setHours(0,0,0,0);
      let d2;
      if(compFiltro==='ayer'){ d2 = new Date(d); d2.setDate(d2.getDate()+1); }
      else { d2 = new Date(); d2.setDate(d2.getDate()+1); d2.setHours(0,0,0,0); }
      q += '&created_at=gte.'+d.toISOString()+'&created_at=lt.'+d2.toISOString();
    } else if(compFiltro==='rango'){
      if(compDesde){ const d = new Date(compDesde+'T00:00:00'); q += '&created_at=gte.'+d.toISOString(); }
      if(compHasta){ const d = new Date(compHasta+'T00:00:00'); d.setDate(d.getDate()+1); q += '&created_at=lt.'+d.toISOString(); }
    }
    if(compPago !== 'todos'){ q += '&payment_method=eq.'+encodeURIComponent(compPago); }
    const cli = compCliente.trim();
    if(cli){ q += '&or=('+['client_name.ilike.*'+encodeURIComponent(cli)+'*','client_phone.ilike.*'+encodeURIComponent(cli)+'*'].join(',')+')'; }
    compVentas = await posFetch(q) || [];
  }catch(e){ toast('Error: '+e.message, 'err'); compVentas = []; }
  compLoading = false; render();
}
function setCompFiltro(f){ compFiltro = f; cargarComprobantes(); }
function aplicarCompRango(){
  const desde = document.getElementById('comp-desde'); const hasta = document.getElementById('comp-hasta');
  compDesde = desde ? desde.value : ''; compHasta = hasta ? hasta.value : '';
  compFiltro = 'rango'; cargarComprobantes();
}
function setCompPago(p){ compPago = p; cargarComprobantes(); }
function buscarCompCliente(){
  const inp = document.getElementById('comp-cliente');
  compCliente = inp ? inp.value : compCliente;
  cargarComprobantes();
}
function verComprobante(id){ compDetalle = compVentas.find(v=>v.id===id) || null; render(); }
function cerrarComprobante(){ compDetalle = null; render(); }
function reimprimirComprobante(){ if(compDetalle) printTicket(compDetalle); }
async function anularVentaActual(){
  if(!compDetalle) return;
  if(!confirm('¿Anular esta venta? Se devuelve el stock y queda marcada como anulada.')) return;
  try{
    const rows = await posFetch('/rpc/cancel_pos_sale', 'POST', {p_sale_id: compDetalle.id}, 'return=representation');
    const updated = Array.isArray(rows) ? rows[0] : rows;
    (updated.items||[]).forEach(it=>{ const p = products.find(x=>x.id===it.id); if(p) p.stock += (it.qty||0); });
    compDetalle = updated;
    const idx = compVentas.findIndex(v=>v.id===updated.id);
    if(idx>=0) compVentas[idx] = updated;
    toast('Venta anulada', 'ok');
    render();
  }catch(e){ toast('Error al anular: '+e.message, 'err'); }
}

/* ── ETIQUETAS DE PRECIO ── */
function etqCategorias(){
  const set = new Set(products.map(p=>p.cat));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}
function etqFiltered(){
  const q = etqQuery.trim().toLowerCase();
  return products.filter(p=>{
    if(etqCat && p.cat !== etqCat) return false;
    if(q && !(p.name.toLowerCase().includes(q) || (p.barcode||'').includes(q))) return false;
    return true;
  });
}
function etqToggle(id){ if(etqSelected[id]) delete etqSelected[id]; else etqSelected[id] = 1; render(); }
function etqSetQty(id, delta){ const cur = etqSelected[id] || 1; etqSelected[id] = Math.max(1, Math.min(99, cur + delta)); render(); }
function etqSelectAllFiltered(){ etqFiltered().forEach(p=>{ if(!etqSelected[p.id]) etqSelected[p.id] = 1; }); render(); }
function etqClear(){ etqSelected = {}; render(); }
function etqSelectedIds(){ return Object.keys(etqSelected).filter(id=>etqSelected[id]>0); }
function etqTotal(){ return etqSelectedIds().reduce((s,id)=>s+(etqSelected[id]||0), 0); }

/* ── CIERRE X / Z ── */
async function cargarCierrePreview(){
  cierreLoading = true; render();
  try{
    const closures = await posFetch('/pos_closures?caja=eq.'+encodeURIComponent(caja)+'&order=period_end.desc&limit=1&select=period_end');
    const periodStart = (closures && closures[0]) ? closures[0].period_end : '2000-01-01T00:00:00Z';
    const periodEnd = new Date().toISOString();
    const sales = await posFetch('/pos_sales?caja=eq.'+encodeURIComponent(caja)+'&status=neq.anulada&created_at=gt.'+periodStart+'&created_at=lte.'+periodEnd+'&select=*') || [];
    const total = sales.reduce((s,v)=>s+Number(v.total||0),0);
    const byPayment = {};
    sales.forEach(v=>{ const k=v.payment_method||'?'; if(!byPayment[k]) byPayment[k]={total:0,cant:0}; byPayment[k].total+=Number(v.total||0); byPayment[k].cant++; });
    cierrePreview = { periodStart, periodEnd, total, count: sales.length, byPayment };
  }catch(e){ toast('Error: '+e.message, 'err'); cierrePreview = null; }
  cierreLoading = false; render();
}
async function confirmarCierreZ(){
  if(!confirm('¿Cerrar Z? Se guarda este resumen y arranca un período nuevo. No es un cierre fiscal ante AFIP.')) return;
  try{
    const rows = await posFetch('/rpc/close_pos_batch', 'POST', {p_caja: caja, p_cajero: cajero}, 'return=representation');
    const closure = Array.isArray(rows) ? rows[0] : rows;
    toast('Cierre Z guardado', 'ok');
    imprimirCierre('Z', closure);
    await cargarCierrePreview();
  }catch(e){ toast('Error al cerrar: '+e.message, 'err'); }
}

  win.document.close();

function renderSeccionCierre(tipo){
  return `<div class="section-wrap">

/* ── HELPERS ── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

/* ── INIT ── */
async function init(){
  try{
    const [settingsRows, productRows] = await Promise.all([
      posFetch('/app_settings?setting_key=in.(pos_config,fiscal_config,pos_banner)&select=setting_key,setting_value'),
      posFetch('/products?select=id,name,price,stock,barcode,cat,photo_url,photo_clean_url&order=name'),
    ]);
    (settingsRows||[]).forEach(row=>{
      try{
        const parsed = JSON.parse(row.setting_value);
        if(row.setting_key === 'pos_config' && parsed && parsed.cajeros) posConfig = parsed;
        if(row.setting_key === 'fiscal_config' && parsed) fiscal = Object.assign({}, fiscal, parsed);
        if(row.setting_key === 'pos_banner' && parsed) posBanner = parsed;
      }catch(e){}
    });
    products = (productRows||[]).map(p=>({id:p.id, name:p.name, price:Number(p.price)||0, stock:Number(p.stock)||0, barcode:p.barcode||'', cat:p.cat||'Otros', photo_url:p.photo_url||'', photo_clean_url:p.photo_clean_url||''}));
  }catch(e){
    toast('No se pudo conectar: ' + e.message, 'err');
  }
  screen = caja ? 'login' : 'select-caja';
  render();
}
init();
</script>
</body>
</html>
