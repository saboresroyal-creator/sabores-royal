<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QR Sabores Royal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Montserrat', Arial, sans-serif;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .card{
    width:340px;
    border:3px solid #0f1c45;
    border-radius:24px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 8px 32px rgba(15,28,69,0.18);
  }
  .header{
    background:#0f1c45;
    padding:22px 20px 16px;
  }
  .header img{
    width:82px; height:82px; object-fit:cover;
    border-radius:20px; margin-bottom:12px;
  }
  .header h1{
    color:#c5a028;
    font-size:22px; font-weight:900;
    letter-spacing:.5px;
  }
  .header p{
    color:rgba(255,255,255,0.65);
    font-size:11px; margin-top:4px;
    letter-spacing:1.5px; text-transform:uppercase;
  }
  .qr-wrap{
    background:#fff;
    padding:24px 20px 18px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .qr-wrap img{
    width:240px; height:240px;
    border:3px solid #0f1c45;
    border-radius:12px;
    display:block;
  }
  .cta{
    font-size:13.5px; font-weight:700;
    color:#0f1c45; letter-spacing:-.1px;
  }
  .sub{
    font-size:11px; color:#666;
    line-height:1.5;
  }
  .footer{
    background:#0f1c45;
    padding:12px 20px;
  }
  .footer p{
    color:rgba(255,255,255,0.5);
    font-size:10px; letter-spacing:.5px;
  }
  .steps{
    display:flex; justify-content:center; gap:14px;
    margin-top:10px;
  }
  .step{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; color:#0f1c45; font-weight:600; width:72px;
  }
  .step-icon{
    width:34px; height:34px; border-radius:50%;
    background:#0f1c45; color:#c5a028;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }

  @media print{
    body{ min-height:unset; }
    .card{ box-shadow:none; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="icon-clients-192.png" alt="Sabores Royal" style="width:82px; height:82px; border-radius:20px; margin-bottom:12px; display:block; margin-left:auto; margin-right:auto;">
    <h1>Sabores Royal</h1>
    <p>Maipú 734 · Rosario</p>
  </div>

  <div class="qr-wrap">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=480x480&qzone=2&ecc=M&data=https%3A%2F%2Fsensational-selkie-f824d8.netlify.app"
      alt="QR Sabores Royal"
    >
    <div class="cta">¡Escaneá y pedí desde tu celular!</div>
    <div class="sub">
      Catálogo completo · Carrito de compras<br>
      Seguimiento de puntos Royal
    </div>

    <div class="steps">
      <div class="step">
        <div class="step-icon">📷</div>
        Escaneá el QR
      </div>
      <div class="step">
        <div class="step-icon">🌐</div>
        Abrí la app
      </div>
      <div class="step">
        <div class="step-icon">📲</div>
        Agregá al inicio
      </div>
    </div>
  </div>

  <div class="footer">
    <p>sensational-selkie-f824d8.netlify.app</p>
  </div>
</div>

<script>
  // Auto-print al abrir
  // window.onload = () => window.print();
</script>
</body>
</html>
