
<!DOCTYPE html>
<html lang="es">
<head>
<script defer src="/_vercel/insights/script.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sabores Royal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1c45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sabores Royal">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1c45; --navy2:#1a2a5e; --navy3:#24356f;
  --gold:#c5a028; --gold2:#e0bb4a; --goldlight:#f3d98a;
  --cream:#f8f5ec; --white:#ffffff;
  --glass:rgba(255,255,255,0.06); --glass-bd:rgba(255,255,255,0.12);
  --ok:#3ecf8e; --warn:#e0a83c; --danger:#e5566d;
  --pink:#ff3d81; --pink-deep:#c91361;
  --radius:18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
svg{width:16px; height:16px; flex-shrink:0; vertical-align:middle;}
select option{background:var(--navy2); color:var(--white);}
html,body{
  font-family:'DM Sans',sans-serif; background:var(--navy);
  color:var(--cream); min-height:100vh; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:15px;}
img{display:block; max-width:100%;}
::-webkit-scrollbar{width:0; height:0;}

#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative;
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy2) 100%);
  display:flex; flex-direction:column;}

.screen{flex:1; display:flex; flex-direction:column; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- TOPBAR ---------- */
.topbar{
  display:flex; align-items:center; gap:10px; padding:14px 16px;
  background:rgba(15,28,69,0.85); border-bottom:1px solid var(--glass-bd);
  position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
}
.topbar .back{width:36px; height:36px; border-radius:50%; background:var(--glass);
  display:flex; align-items:center; justify-content:center; border:1px solid var(--glass-bd);}
.topbar .back svg{ transform:scaleX(-1); }
.topbar h2{font-size:18px; flex:1; color:var(--goldlight);}
.topbar .logo-mini{width:32px; height:auto;}

/* ---------- GLASSMORPHISM CARD ---------- */
.glass{
  background:var(--glass); border:1px solid var(--glass-bd);
  border-radius:var(--radius); backdrop-filter:blur(14px);
}

/* ---------- HOME ---------- */
.home-header{
  padding:34px 20px 22px; text-align:center; position:relative;
  background:radial-gradient(circle at 50% 0%, rgba(197,160,40,0.18), transparent 70%);
}
.home-logo{width:108px; margin:0 auto 14px;}
.home-header h1{font-size:26px; color:var(--white); letter-spacing:.5px;}
.home-header p{font-size:13px; color:var(--gold2); margin-top:4px; letter-spacing:1.5px; text-transform:uppercase;}

.section-cards{padding:12px 16px 8px; display:flex; flex-direction:column; gap:12px;}
.section-card{
  display:flex; align-items:center; gap:16px; padding:16px 18px;
  border-radius:18px; position:relative; text-align:left;
  border:1px solid var(--glass-bd); background:var(--glass);
  transition:transform .15s ease;
}
.section-card:active{transform:scale(.97);}
.section-card.natural  {background:linear-gradient(135deg,rgba(90,180,55,0.95),rgba(58,140,45,0.85)); border-color:rgba(140,220,90,0.55);}
.section-card.golosinas{background:linear-gradient(135deg,rgba(47,27,71,0.9),rgba(47,27,71,0.5)); border-color:rgba(180,140,30,0.35);}
.section-card.market   {background:linear-gradient(135deg,rgba(20,31,60,0.9),rgba(20,31,60,0.5)); border-color:rgba(180,140,30,0.35);}
.section-card.celiaco  {background:linear-gradient(135deg,rgba(73,24,29,0.9),rgba(73,24,29,0.5)); border-color:rgba(180,140,30,0.35);}
.section-card.sinazucar{background:linear-gradient(135deg,rgba(73,60,22,0.9),rgba(73,60,22,0.5)); border-color:rgba(220,170,0,0.45);}
.section-card.fiambreria{background:linear-gradient(135deg,rgba(15,28,69,0.9),rgba(143,122,48,0.55)); border-color:rgba(224,187,74,0.5);}
.section-card.navidad  {background:linear-gradient(135deg,rgba(155,20,30,0.92),rgba(20,90,45,0.82)); border-color:rgba(220,170,0,0.5);}
.section-card.featured {background:var(--glass); border-color:var(--glass-bd); box-shadow:none;}
.sc-badge{display:none;}
.sc-icon{
  width:62px; height:62px; flex:none; border-radius:50%;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.section-card.natural   .sc-icon{background:transparent;}
.section-card.golosinas .sc-icon{background:rgba(55,10,40,0.9);}
.section-card.market    .sc-icon{background:rgba(10,26,72,0.9);}
.section-card.celiaco   .sc-icon{background:rgba(14,48,26,0.9);}
.section-card.navidad   .sc-icon{background:rgba(90,10,15,0.9);}
.sc-icon svg{width:30px; height:30px; color:var(--gold);}
.sc-icon img{width:100%; height:100%; object-fit:contain; border-radius:50%;}
.section-card h3{font-size:17px; color:var(--white); margin-bottom:3px; font-weight:700;}
.section-card p{font-size:13px; color:rgba(255,255,255,0.52);}
.sc-arrow{margin-left:auto; opacity:.35; flex-shrink:0;}
.sc-arrow svg{width:18px; height:18px;}

.wa-float-btn{
  margin:6px 18px 24px; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:14px; border-radius:50px; background:#25D366; color:#fff; font-weight:700; font-size:14.5px;
  box-shadow:0 6px 18px rgba(37,211,102,0.35);
}
.wa-float-btn svg{width:20px; height:20px;}

.offers-banner{
  margin:0 18px 18px; padding:14px 16px; border-radius:14px;
  background:linear-gradient(120deg, rgba(197,160,40,0.22), rgba(197,160,40,0.08));
  border:1px solid rgba(197,160,40,0.55);
  box-shadow:0 4px 16px rgba(197,160,40,0.12);
  display:flex; align-items:center; gap:12px; font-size:12.5px; font-weight:500;
  color:rgba(255,255,255,0.85);
}
.offers-banner .ob-icon{
  flex:none; width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));
}
.offers-banner .ob-icon svg{width:19px; height:19px;}
.offers-banner b{color:var(--gold2); font-weight:700;}

/* ---------- INICIO: fondo a rayas (solo cuando no hay foto de fondo custom) ---------- */
.home-stripes{
  background:repeating-linear-gradient(135deg, #4fc8fb 0px, #4fc8fb 46px, #3fb6ee 46px, #3fb6ee 92px);
}
.home-stripes .home-header h1{text-shadow:0 2px 0 #0f4c78, 0 4px 10px rgba(5,30,55,0.4);}
.home-stripes .home-header p{color:var(--navy); text-shadow:none;}
.home-stripes .offers-banner{
  background:linear-gradient(180deg,#fffdf6,#fbf1cf);
  border:1px solid #f0dca3; box-shadow:0 8px 18px -8px rgba(10,40,70,0.35);
  color:#6b5730;
}
.home-stripes .offers-banner b{color:#a8760a;}
.home-stripes .offers-banner .ob-icon{filter:none;}
.home-stripes .section-card{box-shadow:0 10px 20px -10px rgba(5,30,55,0.5);}
.home-stripes .section-card.natural  {background:linear-gradient(135deg,rgba(90,180,55,0.96),rgba(58,140,45,0.86));}
.home-stripes .section-card.golosinas{background:linear-gradient(135deg,rgba(47,27,71,0.96),rgba(47,27,71,0.82));}
.home-stripes .section-card.market   {background:linear-gradient(135deg,rgba(20,31,60,0.96),rgba(20,31,60,0.82));}
.home-stripes .section-card.celiaco  {background:linear-gradient(135deg,rgba(73,24,29,0.96),rgba(73,24,29,0.82));}
.home-stripes .section-card.sinazucar{background:linear-gradient(135deg,rgba(73,60,22,0.96),rgba(73,60,22,0.82));}
.home-stripes .section-card.fiambreria{background:linear-gradient(135deg,rgba(15,28,69,0.96),rgba(143,122,48,0.8));}
.home-stripes .section-card.navidad  {background:linear-gradient(135deg,rgba(155,20,30,0.97),rgba(20,90,45,0.88));}

.home-promo-banner{
  margin:0 16px 16px; padding:18px; border-radius:18px; cursor:pointer;
  background:linear-gradient(120deg,#ff4d3d,#ff1f1f 55%,#c60000);
  box-shadow:0 10px 28px rgba(255,20,20,0.5);
  border:2px solid #ffd400;
  display:flex; align-items:center; gap:14px;
  animation:homePromoGlow 1.8s ease-in-out infinite;
}
.home-promo-banner .hpb-pct{
  flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#ffe066,#ffd400); color:#c60000; border-radius:14px;
  padding:8px 10px; min-width:66px; line-height:1; box-shadow:0 3px 10px rgba(0,0,0,0.25);
}
.home-promo-banner .hpb-pct-num{font-size:28px; font-weight:900; letter-spacing:-0.02em;}
.home-promo-banner .hpb-pct-off{font-size:11px; font-weight:800; letter-spacing:.06em; margin-top:1px;}
.home-promo-banner .hpb-body{flex:1; min-width:0;}
.home-promo-banner .hpb-title{color:#fff; font-size:17px; font-weight:800; text-wrap:balance; text-shadow:0 1px 4px rgba(0,0,0,0.25);}
.home-promo-banner .hpb-sub{color:#ffe4e4; opacity:.95; font-size:12.5px; margin-top:3px;}
.home-promo-banner .hpb-arrow{color:#fff; font-size:24px; font-weight:700; flex:none;}
@keyframes homePromoGlow{
  0%,100%{box-shadow:0 10px 28px rgba(255,20,20,0.5); transform:scale(1);}
  50%{box-shadow:0 16px 42px rgba(255,20,20,0.9); transform:scale(1.015);}
}
@media (prefers-reduced-motion: reduce){ .home-promo-banner{animation:none;} }

/* ---------- BOTTOM NAV ---------- */
.bottomnav{
  display:flex; justify-content:space-around; align-items:center;
  margin:0 12px 14px; padding:9px 4px;
  background:linear-gradient(160deg, var(--pink) 0%, var(--pink-deep) 100%);
  border-radius:999px; position:sticky; bottom:14px; z-index:50;
  box-shadow:0 10px 24px -8px rgba(140,10,70,0.55);
}
.bottomnav button{display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:10px; font-weight:700; color:rgba(255,255,255,0.65); padding:4px 8px;}
.bottomnav button.active{color:#fff;}
.bottomnav button.active svg{filter:drop-shadow(0 0 6px rgba(255,255,255,0.55));}
.bottomnav svg{width:20px; height:20px;}
.bottomnav .nav-cart-circle{
  width:44px; height:44px; margin-top:-26px; border-radius:50%;
  background:linear-gradient(150deg,#fff,#ffe0ec);
  border:3px solid var(--pink-deep);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 rgba(80,0,40,0.35), 0 8px 16px -6px rgba(0,0,0,0.45);
}
.bottomnav .nav-cart-circle svg{width:21px; height:21px; color:var(--pink-deep);}
.bottomnav button.nav-cart.active .nav-cart-circle{
  background:linear-gradient(150deg,var(--goldlight),var(--gold)); border-color:#fff;
}
.bottomnav button.nav-cart.active .nav-cart-circle svg{color:var(--navy);}

/* ---------- LISTS / CATALOG ---------- */
.search-wrap{position:relative; margin:14px 16px;}
.search-bar{padding:11px 14px; display:flex; align-items:center; gap:8px;
  border-radius:14px; background:var(--glass); border:1px solid var(--glass-bd);}
.search-bar input{background:none; border:none; outline:none; color:var(--cream); flex:1; font-size:14px;}
.search-bar svg{width:17px; height:17px; opacity:.5;}

.chip-row{display:flex; gap:8px; padding:0 16px 12px; overflow-x:auto;}
.chip{flex:none; padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:600;
  background:var(--glass); border:1px solid var(--glass-bd); color:rgba(255,255,255,0.7); white-space:nowrap;}
.chip.active{background:var(--gold); color:var(--navy); border-color:var(--gold);}

.product-grid{display:grid; grid-template-columns:1fr 1fr; gap:13px; padding:4px 16px 18px;}
.product-card{border-radius:20px; overflow:hidden; background:var(--glass); border:1px solid var(--glass-bd);}
.pc-img{aspect-ratio:1; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; position:relative;}
.pc-img img{width:100%; height:100%; object-fit:contain;}
.pc-img svg{width:38px; height:38px; opacity:.25;}
.pc-stock-low{position:absolute; top:8px; left:8px; background:var(--warn); color:var(--navy);
  font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:10px;}
.pc-stock-out{position:absolute; top:8px; left:8px; background:var(--danger); color:#fff;
  font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:10px;}
.pc-promo-badge{position:absolute; top:8px; right:8px; z-index:1; background:linear-gradient(135deg,#ffe066,#ffd400);
  color:#c62222; font-size:12px; font-weight:800; padding:4px 10px; border-radius:11px;
  box-shadow:0 2px 8px rgba(255,212,0,0.6); animation:pcPromoPulse 1.8s ease-in-out infinite;}
@keyframes pcPromoPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.1);}}
@media (prefers-reduced-motion: reduce){ .pc-promo-badge{animation:none;} }
.pc-body{padding:13px 14px 15px;}
.pc-body h4{font-size:13.5px; font-weight:600; color:var(--white); line-height:1.35; margin-bottom:7px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.pc-price{font-size:19px; font-weight:800; color:var(--gold2); letter-spacing:-.2px;}
.pc-add{margin-top:10px; width:100%; padding:9px; border-radius:11px; background:var(--gold); color:var(--navy);
  font-weight:700; font-size:13px;}
.pc-add:disabled{background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.35);}

.empty-state{padding:60px 30px; text-align:center; color:rgba(255,255,255,0.4);}
.empty-state svg{width:50px; height:50px; opacity:.3; margin:0 auto 12px;}

/* ---------- CANDY THEME (solo pantallas de listado: Catálogo, Apto Celíaco, Ofertas) ---------- */
.candy-catalog{
  --c-sky:#5ac8ff; --c-violet:#7c4dff; --c-violet-deep:#4a1f8f; --c-plum:#2c0f52;
  --c-pink:#ff3d81; --c-pink-deep:#c91361; --c-gold:#ffcb3d; --c-gold-deep:#e69a00;
  background:linear-gradient(180deg, var(--c-plum) 0%, #200a3f 100%);
}
.candy-catalog .topbar{
  background:linear-gradient(160deg, var(--c-sky) 0%, var(--c-violet) 65%, var(--c-violet-deep) 100%);
  border-bottom:none; box-shadow:0 8px 20px -10px rgba(20,0,50,0.6);
}
.candy-catalog .topbar h2{
  font-family:'Baloo 2',sans-serif; font-weight:800; color:#fff; letter-spacing:.01em;
  -webkit-text-stroke:1px var(--c-pink-deep); paint-order:stroke fill;
}
.candy-catalog .topbar .back{background:rgba(255,255,255,0.25); border-color:rgba(255,255,255,0.4);}
.candy-catalog .topbar .back svg{color:#fff;}
.candy-catalog .search-bar{background:#fff; border:none; border-radius:999px; box-shadow:0 4px 14px -6px rgba(20,0,50,0.4);}
.candy-catalog .search-bar input{color:var(--c-plum);}
.candy-catalog .search-bar input::placeholder{color:#9c8aa8;}
.candy-catalog .search-bar svg{color:var(--c-pink-deep); opacity:.7;}
.candy-catalog .chip{
  background:rgba(255,255,255,0.16); border:2px solid transparent; color:#fff;
  font-family:'Baloo 2',sans-serif; font-weight:700; border-radius:999px;
}
.candy-catalog .chip.active{background:var(--c-gold); color:#5c3b00; border-color:var(--c-gold-deep);}
.candy-catalog .product-card{
  background:#fff; border:none; border-radius:20px;
  box-shadow:0 6px 0 rgba(0,0,0,0.12), 0 10px 18px -10px rgba(20,0,50,0.5);
}
.candy-catalog .pc-img{background:linear-gradient(160deg,#ffe3ef,#ffd0e6);}
.candy-catalog .pc-img svg{opacity:.3; color:var(--c-pink-deep);}
.candy-catalog .pc-body h4{color:var(--c-plum);}
.candy-catalog .pc-price{font-family:'Baloo 2',sans-serif; font-weight:800; color:var(--c-pink-deep);}
.candy-catalog .pc-add{
  background:linear-gradient(150deg,var(--c-pink),var(--c-pink-deep)); color:#fff;
  font-family:'Baloo 2',sans-serif; font-weight:700; border-radius:14px;
  box-shadow:0 3px 0 var(--c-pink-deep);
}
.candy-catalog .pc-add:disabled{background:rgba(0,0,0,0.12); color:rgba(0,0,0,0.35); box-shadow:none;}
.candy-catalog .pc-promo-badge{background:linear-gradient(135deg,#fff,var(--c-gold)); color:var(--c-pink-deep);}
.candy-catalog .pc-stock-low{background:var(--c-gold); color:#5c3b00;}
.candy-catalog .pc-stock-out{background:var(--c-pink-deep); color:#fff;}
.candy-catalog .empty-state{color:rgba(255,255,255,0.65);}
.candy-catalog .ribbon{
  margin:2px 16px 12px; padding:10px 14px; border-radius:14px;
  background:linear-gradient(120deg,var(--c-gold),var(--c-gold-deep));
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px; color:#5c3b00;
  box-shadow:0 4px 0 #a86e00; text-align:center;
}

/* ---------- PRODUCT DETAIL ---------- */
.pd-img{aspect-ratio:1; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; margin:0 16px; border-radius:18px; overflow:hidden; position:relative;}
.pd-img img{width:100%; height:100%; object-fit:contain;}
.pd-promo-badge{position:absolute; top:12px; right:12px; z-index:1; background:linear-gradient(135deg,#ffe066,#ffd400);
  color:#c62222; font-size:13px; font-weight:800; padding:5px 12px; border-radius:12px;
  box-shadow:0 3px 10px rgba(255,212,0,0.6); animation:pcPromoPulse 1.8s ease-in-out infinite;}
.pd-body{padding:18px 18px 210px;}
.pd-body h2{font-size:21px; color:var(--white); margin-bottom:6px;}
.pd-price{font-size:22px; font-weight:700; color:var(--gold2); margin-bottom:14px;}
.pd-desc{font-size:13.5px; color:rgba(255,255,255,0.65); line-height:1.6; margin-bottom:16px;}
.qty-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.qty-btn{width:36px; height:36px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-bd); font-size:18px; font-weight:700;}
.qty-val{font-size:17px; font-weight:700; min-width:30px; text-align:center;}
/* Flota arriba de la barra de navegación inferior en vez de pegada al
   borde: bottom:98px deja los ~89px que ocupa el circulo rosa del carrito
   (medido con el nav ya pegado, sticky bottom:14px) más un margen chico. */
.sticky-cta{position:fixed; bottom:98px; left:12px; right:12px; max-width:456px; margin:0 auto;
  padding:10px 16px; background:rgba(10,16,40,0.94); backdrop-filter:blur(14px);
  border:1px solid var(--glass-bd); border-radius:20px; z-index:60;
  box-shadow:0 10px 24px -8px rgba(0,0,0,0.5);}
.btn-primary{width:100%; padding:8px 12px; border-radius:12px; background:var(--gold); color:var(--navy);
  font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px;}
.btn-primary svg{width:15px; height:15px; flex-shrink:0;}
.btn-secondary{width:100%; padding:14px; border-radius:14px; background:var(--glass); color:var(--white);
  font-weight:600; font-size:14px; border:1px solid var(--glass-bd);
  display:flex; align-items:center; justify-content:center; gap:8px;}
/* ---------- NOVEDADES / OFERTAS ---------- */
.home-sec-header{display:flex; align-items:center; justify-content:space-between; padding:22px 16px 10px;}
.home-sec-label{
  font-size:19px; font-weight:800; color:var(--white); letter-spacing:-.3px;
  display:flex; align-items:center; gap:10px;
}
.home-sec-label::before{
  content:''; display:inline-block; width:4px; height:22px; border-radius:3px;
  background:var(--gold); flex-shrink:0;
}

.wholesale-badge{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  margin:8px auto 0; padding:9px 34px; min-width:220px; border-radius:24px;
  background:linear-gradient(120deg, var(--goldlight), var(--gold) 65%, var(--gold2));
  border:1.5px solid var(--goldlight);
  box-shadow:0 3px 14px rgba(197,160,40,0.55);
  color:var(--navy); font-size:12.5px; font-weight:800; letter-spacing:1px;
  text-transform:uppercase;
}
.wholesale-badge img{width:15px; height:15px; object-fit:contain;}
.content-strip{display:flex; gap:12px; overflow-x:auto; padding:0 16px 16px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.content-strip::-webkit-scrollbar{display:none;}
.nov-card{flex:none; width:240px; scroll-snap-align:start; border-radius:16px; overflow:hidden; background:var(--glass); border:1px solid var(--glass-bd);}
.nov-card img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block;}
.nov-card-body{padding:11px 13px 13px;}
.nov-card-title{font-size:14px; font-weight:700; color:var(--white); margin-bottom:4px;}
.nov-card-text{font-size:12px; color:rgba(255,255,255,0.6); line-height:1.5;}
.ofer-card{flex:none; width:160px; scroll-snap-align:start; border-radius:16px; overflow:hidden; background:var(--glass); border:1px solid var(--glass-bd); position:relative;}
.ofer-card img{width:100%; aspect-ratio:1; object-fit:cover; display:block;}
.ofer-card-noimg{width:100%; aspect-ratio:1; background:linear-gradient(135deg,var(--gold2),var(--gold)); display:flex; align-items:center; justify-content:center;}
.ofer-badge{position:absolute; top:8px; right:8px; background:var(--gold); color:var(--navy); font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
.ofer-card-body{padding:9px 11px 11px;}
.ofer-card-title{font-size:13px; font-weight:700; color:var(--white);}
.ofer-card-text{font-size:11px; color:rgba(255,255,255,0.6); margin-top:3px; line-height:1.4;}
.btn-outline-gold{width:100%; padding:14px; border-radius:14px; background:transparent; color:var(--gold2);
  font-weight:700; font-size:14px; border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center; gap:8px;}

/* ---------- CART ---------- */
.cart-item{display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--glass-bd);}
.cart-item img{width:60px; height:60px; border-radius:10px; object-fit:cover; background:rgba(255,255,255,0.05);}
.cart-item-body{flex:1;}
.cart-item-body h4{font-size:13.5px; color:var(--white); margin-bottom:3px;}
.cart-item-body .price{font-size:13px; color:var(--gold2); font-weight:700;}
.cart-qty{display:flex; align-items:center; gap:8px; margin-top:6px;}
.cart-qty button{width:24px; height:24px; border-radius:7px; background:var(--glass); border:1px solid var(--glass-bd); font-size:13px;}
.cart-remove{color:var(--danger); font-size:11px; margin-top:4px;}
.cart-summary{padding:16px; background:var(--glass); margin:16px; border-radius:16px;}
.summary-row{display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:rgba(255,255,255,0.7);}
.summary-row.total{font-size:17px; font-weight:700; color:var(--white); border-top:1px solid var(--glass-bd); margin-top:6px; padding-top:12px;}

/* ---------- FORMS ---------- */
.form-group{margin:0 16px 14px;}
.form-group label{display:block; font-size:12px; color:rgba(255,255,255,0.55); margin-bottom:6px; font-weight:600;}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:13px 14px; border-radius:12px; background:var(--glass);
  border:1px solid var(--glass-bd); color:var(--cream); outline:none;
}
.form-group textarea{resize:vertical; min-height:70px;}

/* ---------- TOAST ---------- */
#toast-wrap{position:fixed; bottom:90px; left:0; right:0; max-width:480px; margin:0 auto;
  display:flex; flex-direction:column; gap:8px; padding:0 16px; z-index:200; pointer-events:none;}
.toast{padding:12px 16px; border-radius:12px; background:rgba(20,28,60,0.95); border:1px solid var(--glass-bd);
  color:var(--white); font-size:13px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 20px rgba(0,0,0,0.3);
  animation:toastIn .25s ease;}
.toast.ok{border-color:var(--ok);} .toast.err{border-color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(5,8,20,0.7); z-index:300;
  display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(4px);}
.modal-sheet{width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
  background:var(--navy2); border-radius:24px 24px 0 0; padding:20px; animation:sheetUp .25s ease;}
@keyframes sheetUp{from{transform:translateY(40px);} to{transform:translateY(0);}}
.modal-handle{width:40px; height:4px; background:rgba(255,255,255,0.2); border-radius:4px; margin:0 auto 16px;}
.modal-title{font-size:18px; color:var(--white); margin-bottom:16px;}

/* ---------- BADGES / TIERS ---------- */
.tier-badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;}
.tier-bronce{background:rgba(180,120,80,0.25); color:#e0a877;}
.tier-plata{background:rgba(180,190,200,0.25); color:#cfd6e0;}
.tier-oro{background:rgba(197,160,40,0.25); color:var(--gold2);}

/* ---------- ADMIN ---------- */
.admin-tabs{display:flex; flex-wrap:wrap; gap:8px; padding:14px 16px; background:rgba(255,255,255,0.03); border-bottom:1px solid var(--glass-bd);}
.admin-tab{position:relative; flex:none; padding:9px 16px; border-radius:20px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.6); background:var(--glass); border:1px solid var(--glass-bd); transition:background .15s ease, color .15s ease, border-color .15s ease;}
.admin-tab-badge{position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;
  background:var(--danger); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; line-height:1; box-shadow:0 0 0 2px var(--navy2);}
.admin-tab:hover{background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.9); border-color:rgba(255,255,255,0.2);}
.admin-tab.active{background:var(--gold); color:var(--navy); border-color:var(--gold);}
.order-card{margin:12px 16px; padding:14px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-bd);}
.order-card .oc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.order-card .oc-id{font-weight:700; color:var(--white); font-size:14px;}
.status-pill{font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase;}
.status-pendiente{background:rgba(224,168,60,0.25); color:var(--warn);}
.status-revision{background:rgba(155,89,182,0.25); color:#9b59b6;}
.status-listo{background:rgba(60,150,220,0.25); color:#6db8e8;}
.status-entregado{background:rgba(62,207,142,0.25); color:var(--ok);}
.status-cancelado{background:rgba(231,76,60,0.25); color:#e74c3c;}
.oc-items{font-size:12.5px; color:rgba(255,255,255,0.6); margin-bottom:8px; line-height:1.5;}
.oc-actions{display:flex; gap:8px;}
.oc-actions button{flex:1; padding:9px; border-radius:10px; font-size:12px; font-weight:700;}
.btn-advance{background:var(--gold); color:var(--navy);}
.btn-wa-notify{background:#25D366; color:#fff; display:flex; align-items:center; justify-content:center; gap:5px;}

.admin-login{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; padding:40px 24px; text-align:center;}
.admin-login img{width:80px; margin-bottom:18px;}

.prod-row{display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--glass-bd); align-items:center;}
.prod-row img{width:48px; height:48px; border-radius:10px; object-fit:cover; background:rgba(255,255,255,0.05); flex:none;}
.prod-row-body{flex:1; min-width:0;}
.prod-row-body h4{font-size:13px; color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.prod-row-body p{font-size:11.5px; color:rgba(255,255,255,0.5);}
.prod-row-actions{display:flex; gap:6px;}
.icon-btn{width:32px; height:32px; border-radius:8px; background:var(--glass); border:1px solid var(--glass-bd); display:flex; align-items:center; justify-content:center;}
.icon-btn svg{width:15px; height:15px;}
.chat-del-btn{background:none; border:none; color:inherit; opacity:.55; cursor:pointer; padding:2px; margin-left:5px; display:inline-flex; vertical-align:middle;}
.chat-del-btn svg{width:11px; height:11px;}
.chat-del-btn:active{opacity:1;}

.prod-row-v2{padding:13px 16px; border-bottom:1px solid var(--glass-bd);}
.prod-row-v2-top{display:flex; gap:12px; align-items:flex-start; margin-bottom:10px;}
.prod-row-v2-top img{width:44px; height:44px; border-radius:10px; object-fit:cover; background:rgba(255,255,255,0.05); flex:none;}
.prod-row-v2-info{flex:1; min-width:0;}
.prod-row-v2-info h4{font-size:13.5px; color:var(--white); line-height:1.35; white-space:normal; word-break:break-word;}
.prod-row-v2-info p{font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px;}
.prod-row-v2-bottom{display:flex; gap:8px; align-items:flex-end;}
.prod-row-v2-price-col{flex:1; min-width:0;}
.prod-row-v2-price-label{display:block; font-size:9px; color:rgba(255,255,255,0.4); font-weight:700; text-transform:uppercase; margin-bottom:3px;}
.prod-row-v2-price-col input{width:100%; padding:7px 8px; border-radius:8px; background:var(--glass); border:1px solid var(--glass-bd); font-weight:700; font-size:12.5px; text-align:center;}
.prod-row-v2.is-hidden{opacity:.55;}
.badge-oculto{background:rgba(229,86,109,0.18); color:var(--danger); font-size:9px; font-weight:800; padding:2px 7px; border-radius:8px; letter-spacing:.3px; margin-left:4px;}

.fab{position:fixed; bottom:24px; right:calc(50% - 240px + 18px); width:54px; height:54px; border-radius:50%;
  background:var(--gold); color:var(--navy); display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(197,160,40,0.4); z-index:80;}
@media (max-width:480px){.fab{right:18px;}}
.fab svg{width:24px; height:24px;}

.photo-upload-row{display:flex; gap:10px; margin:0 16px 14px;}
.photo-upload-box{flex:1; aspect-ratio:1; border-radius:14px; border:1.5px dashed var(--glass-bd);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:var(--glass); font-size:11px; color:rgba(255,255,255,0.55); position:relative; overflow:hidden;}
.photo-upload-box svg{width:22px; height:22px; opacity:.6;}
.photo-upload-box input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.photo-preview-wrap{margin:0 16px 14px; border-radius:14px; overflow:hidden; position:relative; aspect-ratio:1; background:rgba(255,255,255,0.05);}
.photo-preview-wrap img{width:100%; height:100%; object-fit:contain;}
.filter-row{display:flex; gap:8px; padding:0 16px 14px; overflow-x:auto;}
.filter-thumb{flex:none; width:54px; height:54px; border-radius:10px; overflow:hidden; border:2px solid transparent; position:relative;}
.filter-thumb.active{border-color:var(--gold);}
.filter-thumb img{width:100%; height:100%; object-fit:cover;}
.filter-thumb span{position:absolute; bottom:0; left:0; right:0; font-size:7px; text-align:center; background:rgba(0,0,0,0.5); color:#fff; padding:1px 0;}
.btn-ai-remove{margin:0 16px 14px; padding:13px; border-radius:12px; background:linear-gradient(120deg,#7b4fd6,#a35fe8);
  color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-ai-remove[disabled]{opacity:.6;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.cat-tree{padding:8px 16px;}
.cat-tree-item{padding:12px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-bd); margin-bottom:8px;}
.cat-tree-head{display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:13.5px; color:var(--white);}
.cat-tree-subs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.subcat-chip{font-size:12px; font-weight:600; padding:6px 12px; border-radius:14px;
  background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.25);
  color:#ffffff; display:flex; align-items:center; gap:7px;}
.subcat-chip button{color:#ff8a9a; font-size:14px; font-weight:800; line-height:1;}

.client-row{display:flex; gap:12px; padding:13px 16px; border-bottom:1px solid var(--glass-bd); align-items:center;}
.client-rank{width:28px; height:28px; border-radius:50%; background:var(--glass); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--gold2); flex:none;}
.client-row-body{flex:1;}
.client-row-body h4{font-size:13.5px; color:var(--white);}
.client-row-body p{font-size:11px; color:rgba(255,255,255,0.5);}
.client-pts{font-weight:700; color:var(--gold2); font-size:14px;}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--glass-bd);}
.settings-row span{font-size:14px; color:var(--white);}
.toggle{width:44px; height:26px; border-radius:14px; background:rgba(255,255,255,0.15); position:relative; transition:.2s;}
.toggle.on{background:var(--gold);}
.toggle::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s;}
.toggle.on::after{left:21px;}

.empty-cart-icon{width:60px; height:60px; opacity:.3; margin:40px auto 14px;}

/* ---------- COMPROBANTES (Factura / Remito / Ticket) ---------- */
.voucher-type-tabs{display:flex; gap:8px; padding:12px 16px;}
.voucher-type-tab{flex:1; padding:10px; border-radius:12px; text-align:center; font-size:12.5px; font-weight:700;
  background:var(--glass); border:1px solid var(--glass-bd); color:rgba(255,255,255,0.55);}
.voucher-type-tab.active{background:var(--gold); color:var(--navy); border-color:var(--gold);}

.voucher-row{display:flex; gap:12px; padding:13px 16px; border-bottom:1px solid var(--glass-bd); align-items:center;}
.voucher-row-icon{width:38px; height:38px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-bd);
  display:flex; align-items:center; justify-content:center; flex:none; color:var(--gold2);}
.voucher-row-icon svg{width:18px; height:18px;}
.voucher-row-body{flex:1; min-width:0;}
.voucher-row-body h4{font-size:13px; color:var(--white);}
.voucher-row-body p{font-size:11px; color:rgba(255,255,255,0.5);}
.voucher-row-amount{font-weight:700; color:var(--gold2); font-size:14px; text-align:right;}

.voucher-doc{
  background:#fff; color:#1a1a1a; border-radius:12px; margin:14px 16px; padding:22px;

}
.voucher-doc .vd-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:2px solid #1a1a1a; padding-bottom:14px; margin-bottom:14px;}

.voucher-doc .vd-brand img{width:46px;}
.voucher-doc .vd-brand h2{font-family:'Playfair Display',serif; font-size:17px; margin:0;}
.voucher-doc .vd-brand p{font-size:10.5px; color:#555; margin:0;}

.voucher-doc .vd-doctype .vd-num{font-size:11px; font-weight:700; margin-top:4px;}

.voucher-doc .vd-footer{margin-top:18px; padding-top:12px; border-top:1px dashed #ccc; font-size:10px; color:#777; text-align:center;}
.voucher-doc .vd-alias{margin-top:16px; padding:10px 14px; border-radius:8px; background:#f6efd9; border:1px solid #d9c277;
  text-align:center; font-size:12px; color:#5a4a12;}
.voucher-doc .vd-alias b{font-size:13px; letter-spacing:.3px;}

.voucher-actions{display:flex; gap:10px; padding:0 16px 90px;}
.voucher-actions button{flex:1;}

.manual-item-row{display:flex; gap:8px; padding:0 16px 10px; align-items:center;}
.manual-item-row select{flex:2;}
.manual-item-row input{flex:1;}

.cmp-prov-th-av{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-bottom:3px;}
.cmp-upload-zone{border:2px dashed var(--glass-bd);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;margin-bottom:12px;}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // Deep-merge nested config objects (fiscal, config, voucherCounters) so that
      // new default fields added in later app versions (e.g. aliasTransferencia)
      // aren't silently wiped out by an older saved object that lacks them.
      // A shallow Object.assign would replace state.fiscal entirely with the old
      // saved one, dropping any new keys that only exist in the fresh defaults.
      const nestedKeys = ["fiscal", "config", "voucherCounters", "posBanner"];
      nestedKeys.forEach(key=>{
        if(parsed[key]){
          parsed[key] = Object.assign({}, state[key], parsed[key]);
        }
      });
      state = Object.assign(state, parsed);
      // La primera vez que corre esta versión, marca como "vistos" a todos los
      // clientes ya existentes para no bombardear con notificaciones de
      // "nuevo cliente" a gente que ya estaba en la base hace tiempo.
      if(!state.clientsSeenMigrated){
        Object.values(state.clients).forEach(c=>{ if(c.seen===undefined) c.seen = true; });
        state.clientsSeenMigrated = true;
      }
    }
  }catch(e){}
}

/* =========================================================
   API SYNC — sincronización directa con Supabase
   ========================================================= */
const _pendingSaves = new Set();

async function supaFetch(path, method, body){
  const url = SUPABASE_URL + '/rest/v1' + path;
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
  };
  if(method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
  const res = await fetch(url, {
    method: method||'GET',
    headers,
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store',
  });
  const text = await res.text();
  if(!res.ok){
    let err; try{ err = JSON.parse(text); }catch(e){ err = {message: text}; }
    throw new Error(err.message || err.details || 'HTTP ' + res.status);
  }
  return text ? JSON.parse(text) : null;
}

    if(session) localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(session));
    else localStorage.removeItem(ADMIN_SESSION_KEY);
  }catch(e){}
}
async function adminAuthRequest(grantType, body){
  let res;
  try{
    res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=' + grantType, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'apikey': SUPABASE_KEY},
      body: JSON.stringify(body),
    });
  }catch(networkErr){
    // Falla de red/DNS/Supabase caído — distinto de "credenciales inválidas".
    const e = new Error('Sin conexión con el servidor');
    e.isNetworkError = true;
    throw e;
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || data.error || 'No se pudo autenticar');
  return data;
}
async function adminSignIn(email, password){
  const data = await adminAuthRequest('password', {email, password});
  saveAdminSession({access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in||3600)*1000, uid: data.user && data.user.id});
  return data;
}
async function adminTryRefresh(){
  if(!adminSession || !adminSession.refresh_token) return false;
  try{
    const data = await adminAuthRequest('refresh_token', {refresh_token: adminSession.refresh_token});
    saveAdminSession({access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in||3600)*1000, uid: (data.user && data.user.id) || adminSession.uid});
    return true;
  }catch(e){
    // Si fue un problema de red, no borramos la sesión — el refresh
    // token puede seguir siendo válido, reintentamos en el próximo load.
    if(!e.isNetworkError) saveAdminSession(null);
    return false;
  }
}
// Busca los datos de admin_users del usuario logueado y los vuelca a `state`.
// Tira si el usuario no está vinculado como admin (auth válido pero sin fila).
async function loadAdminIdentity(uid){
  const rows = await adminFetch('/admin_users?select=name,is_super,perms&user_id=eq.'+uid+'&limit=1', 'GET');
  const me = rows && rows[0];
  if(!me) throw new Error('sin_acceso');
  state.adminAuthed = true;
  state.adminIsSuperAdmin = !!me.is_super;
  state.adminLoggedName = me.name || "Administrador";
  state.adminLoggedPerms = me.perms || [];
}
// Restaura la sesión de admin guardada (si el refresh token todavía es
// válido) para no pedir login de nuevo en cada recarga de página.
async function tryRestoreAdminSession(){
  if(!adminSession) return;
  const ok = await adminTryRefresh();
  if(!ok) return;
  try{
    await loadAdminIdentity(adminSession.uid);
    render();
    if(state.adminIsSuperAdmin) apiSyncAdminUsers().then(render).catch(()=>{});
  }catch(e){
    // Solo cerramos sesión si de verdad no tiene acceso — un error de
    // red/servidor no debería obligar a loguearse de nuevo.
    if(e.message==='sin_acceso') await adminSignOut();
  }
}
async function adminSignOut(){
  if(adminSession && adminSession.access_token){
    try{
      await fetch(SUPABASE_URL + '/auth/v1/logout', {method:'POST', headers:{'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+adminSession.access_token}});
    }catch(e){}
  }
  saveAdminSession(null);
}
// Igual que supaFetch, pero autenticado como el admin logueado (en vez del anon key).
// Requerido para leer/escribir clients, orders, chat_messages, admin_users, etc.
async function adminFetch(path, method, body, prefer, _retried){
  if(!adminSession || !adminSession.access_token) throw new Error('No hay sesión de admin');
  const url = SUPABASE_URL + '/rest/v1' + path;
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + adminSession.access_token,
  };
  if(prefer) headers['Prefer'] = prefer;
  else if(method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
  const res = await fetch(url, { method: method||'GET', headers, body: body?JSON.stringify(body):undefined, cache: 'no-store' });
  if(res.status === 401 && !_retried && await adminTryRefresh()){
    return adminFetch(path, method, body, prefer, true);
  }
  const text = await res.text();
  if(!res.ok){
    let err; try{ err = JSON.parse(text); }catch(e){ err = {message: text}; }
    throw new Error(err.message || err.details || 'HTTP ' + res.status);
  }
  return text ? JSON.parse(text) : null;
}
// Llama una función RPC pública (find_or_create_client, create_order, chat, etc.)
// con el anon key — son SECURITY DEFINER y solo devuelven lo que corresponde
// al teléfono pasado como parámetro, no requieren sesión de admin.
async function rpcFetch(name, args){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Prefer':'return=representation'},
    body: JSON.stringify(args||{}),
    cache: 'no-store',
  });
  const text = await res.text();
  if(!res.ok){
    let err; try{ err = JSON.parse(text); }catch(e){ err = {message: text}; }
    throw new Error(err.message || err.details || 'HTTP ' + res.status);
  }
  return text ? JSON.parse(text) : null;
}

async function uploadPhoto(base64, prefix){
  if(!adminSession || !adminSession.access_token) throw new Error('No hay sesión de admin');
  const blob = await fetch(base64).then(r=>r.blob());
  const ext = (blob.type||'image/jpeg').split('/')[1]||'jpg';
  const filename = prefix + '_' + Date.now() + '.' + ext;
  const res = await fetch(SUPABASE_URL+'/storage/v1/object/product-photos/'+filename, {
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+adminSession.access_token,'Content-Type':blob.type,'x-upsert':'true','cache-control':'31536000'},
    body: blob,
  });
  if(!res.ok){ const t=await res.text(); throw new Error(t); }
  return SUPABASE_URL+'/storage/v1/object/public/product-photos/'+filename;
}
async function uploadProductPhoto(base64, productId){

}

// Acepta el shape viejo {image, active} de una única versión anterior de
// esta función, además del shape nuevo {items, activeId} con varios fondos
// guardados.
function normalizeHomeBackground(parsed){
  if(!parsed) return {items:[], activeId:null};
  if(Array.isArray(parsed.items)) return {items:parsed.items, activeId:parsed.activeId||null};
  if(parsed.image){
    const item = {id:'legacy', name:'Fondo', image:parsed.image};
    return {items:[item], activeId: parsed.active ? 'legacy' : null};
  }
  return {items:[], activeId:null};
}
async function apiSyncContent(){
  try{
    const data = await supaFetch('/app_settings?setting_key=in.(novedades,ofertas,banner_novedades,banner_ofertas,catalog_ribbons,home_background,client_discounts,wholesale_clients,categories,store_config,fiscal_config,banners,pos_config,pos_banner)&select=setting_key,setting_value', 'GET');
    if(!data || data.length===0) return;
    let changed = false;
    data.forEach(row=>{
      try{
        const parsed = JSON.parse(row.setting_value);
        if(row.setting_key==='novedades' && JSON.stringify(parsed)!==JSON.stringify(state.novedades)){
          state.novedades = parsed||[]; changed = true;
        }
        if(row.setting_key==='ofertas' && JSON.stringify(parsed)!==JSON.stringify(state.ofertas)){
          state.ofertas = parsed||[]; changed = true;
        }
        if(row.setting_key==='banner_novedades' && JSON.stringify(parsed)!==JSON.stringify(state.bannerNovedades)){
          state.bannerNovedades = parsed; changed = true;
        }
        if(row.setting_key==='banner_ofertas' && JSON.stringify(parsed)!==JSON.stringify(state.bannerOfertas)){
          state.bannerOfertas = parsed; changed = true;
        }
        if(row.setting_key==='catalog_ribbons' && parsed && JSON.stringify(parsed)!==JSON.stringify(state.catalogRibbons)){
          state.catalogRibbons = parsed; changed = true;
        }
        if(row.setting_key==='home_background'){
          const norm = normalizeHomeBackground(parsed);
          if(JSON.stringify(norm.items)!==JSON.stringify(state.homeBackgrounds) || norm.activeId!==state.homeBackgroundActiveId){
            state.homeBackgrounds = norm.items;
            state.homeBackgroundActiveId = norm.activeId;
            changed = true;
          }
        }
        if(row.setting_key==='categories' && parsed && JSON.stringify(parsed)!==JSON.stringify(state.categories)){
          state.categories = parsed; changed = true;
        }
        if(row.setting_key==='banners' && JSON.stringify(parsed)!==JSON.stringify(state.banners)){
          state.banners = parsed||[]; changed = true;
        }
        if(row.setting_key==='store_config' && parsed){
          const merged = Object.assign({}, state.config, parsed);
          if(JSON.stringify(merged)!==JSON.stringify(state.config)){ state.config = merged; changed = true; }
        }
        if(row.setting_key==='fiscal_config' && parsed){
          const merged = Object.assign({}, state.fiscal, parsed);
          if(JSON.stringify(merged)!==JSON.stringify(state.fiscal)){ state.fiscal = merged; changed = true; }
        }
        if(row.setting_key==='pos_config' && parsed){
          if(JSON.stringify(parsed)!==JSON.stringify(state.posConfig)){ state.posConfig = parsed; changed = true; }
        }
        if(row.setting_key==='pos_banner' && parsed){
          const merged = Object.assign({}, state.posBanner, parsed);
          if(JSON.stringify(merged)!==JSON.stringify(state.posBanner)){ state.posBanner = merged; changed = true; }
        }
        if(row.setting_key==='client_discounts'){
          const discounts = parsed || {};
          let blockChanged = false;
          Object.entries(discounts).forEach(([phone, pct])=>{
            if(!state.clients[phone]) state.clients[phone] = {phone, name:'', address:'', doc:'', points:0, orders:[]};
            if(state.clients[phone].discountPct !== pct){ state.clients[phone].discountPct = pct; blockChanged = true; }
          });
          // Limpiar descuentos de clientes que ya no están en la lista de Supabase
          Object.keys(state.clients).forEach(phone=>{
            if(!discounts[phone] && state.clients[phone].discountPct){
              state.clients[phone].discountPct = undefined;
              blockChanged = true;
            }
          });
          if(blockChanged) changed = true;
        }
        if(row.setting_key==='wholesale_clients'){
          const list = parsed || [];
          let blockChanged = false;
          // Aplicar flag wholesale a los clientes en la lista
          list.forEach(phone=>{
            if(!state.clients[phone]) state.clients[phone] = {phone, name:'', address:'', doc:'', points:0, orders:[]};
            if(!state.clients[phone].wholesale){ state.clients[phone].wholesale = true; blockChanged = true; }
          });
          // Quitar flag a clientes que ya no son mayoristas
          Object.keys(state.clients).forEach(phone=>{
            if(!list.includes(phone) && state.clients[phone].wholesale){
              state.clients[phone].wholesale = false;
              blockChanged = true;
            }
          });
          if(blockChanged) changed = true;
        }
      }catch(e){}
    });
    if(changed){ saveState(); if(!document.getElementById('content-modal-overlay')) render(); }
  }catch(e){ console.warn('Sync content:', e); }
}

// Antes esto solo agregaba clientes que faltaran localmente: un cliente
// ya guardado en este dispositivo nunca se actualizaba, así que los
// puntos (y nombre/dirección/email) quedaban pisados por lo que se haya
// cargado la primera vez en CADA dispositivo. Ahora el servidor manda:
// se reconcilian también los que ya existen localmente.
async function apiSyncClients(){
  if(!IS_ADMIN_APP || !state.adminAuthed) return;
  try{
    const rows = await adminFetch('/clients?select=full_name,phone,address,email,points&order=created_at.desc&limit=500','GET');
    if(!rows || rows.length===0) return;
    let changed = false;
    rows.forEach(c=>{
      if(!c.phone) return;
      const phone = c.phone.startsWith('+') ? c.phone : '+54'+c.phone;
      const points = c.points||0;
      const existing = state.clients[phone];
      if(!existing){
        state.clients[phone] = { phone, name:c.full_name||'', address:c.address||'', email:c.email||'', doc:'', city:'', province:'', points, orders:[] };
        changed = true;
      }else{
        if(existing.points !== points){ existing.points = points; changed = true; }
        if(c.full_name && existing.name !== c.full_name){ existing.name = c.full_name; changed = true; }
        if(c.address && existing.address !== c.address){ existing.address = c.address; changed = true; }
        if(c.email && existing.email !== c.email){ existing.email = c.email; changed = true; }
      }
    });
    if(changed){ saveState(); render(); }
  }catch(e){ console.warn('Sync clientes:', e); }
}

async function apiSaveProduct(product){
  _pendingSaves.add(product.id);
  try{
    let photoUrl = (product.photo && !product.photo.startsWith('data:')) ? product.photo : null;
    let photoThumbUrl;
    if(product.photo && product.photo.startsWith('data:')){
      const originalDataUrl = product.photo;
      try{
        photoUrl = await uploadProductPhoto(originalDataUrl, product._apiId||product.id);
        product.photo = photoUrl;
        saveState();
      }catch(pe){ console.warn('No se pudo subir foto:', pe); toast('La foto no se pudo subir: '+pe.message, 'err'); }
      // Miniatura aparte (300px) para tarjetas de catálogo/carrito/listas —
      // la foto completa (900px) solo hace falta en el detalle del producto.
      if(photoUrl){
        try{
          const thumbDataUrl = await downscaleImageDataUrl(originalDataUrl, 300, 0.7);
          photoThumbUrl = await uploadProductPhoto(thumbDataUrl, (product._apiId||product.id)+'_thumb');
          product.photoThumb = photoThumbUrl;
          saveState();
        }catch(te){ console.warn('No se pudo generar la miniatura:', te); }
      }
    }
    // photoClean es la versión sin el sello Sin TACC, guardada aparte para
    // que se pueda apagar el sello más adelante sin perder la edición. null
    // = sin sello (limpia la columna); undefined = no tocar (falló la subida).
    let photoCleanUrl;
    if(product.photoClean && product.photoClean.startsWith('data:')){
      try{
        photoCleanUrl = await uploadProductPhoto(product.photoClean, (product._apiId||product.id)+'_clean');
        product.photoClean = photoCleanUrl;
        saveState();
      }catch(pe){ console.warn('No se pudo subir foto sin sello:', pe); }
    } else {
      photoCleanUrl = product.photoClean || null;
    }
    const body = {
      name: product.name,
      description: product.desc||"",
      price: product.price,
      wholesale_price: product.wholesalePrice||null,
      stock: product.stock||0,
      ...(photoUrl !== null ? {photo_url: photoUrl} : {}),
      ...(photoThumbUrl !== undefined ? {photo_thumb_url: photoThumbUrl} : {}),
      ...(photoCleanUrl !== undefined ? {photo_clean_url: photoCleanUrl} : {}),
      section: product.section,
      cat: product.cat,
      sub: product.sub||null,
      sell_by_weight: product.sellByWeight||false,
      price_per_kg: product.pricePerKg||null,
      wholesale_price_per_kg: product.wholesalePricePerKg||null,
      min_grams: product.minGrams||null,
      sin_tacc: product.sinTacc||false,
      sin_azucar: product.sinAzucar||false,
      display_qty: product.displayQty||null,
      display_discount: product.displayDiscount||null,
      promo_price: product.promoPrice||null,
      promo_until: product.promoUntil||null,
      barcode: product.barcode||null,
      hidden: product.hidden||false,
    };
    if(product._apiId){
      await adminFetch('/products?id=eq.' + product._apiId, 'PATCH', body);
    }else{
      const data = await adminFetch('/products?select=id', 'POST', body);
      if(data && data[0]){
        const oldId = product.id;
        product._apiId = data[0].id;
        product.id = String(data[0].id);
        _pendingSaves.delete(oldId);
        _pendingSaves.add(product.id);
        state.products = state.products.filter(p=>p===product || p.id!==product.id);
        saveState();
      }
    }
  }catch(e){
    console.warn("Error guardando producto:", e);
    alert("Error al guardar en Supabase:\n\n" + e.message);
  }finally{
    _pendingSaves.delete(product.id);
  }
}

    items: row.items,
    clientDiscountPct: row.discount_pct || undefined,
    clientDiscountAmount: row.discount_amount || undefined,
    total: Number(row.total),
    status: row.status,
  };
}

// Crea el pedido en el servidor vía RPC (create_order): inserta la fila
// y descuenta el stock de forma atómica en la misma transacción. Si no
// alcanza el stock de algún producto, tira "sin_stock:<nombre>" y no
// crea nada — el pedido nunca queda "a medias".
async function apiSaveOrder({customer, items, clientDiscountPct, clientDiscountAmount, total}){
  const rpcItems = items.map(it=>({id: Number(it.id), name: it.name, price: it.price, qty: it.qty, grams: it.grams||null, lineTotal: it.lineTotal}));
  return rpcFetch('create_order', {
    p_phone: customer.phone,
    p_name: customer.name,
    p_address: customer.address || null,
    p_items: rpcItems,
    p_discount_pct: clientDiscountPct || null,
    p_discount_amount: clientDiscountAmount || null,
    p_total: total,
  });
}

async function apiSyncOrders(){
  if(!IS_ADMIN_APP || !state.adminAuthed) return;
  try{
    const rows = await adminFetch('/orders?select=*&order=created_at.desc&limit=500', 'GET');
    const mapped = (rows||[]).map(mapOrderRow);
    if(JSON.stringify(mapped) !== JSON.stringify(state.orders)){
      state.orders = mapped;
      saveState();
      render();
    }
  }catch(e){ console.warn('Sync orders:', e); }
}

// Ventas de mostrador (caja-venta.html) — mismo patrón que apiSyncOrders,
// para poder mostrarlas en Estadísticas junto a los pedidos online.
async function apiSyncPosSales(){
  if(!IS_ADMIN_APP || !state.adminAuthed) return;
  try{
    const rows = await adminFetch('/pos_sales?select=*&order=created_at.desc&limit=500', 'GET');
    if(JSON.stringify(rows) !== JSON.stringify(state.posSales)){
      state.posSales = rows||[];
      saveState();

  }catch(e){ console.warn('Sync pos_sales:', e); }
}

// Actualiza el estado de UN pedido (una fila, no todo el blob) — usado
// al avanzar Pendiente → Listo → Entregado desde el panel admin.
async function apiUpdateOrderStatus(orderId, status){
  if(!IS_ADMIN_APP) return;

async function apiDeleteOrder(orderId){

    await adminFetch('/orders?id=eq.'+encodeURIComponent(orderId), 'DELETE');
  }catch(e){
    console.warn('Error eliminando pedido:', e);

// Convierte una fila de la tabla `vouchers` al shape que ya usa el resto de la app.
function mapVoucherRow(row){
  return {
    id: row.id,
    type: row.type,
    number: row.number,
    date: row.voucher_date,
    items: row.items,
    customer: row.customer,
    total: Number(row.total),
    generalDiscount: row.general_discount || null,
    generalDiscountAmount: row.general_discount_amount!=null ? Number(row.general_discount_amount) : 0,
    showIVA: !!row.show_iva,
    ivaPct: row.iva_pct!=null ? Number(row.iva_pct) : undefined,
    iva: row.iva!=null ? Number(row.iva) : undefined,
    neto: row.neto!=null ? Number(row.neto) : undefined,
    orderId: row.order_id || null,
    editedAt: row.edited_at || undefined,
    afipCae: row.afip_cae || null,
    afipCaeVencimiento: row.afip_cae_vencimiento || null,
    afipNumero: row.afip_numero || null,
    afipPuntoVenta: row.afip_punto_venta || null,
    afipTipoComprobante: row.afip_tipo_comprobante || null,
    afipAmbiente: row.afip_ambiente || null,
    afipDocTipo: row.afip_doc_tipo || null,
    afipDocNro: row.afip_doc_nro || null,
    afipCuitEmisor: row.afip_cuit_emisor || null,
  };
}

// Trae los comprobantes guardados en el servidor: agrega los que falten
// localmente, actualiza los que hayan cambiado (editados desde otro
// dispositivo), y sube los contadores locales al máximo visto en el
// servidor por tipo para no repetir números entre dispositivos.
async function apiSyncVouchers(){
  if(!IS_ADMIN_APP || !state.adminAuthed) return;
  try{
    const rows = await adminFetch('/vouchers?select=*&order=created_at.desc&limit=500', 'GET');
    if(!rows) return;
    let changed = false;
    rows.forEach(row=>{
      const mapped = mapVoucherRow(row);
      const idx = state.vouchers.findIndex(v=>v.id===row.id);
      if(idx===-1){ state.vouchers.push(mapped); changed = true; }
      else if(JSON.stringify(state.vouchers[idx])!==JSON.stringify(mapped)){ state.vouchers[idx] = mapped; changed = true; }
    });
    state.vouchers.sort((a,b)=> new Date(b.date) - new Date(a.date));
    Object.keys(VOUCHER_META).forEach(type=>{
      const maxServer = rows.filter(r=>r.type===type).reduce((m,r)=>Math.max(m, r.number||0), 0);
      state.voucherCounters[type] = Math.max(state.voucherCounters[type]||0, maxServer);
    });
    if(changed){ saveState(); render(); }
  }catch(e){ console.warn('Sync comprobantes:', e); }
}

async function apiSaveVoucher(voucher){
  try{
    const body = {
      id: voucher.id,
      type: voucher.type,
      number: voucher.number,
      voucher_date: voucher.date,
      items: voucher.items,
      customer: voucher.customer,
      total: voucher.total,
      general_discount: voucher.generalDiscount || null,
      general_discount_amount: voucher.generalDiscountAmount || null,
      show_iva: !!voucher.showIVA,
      iva_pct: voucher.ivaPct!=null ? voucher.ivaPct : null,
      iva: voucher.iva!=null ? voucher.iva : null,
      neto: voucher.neto!=null ? voucher.neto : null,
      order_id: voucher.orderId || null,
      edited_at: voucher.editedAt || null,
      afip_cae: voucher.afipCae || null,
      afip_cae_vencimiento: voucher.afipCaeVencimiento || null,
      afip_numero: voucher.afipNumero || null,
      afip_punto_venta: voucher.afipPuntoVenta || null,
      afip_tipo_comprobante: voucher.afipTipoComprobante || null,
      afip_ambiente: voucher.afipAmbiente || null,
      afip_doc_tipo: voucher.afipDocTipo || null,
      afip_doc_nro: voucher.afipDocNro!=null ? String(voucher.afipDocNro) : null,
      afip_cuit_emisor: voucher.afipCuitEmisor!=null ? String(voucher.afipCuitEmisor) : null,
    };
    await adminFetch('/vouchers', 'POST', body, 'resolution=merge-duplicates,return=representation');
  }catch(e){
    console.warn('Error guardando comprobante:', e);
    toast('El comprobante se guardó en este dispositivo, pero no en el servidor: '+e.message, 'err');
  }
}

async function apiDeleteVoucher(voucherId){
  try{
    await adminFetch('/vouchers?id=eq.'+encodeURIComponent(voucherId), 'DELETE');
  }catch(e){ console.warn('Error eliminando comprobante:', e); }
}

<script>
/* =========================================================
   NAVIGATION
   ========================================================= */
function nav(screen, params){
  if(screen==='admin' && !IS_ADMIN_APP) return;
  state.route = Object.assign({screen}, params||{});
  history.pushState({route: state.route}, '');
  render();
  window.scrollTo(0,0);
}
window.addEventListener('popstate', e=>{
  if(e.state && e.state.route){
    state.route = e.state.route;
    render();
    window.scrollTo(0,0);
  }
});
function openSection(key){ nav("catalog", {section:key}); }
function openProduct(id){ nav("product", {id}); }

/* =========================================================
   TOASTS
   ========================================================= */
function toast(msg, type){
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast " + (type||"");
  if(type==="ok"){
    const icon = document.createElement("span");
    icon.style.cssText = "width:16px; height:16px; flex:none; display:inline-flex;";
    icon.innerHTML = ic("check");
    el.appendChild(icon);
  }
  // textContent (no innerHTML) — msg puede traer datos de clientes
  // (nombre, etc.), esto evita que se ejecute como HTML/JS.
  const msgSpan = document.createElement("span");
  msgSpan.textContent = msg;
  el.appendChild(msgSpan);
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2800);
}

/* =========================================================
   CART
   ========================================================= */
function addToCart(productId, qty){
  qty = qty || 1;
  const existing = state.cart.find(c=>c.id===productId && !c.grams);
  if(existing){ existing.qty += qty; }
  else{ state.cart.push({id:productId, qty}); }
  saveState();
  toast("Agregado al carrito", "ok");
  render();
}
function addToCartByWeight(productId, grams){
  const existing = state.cart.find(c=>c.id===productId && c.grams);
  if(existing){ existing.grams += grams; }
  else{ state.cart.push({id:productId, qty:1, grams}); }
  saveState();
  toast("Agregado al carrito", "ok");
  render();
}
function setCartQty(productId, qty){
  const item = state.cart.find(c=>c.id===productId && !c.grams);
  if(!item) return;
  if(qty<=0){ state.cart = state.cart.filter(c=>c!==item); }
  else{ item.qty = qty; }
  saveState(); render();
}
function setCartGrams(productId, grams){
  const item = state.cart.find(c=>c.id===productId && c.grams);
  if(!item) return;
  const p = state.products.find(pr=>pr.id===productId);
  const min = p?.minGrams || 50;
  if(grams<min){ state.cart = state.cart.filter(c=>c!==item); }
  else{ item.grams = grams; }
  saveState(); render();
}
function removeFromCart(productId){
  state.cart = state.cart.filter(c=>c.id!==productId);
  saveState(); render();
}
/* Returns the line total for a single cart item, handling both unit-based
   and weight-based (grams) products. */
function cartItemLineTotal(item){
  const p = state.products.find(pr=>pr.id===item.id);
  if(!p) return 0;
  if(item.grams){
    return (effectivePriceForWeight(p)/1000) * item.grams;
  }
  const base = effectivePrice(p);
  const _cl = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  if(p.displayQty && p.displayDiscount && item.qty >= p.displayQty && !(_cl && _cl.wholesale)){
    return Math.round(base * (1 - p.displayDiscount/100)) * item.qty;
  }
  return base * item.qty;
}
function cartTotal(){
  return state.cart.reduce((sum,item)=> sum + cartItemLineTotal(item), 0);
}
function cartCount(){
  return state.cart.reduce((s,i)=>s+(i.grams?1:i.qty),0);
}
function money(n){
  return "$" + Number(n).toLocaleString("es-AR");
}
// Escapa texto que viene de clientes (nombre, dirección, mensajes de chat)
// antes de insertarlo en innerHTML — evita XSS almacenado.
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function formatOrderItemLabel(it){
  return it.grams ? `${it.grams}g de ${it.name}` : `${it.qty}x ${it.name}`;
}
function activePromo(product){
  if(!product || !product.promoPrice || !product.promoUntil) return null;
  const today = new Date().toISOString().slice(0,10);
  return product.promoUntil >= today ? product.promoPrice : null;
}
// Productos con oferta activa que además la reflejan en el precio final
// (excluye a los mayoristas por completo: ellos tienen su propio acuerdo de
// precios y no deben ver ofertas pensadas para el público minorista).
function productsOnPromo(){
  const client = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  return state.products.filter(p=>{
    if(p.hidden) return false;
    if(client && client.wholesale) return false;
    return activePromo(p) !== null;
  });
}
// Banner que se muestra arriba de todo en el Home cuando hay oferta activa,
// para que sea lo primero que ve el cliente al abrir la tienda.
function homePromoBannerHtml(){
  if(IS_ADMIN_APP) return '';
  const promoProducts = productsOnPromo();
  if(promoProducts.length===0) return '';
  // El % más frecuente entre los productos en oferta, no el más alto: con
  // ofertas puntuales de mayor descuento en un puñado de productos, tomar
  // el máximo hacía que el cartel prometiera un % que casi nadie tenía.
  const pctCounts = {};
  promoProducts.forEach(p=>{
    const basePrice = p.sellByWeight ? p.pricePerKg : p.price;
    const pct = Math.round((1-activePromo(p)/basePrice)*100);
    pctCounts[pct] = (pctCounts[pct]||0) + 1;
  });
  const commonPct = Object.keys(pctCounts).reduce((best,pct)=>pctCounts[pct]>pctCounts[best]?pct:best);
  return `
    <div class="home-promo-banner" onclick="nav('ofertas')">
      <div class="hpb-pct">
        <span class="hpb-pct-num">${commonPct}%</span>
        <span class="hpb-pct-off">OFF</span>
      </div>
      <div class="hpb-body">
        <div class="hpb-title">🔥 Oferta por tiempo limitado</div>
        <div class="hpb-sub">${promoProducts.length} producto${promoProducts.length===1?'':'s'} con descuento — tocá para ver</div>
      </div>
      <span class="hpb-arrow">→</span>
    </div>
  `;
}
function renderOfertasScreen(){
  const products = productsOnPromo();
  return `
  <div class="screen candy-catalog">
    <div class="topbar">
      <button class="back" onclick="nav('home')">${ic('chevron')}</button>
      <h2>Ofertas</h2>
    </div>
    <div style="padding:8px 16px 12px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:28px;">🔥</span>
      <p style="font-size:13px; color:rgba(255,255,255,0.6); line-height:1.4;">Productos con descuento por tiempo limitado. El precio vuelve solo al normal cuando vence la oferta.</p>
    </div>
    ${renderCatalogRibbonHTML('ofertas')}
    ${products.length===0 ? `
      <div class="empty-state">${ic('box')}<p>No hay ofertas activas en este momento.</p></div>
    ` : `
      <div class="product-grid">
        ${products.map(p=>`
          <div class="product-card" onclick="openProduct('${p.id}')">
            <div class="pc-img">
              ${pcImgBadgeHtml(p)}
              ${p.photo ? `<img src="${p.photoThumb||p.photo}" alt="" loading="lazy">` : ic('box')}
            </div>
            <div class="pc-body">${pcCardBodyHtml(p)}</div>
          </div>`).join('')}
      </div>
    `}
  </div>`;
}
/* Prioridad: mayorista > promo > precio normal.
   Un cliente mayorista nunca ve el precio de oferta, tenga o no un
   wholesalePrice propio cargado para ese producto puntual. */
function effectivePrice(product){
  if(!product) return 0;
  const client = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  const isWholesaleClient = !!(client && client.wholesale);
  if(isWholesaleClient){
    return product.wholesalePrice || product.price;
  }
  const promo = activePromo(product);
  return promo !== null ? promo : product.price;
}

/* =========================================================
   ORDERS
   ========================================================= */
// Crea el pedido en el servidor (atómico, con descuento de stock incluido)
// y recién si eso sale bien actualiza el estado local. Si el servidor
// rechaza el pedido (p.ej. sin stock), tira una excepción — quien llama
// (submitOrder) es responsable de mostrarle el error al usuario.
function buildCartItemsForOrder(){
  return state.cart.map(c=>{
    const p = state.products.find(pr=>pr.id===c.id);
    if(c.grams){
      return {id:c.id, name:p?p.name:"Producto", price:p?effectivePriceForWeight(p):0, qty:1, grams:c.grams, lineTotal:cartItemLineTotal(c)};
    }
    return {id:c.id, name:p?p.name:"Producto", price:p?effectivePrice(p):0, qty:c.qty, lineTotal:cartItemLineTotal(c)};
  });
}
function orderTotals(items, clientDiscountPct){
  const base = cartTotal();
  const discPct = Number(clientDiscountPct)||0;
  const discAmount = discPct > 0 ? Math.round(base * discPct / 100) : 0;
  return {discPct, discAmount, total: base - discAmount};
}
async function placeOrder(customer, clientDiscountPct=0){
  const items = buildCartItemsForOrder();
  const {discPct, discAmount, total} = orderTotals(items, clientDiscountPct);

  const saved = await apiSaveOrder({customer, items, clientDiscountPct: discPct||undefined, clientDiscountAmount: discAmount||undefined, total});
  const order = mapOrderRow(saved);

  state.orders.unshift(order);
  // decrement stock local (unit-based products only) — el servidor ya lo
  // descontó de forma atómica, esto es solo para que la UI se vea al día.
  items.forEach(it=>{
    const p = state.products.find(pr=>pr.id===it.id);
    if(p && !it.grams) p.stock = Math.max(0, p.stock - it.qty);
  });
  creditPointsToClient(customer, order.total, order.id);
  state.cart = [];
  saveState();
  notifyNewOrderPush(order);
  return order;
}
// Aviso push del pedido mandado directo desde el navegador del cliente en
// vez de por un trigger de la base de datos — se intentó con un trigger de
// Postgres (pg_net) pero no disparaba cuando el pedido se creaba a través
// de PostgREST (sí andaba llamando la misma función desde el SQL Editor,
// nunca se pudo determinar la diferencia). Esto es más simple: mismo lugar
// de código que ya manda el WhatsApp del pedido, fire-and-forget, nunca
// bloquea ni rompe el checkout si falla.
function notifyNewOrderPush(order){
  try{
    const itemsQty = order.items.reduce((s,it)=>s+(it.grams?1:(it.qty||1)),0);
    fetch('https://ntfy.sh/sabores-royal-pedidos-13f559350aa4', {
      method:'POST',
      headers:{
        'Title':'Nuevo pedido - Sabores Royal',
        'Message': order.customer.name+' - '+money(order.total)+' ('+itemsQty+' items)',
        'Priority':'urgent',
        'Tags':'shopping_cart',
      },
      body:'',
    }).catch(e=>console.warn('No se pudo mandar la notificación push:', e));
  }catch(e){ console.warn('No se pudo mandar la notificación push:', e); }
}
// Si el servidor no responde (caída de red o de Supabase, no falta de
// stock) igual armamos el pedido localmente para no perder la venta —
// se manda por WhatsApp igual, pero no queda guardado en `orders` ni
// descuenta stock server-side; el negocio lo carga a mano si hace falta.
function placeOrderLocalFallback(customer, clientDiscountPct=0){
  const items = buildCartItemsForOrder();
  const {discPct, discAmount, total} = orderTotals(items, clientDiscountPct);
  const order = {
    id: "SR" + Date.now().toString().slice(-6),
    date: new Date().toISOString(),
    customer, items,
    clientDiscountPct: discPct||undefined,
    clientDiscountAmount: discAmount||undefined,
    total, status: "Pendiente",
  };
  state.orders.unshift(order);
  creditPointsToClient(customer, order.total, order.id);
  state.cart = [];
  saveState();
  return order;
}

/* Upserts a client profile by phone and credits loyalty points ($100 = 1pt).
   Reused by orders placed in the storefront, and by manual/automatic vouchers.
   Phone is normalized to +54 format so clients are recognized consistently
   regardless of which screen they entered their number on. */
function creditPointsToClient(customer, amount, refId){
  if(!customer || !customer.phone) return null;
  const phone = normalizePhone(customer.phone);
  if(!state.clients[phone]){
    state.clients[phone] = {phone, name:customer.name, address:customer.address||"", doc:customer.doc||"", points:0, orders:[]};
  }
  const c = state.clients[phone];
  c.name = customer.name || c.name;
  if(customer.address) c.address = customer.address;
  if(customer.doc) c.doc = customer.doc;
  const delta = Math.floor((amount||0)/100);
  c.points += delta; // optimista: el valor de verdad lo termina fijando el servidor
  if(refId) c.orders.unshift(refId);
  rpcFetch('credit_client_points', {p_phone: phone, p_delta: delta, p_name: customer.name||null})
    .then(row=>{
      const saved = Array.isArray(row) ? row[0] : row;
      if(saved && state.clients[phone]){ state.clients[phone].points = saved.points; saveState(); }
    })
    .catch(e=>console.warn('No se pudieron guardar los puntos en el servidor:', e));
  return c;
}
function tierFor(points){
  if(points>=500) return {key:"oro", label:"Oro"};
  if(points>=200) return {key:"plata", label:"Plata"};
  return {key:"bronce", label:"Bronce"};
}

/* ---------- Canje de Puntos Royal por descuento ---------- */
// 1000 puntos = 5% de descuento, sin tope: 3000 puntos canjeados en un
// mismo pedido/comprobante son 15%. Se canjea siempre en bloques enteros
// de 1000 (no hay canjes parciales de un bloque).
const POINTS_REDEEM_BLOCK = 1000;
const POINTS_REDEEM_PCT_PER_BLOCK = 5;
function maxRedeemablePoints(points){
  return Math.floor((points||0)/POINTS_REDEEM_BLOCK) * POINTS_REDEEM_BLOCK;
}
function pointsRedeemPct(pointsToRedeem){
  return Math.floor((pointsToRedeem||0)/POINTS_REDEEM_BLOCK) * POINTS_REDEEM_PCT_PER_BLOCK;
}
// Resta puntos ya canjeados por un descuento (delta en puntos, no en pesos
// como creditPointsToClient). Reusa credit_client_points con delta negativo,
// igual que hace editClientPoints para correcciones manuales — esa función
// ya corta en 0 de forma atómica en el servidor, así que nunca deja saldo
// negativo aunque dos canjes lleguen casi al mismo tiempo.
function redeemClientPoints(phone, pointsToRedeem){
  if(!phone || !pointsToRedeem) return;
  const p = normalizePhone(phone);
  const c = state.clients[p];
  if(c) c.points = Math.max(0, (c.points||0) - pointsToRedeem);
  rpcFetch('credit_client_points', {p_phone: p, p_delta: -pointsToRedeem, p_name: c?c.name:null})
    .then(row=>{
      const saved = Array.isArray(row) ? row[0] : row;
      if(saved && state.clients[p]){ state.clients[p].points = saved.points; saveState(); }
    })
    .catch(e=>console.warn('No se pudieron descontar los puntos canjeados en el servidor:', e));
}

/* =========================================================
   WHATSAPP MESSAGE BUILDERS
   ========================================================= */
function buildOrderWAMessage(order, unsaved){
  let msg = unsaved
    ? `⚠️ ESTE PEDIDO NO QUEDÓ GUARDADO EN EL SISTEMA (falló la conexión) — cargalo a mano en el panel ⚠️\n\n¡Hola! Quiero confirmar mi pedido #${order.id}\n\n`
    : `¡Hola! Quiero confirmar mi pedido #${order.id}\n\n`;
  order.items.forEach(it=>{
    const label = it.grams ? `${it.grams}g de` : `${it.qty}x`;
    msg += `• ${label} ${it.name} — ${money(it.lineTotal!=null?it.lineTotal:it.price*it.qty)}\n`;
  });
  if(order.clientDiscountAmount > 0){
    msg += `\nDescuento especial (${order.clientDiscountPct}%): -${money(order.clientDiscountAmount)}`;
  }
  msg += `\nTotal: ${money(order.total)}`;
  if(order.customer.address) msg += `\nDirección: ${order.customer.address}`;
  msg += `\nNombre: ${order.customer.name}`;
  if(order.notes) msg += `\nNotas: ${order.notes}`;
  return msg;
}
function buildStatusWAMessage(order){
  const map = {
    "Pendiente":`Hola ${order.customer.name}! Tu pedido #${order.id} en Sabores Royal está PENDIENTE de preparación. Te avisamos cuando esté listo 😊`,
    "Listo":`Hola ${order.customer.name}! Tu pedido #${order.id} en Sabores Royal ya está LISTO para retirar/entregar 🎉`,
    "Entregado":`Hola ${order.customer.name}! Tu pedido #${order.id} fue marcado como ENTREGADO. ¡Gracias por tu compra en Sabores Royal! 🙏`,
  };
  return map[order.status] || `Tu pedido #${order.id} cambió de estado: ${order.status}`;
}

   ========================================================= */
function render(){
  const app = document.getElementById("app");
  const r = state.route;
  let html = "";
  // Solo Cuenta y Chat piden teléfono — el resto se navega libre y el
  // teléfono se pide recién en el checkout (menos fricción para mirar
  // el catálogo).
  const needsLogin = !IS_ADMIN_APP && !state.currentClientPhone && (r.screen==="account" || r.screen==="chat");
  if(r.screen==="home") html = renderHome();
  else if(r.screen==="catalog") html = renderCatalog(r.section);
  else if(r.screen==="product") html = renderProductDetail(r.id);
  else if(r.screen==="cart") html = renderCart();
  else if(r.screen==="checkout") html = renderCheckout();
  else if(r.screen==="success") html = renderSuccess(r.order);
  else if(r.screen==="orders") html = renderOrdersLookup();
  else if(r.screen==="account") html = needsLogin ? renderClientWelcome() : renderAccount();
  else if(r.screen==="admin") html = renderAdmin();
  else if(r.screen==="voucher-view") html = renderVoucherView(r.voucherId);
  else if(r.screen==="price-list-view") html = renderPriceListView(r.productIds, r.priceMode);
  else if(r.screen==="celiaco") html = renderCeliaco();
  else if(r.screen==="ofertas") html = renderOfertasScreen();
  else if(r.screen==="search") html = renderGlobalSearch();
  else if(r.screen==="chat") html = needsLogin ? renderClientWelcome() : renderChat();
  else if(r.screen==="suggestions") html = renderSuggestions();
  else html = renderHome();
  app.innerHTML = html + (["admin","voucher-view","price-list-view"].includes(r.screen) ? "" : renderBottomNav());
  bindDynamic();
}

  const r = state.route.screen;
