function goToClientChat(phone){
  state.adminClientDetailPhone = null;
  state.adminTab = 'chats';
  state.adminChatPhone = phone;
  if(state.adminChatUnread) state.adminChatUnread[phone] = 0;
  render();
  setTimeout(()=>{ const c=document.getElementById('admin-chat-msgs'); if(c) c.scrollTop=c.scrollHeight; },100);
}
function toggleClientWholesale(phone){
  const c = state.clients[phone];
  if(!c) return;
  c.wholesale = !c.wholesale;
  saveState();
  apiSaveWholesaleClients();
  render();
  toast(c.wholesale ? `${c.name} ahora es mayorista` : `${c.name} ya no es mayorista`, "ok");
}
function confirmDeleteClient(phone){
  const c = state.clients[phone];
  if(!c) return;
  if(!confirm(`¿Eliminar a ${c.name} (${c.phone})? Esto borra su perfil y puntos acumulados. No borra sus pedidos o comprobantes ya generados.`)) return;
  // Mayorista y descuento especial se guardan aparte (listas en
  // app_settings, no en la tabla clients) — si no se sacan de ahí
  // también, la próxima sincronización las vuelve a ver en esas listas
  // y recrea al cliente en blanco, como si nunca se hubiera borrado.
  const wasWholesale = !!c.wholesale;
  const hadDiscount = !!c.discountPct;
  delete state.clients[phone];
  if(state.currentClientPhone === phone) state.currentClientPhone = null;
  saveState();
  render();
  apiDeleteClient(phone);
  if(wasWholesale) apiSaveWholesaleClients();
  if(hadDiscount) apiSaveClientDiscounts();
  toast("Cliente eliminado", "ok");
}
// Sin esto, el cliente borrado volvía a aparecer solo con la próxima
// sincronización (apiSyncClients solo agrega lo que ve en el servidor, y
// el servidor todavía lo tenía).
async function apiDeleteClient(phone){
  try{
    await adminFetch('/clients?phone=eq.'+encodeURIComponent(phone), 'DELETE');
  }catch(e){
    console.warn('Error eliminando cliente:', e);
    toast('El cliente se borró acá pero no en el servidor: '+e.message, 'err');
  }
}
function editClientPoints(phone){
  const c = state.clients[phone];
  if(!c) return;
  const input = prompt(`Puntos Royal de ${c.name} (actual: ${c.points})\nIngresá el nuevo total de puntos.`, c.points);
  if(input === null) return;
  const points = Math.max(0, Math.floor(Number(input))||0);
  c.points = points;
  saveState();
  render();
  adminFetch('/rpc/set_client_points', 'POST', {p_phone: phone, p_points: points})
    .catch(e=>{ console.warn('Error guardando puntos:', e); toast('Los puntos se guardaron acá pero no en el servidor: '+e.message, 'err'); });
  toast(`${c.name}: ${points} puntos`, "ok");
}
function editClientDiscount(phone){
  if(!state.adminIsSuperAdmin){ toast("Solo el admin general puede editar descuentos", "err"); return; }
  const c = state.clients[phone];
  if(!c) return;
  const current = c.discountPct || 0;
  const input = prompt(`Descuento especial para ${c.name} (%)\nDejá 0 para quitar el descuento.\nSe aplica sobre el precio mayorista si el cliente ya es mayorista.`, current);
  if(input === null) return;
  const pct = Math.min(100, Math.max(0, Number(input)||0));
  c.discountPct = pct || undefined;
  saveState();
  render();
  apiSaveClientDiscounts();
  toast(pct > 0 ? `${c.name}: ${pct}% de descuento especial` : `${c.name}: sin descuento especial`, "ok");
}
async function apiSaveWholesaleClients(){
  const list = Object.values(state.clients).filter(c=>c.wholesale).map(c=>c.phone);
  const val = JSON.stringify(list);
  try{
    const existing = await adminFetch('/app_settings?setting_key=eq.wholesale_clients&select=id','GET');
    if(existing && existing.length>0){
      await adminFetch('/app_settings?setting_key=eq.wholesale_clients','PATCH',{setting_value:val});
    }else{
      await adminFetch('/app_settings','POST',{setting_key:'wholesale_clients',setting_value:val});
    }
  }catch(e){ console.warn('Error guardando mayoristas:',e); }
}
async function apiSaveClientDiscounts(){
  const discounts = {};
  Object.values(state.clients).forEach(c=>{ if(c.discountPct) discounts[c.phone] = Number(c.discountPct); });
  const val = JSON.stringify(discounts);
  try{
    const existing = await adminFetch('/app_settings?setting_key=eq.client_discounts&select=id', 'GET');
    if(existing && existing.length>0){
      await adminFetch('/app_settings?setting_key=eq.client_discounts', 'PATCH', {setting_value: val});
    }else{
      await adminFetch('/app_settings', 'POST', {setting_key:'client_discounts', setting_value: val});
    }
  }catch(e){ console.warn('Error guardando descuentos:', e); }
}

/* ---------- ADMIN: ESTADÍSTICAS ---------- */
function renderAdminEstadisticas(){
  const orders = state.orders || [];
  const now = new Date();
  const mesActual = now.getMonth();
  const anioActual = now.getFullYear();

  // Revenue: contar solo pedidos entregados o todos (incluir pendiente/listo para mostrar lo facturado)
  const totalVentas = orders.reduce((s,o)=>s+(o.total||0), 0);
  const ventasMes = orders.filter(o=>{
    const d = new Date(o.date);
    return d.getMonth()===mesActual && d.getFullYear()===anioActual;
  }).reduce((s,o)=>s+(o.total||0), 0);
  const pedidosMes = orders.filter(o=>{
    const d = new Date(o.date);
    return d.getMonth()===mesActual && d.getFullYear()===anioActual;
  }).length;

  // Estado de pedidos
  const porEstado = {};
  orders.forEach(o=>{ porEstado[o.status] = (porEstado[o.status]||0)+1; });

  // Ranking clientes por gasto total
  const clienteGasto = {};
  orders.forEach(o=>{
    const phone = o.customer?.phone || "?";
    const name = o.customer?.name || phone;
    if(!clienteGasto[phone]) clienteGasto[phone] = {name, phone, total:0, pedidos:0};
    clienteGasto[phone].total += (o.total||0);
    clienteGasto[phone].pedidos++;
  });
  const topClientes = Object.values(clienteGasto).sort((a,b)=>b.total-a.total).slice(0,10);

  // Ranking productos más vendidos
  const prodVentas = {};
  orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      const key = it.name||it.id;
      if(!prodVentas[key]) prodVentas[key] = {name:key, unidades:0, ingresos:0};
      prodVentas[key].unidades += it.grams ? 1 : (it.qty||1);
      prodVentas[key].ingresos += (it.lineTotal||0);
    });
  });
  const topProductos = Object.values(prodVentas).sort((a,b)=>b.unidades-a.unidades).slice(0,10);

  // Ventas de mostrador (caja-venta.html) — canal aparte de los pedidos online.
  const posSales = state.posSales || [];
  const posTotal = posSales.reduce((s,v)=>s+Number(v.total||0), 0);
  const PAY_LABELS = {efectivo:'Efectivo', debito:'Débito', credito:'Crédito', qr:'QR / MP'};
  const porMedioPago = {};
  posSales.forEach(v=>{
    const k = v.payment_method || '?';
    if(!porMedioPago[k]) porMedioPago[k] = {total:0, cant:0};
    porMedioPago[k].total += Number(v.total||0);
    porMedioPago[k].cant++;
  });
  const porCaja = {};
  posSales.forEach(v=>{
    const k = v.caja || '?';
    porCaja[k] = (porCaja[k]||0) + Number(v.total||0);
  });
  const prodVentasMostrador = {};
  posSales.forEach(v=>{
    (v.items||[]).forEach(it=>{
      const key = it.name||it.id;
      if(!prodVentasMostrador[key]) prodVentasMostrador[key] = {name:key, unidades:0, ingresos:0};
      prodVentasMostrador[key].unidades += (it.qty||1);
      prodVentasMostrador[key].ingresos += (it.lineTotal!=null?it.lineTotal:(it.price||0)*(it.qty||1));
    });
  });
  const topProductosMostrador = Object.values(prodVentasMostrador).sort((a,b)=>b.unidades-a.unidades).slice(0,10);

  const statBox = (label, value, sub='') => `
    <div style="flex:1; min-width:140px; background:var(--glass); border:1px solid var(--glass-bd); border-radius:14px; padding:14px 16px;">
      <div style="font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px;">${label}</div>
      <div style="font-size:22px; font-weight:700; color:var(--gold2);">${value}</div>
      ${sub ? `<div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px;">${sub}</div>` : ''}
    </div>`;

  return `
    <div style="padding:14px 16px;">
      <h3 style="color:var(--gold2); font-size:14px; margin-bottom:10px;">Resumen general</h3>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        ${statBox('Total facturado', money(totalVentas), orders.length+' pedidos en total')}
        ${statBox('Este mes', money(ventasMes), pedidosMes+' pedidos')}
      </div>

      <h3 style="color:var(--gold2); font-size:14px; margin-bottom:10px;">Estado de pedidos</h3>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        ${Object.entries(porEstado).map(([st,cnt])=>`
          <div style="background:var(--glass); border:1px solid var(--glass-bd); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:8px;">
            <span class="status-pill status-${st.toLowerCase()}">${st}</span>
            <span style="font-weight:700; font-size:16px;">${cnt}</span>
          </div>`).join('')}
        ${Object.keys(porEstado).length===0 ? '<p style="font-size:13px; color:rgba(255,255,255,0.4);">Sin pedidos todavía.</p>' : ''}
      </div>

      <h3 style="color:var(--gold2); font-size:14px; margin-bottom:10px;">Top clientes por gasto</h3>
      ${topClientes.length===0 ? `<p style="font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:18px;">Sin datos todavía.</p>` :
        topClientes.map((c,i)=>`
          <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--glass-bd);">
            <div style="width:24px; text-align:center; font-weight:700; font-size:13px; color:var(--gold2); opacity:.7;">${i+1}</div>
            <div style="flex:1;">
              <div style="font-weight:600; font-size:13.5px;">${escapeHtml(c.name)}</div>
              <div style="font-size:11.5px; color:rgba(255,255,255,0.45);">${c.pedidos} pedido${c.pedidos!==1?'s':''}</div>
            </div>
            <div style="font-weight:700; color:var(--gold2); font-size:14px;">${money(c.total)}</div>
          </div>`).join('')
      }

      <h3 style="color:var(--gold2); font-size:14px; margin:18px 0 10px;">Top productos más vendidos</h3>
      ${topProductos.length===0 ? `<p style="font-size:13px; color:rgba(255,255,255,0.4);">Sin datos todavía.</p>` :
        topProductos.map((p,i)=>`
          <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--glass-bd);">
            <div style="width:24px; text-align:center; font-weight:700; font-size:13px; color:var(--gold2); opacity:.7;">${i+1}</div>
            <div style="flex:1;">
              <div style="font-weight:600; font-size:13.5px;">${p.name}</div>
              <div style="font-size:11.5px; color:rgba(255,255,255,0.45);">${p.unidades} unidad${p.unidades!==1?'es':''} vendida${p.unidades!==1?'s':''}</div>
            </div>
            <div style="font-weight:700; color:var(--gold2); font-size:14px;">${money(p.ingresos)}</div>
          </div>`).join('')
      }

      <h3 style="color:var(--gold2); font-size:14px; margin:22px 0 10px; border-top:1px solid var(--glass-bd); padding-top:18px;">🧾 Ventas de mostrador (Caja)</h3>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        ${statBox('Total facturado en caja', money(posTotal), posSales.length+' venta'+(posSales.length!==1?'s':''))}
        ${Object.entries(porCaja).map(([caja,total])=>statBox(caja, money(total))).join('')}
      </div>

      <h3 style="color:var(--gold2); font-size:13px; margin-bottom:10px;">Por medio de pago</h3>
      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        ${Object.keys(porMedioPago).length===0 ? '<p style="font-size:13px; color:rgba(255,255,255,0.4);">Sin ventas de mostrador todavía.</p>' :
          Object.entries(porMedioPago).map(([k,v])=>statBox(PAY_LABELS[k]||k, money(v.total), v.cant+' venta'+(v.cant!==1?'s':''))).join('')
        }
      </div>

      <h3 style="color:var(--gold2); font-size:14px; margin-bottom:10px;">Top productos vendidos en mostrador</h3>
      ${topProductosMostrador.length===0 ? `<p style="font-size:13px; color:rgba(255,255,255,0.4);">Sin datos todavía.</p>` :
        topProductosMostrador.map((p,i)=>`
          <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--glass-bd);">
            <div style="width:24px; text-align:center; font-weight:700; font-size:13px; color:var(--gold2); opacity:.7;">${i+1}</div>
            <div style="flex:1;">
              <div style="font-weight:600; font-size:13.5px;">${escapeHtml(p.name)}</div>
              <div style="font-size:11.5px; color:rgba(255,255,255,0.45);">${p.unidades} unidad${p.unidades!==1?'es':''} vendida${p.unidades!==1?'s':''}</div>
            </div>
            <div style="font-weight:700; color:var(--gold2); font-size:14px;">${money(p.ingresos)}</div>
          </div>`).join('')
      }
    </div>
  `;
}

/* =========================================================
   COMPROBANTES (Factura / Remito / Ticket — no fiscales)
   ========================================================= */
const VOUCHER_META = {
  factura:{label:"Factura", letter:"B", short:"FAC"},
  remito:{label:"Remito", letter:"X", short:"REM"},
  ticket:{label:"Ticket", letter:"-", short:"TIC"},
  presupuesto:{label:"Presupuesto", letter:"P", short:"PRE"},
};

function nextVoucherNumber(type){
  state.voucherCounters[type] = (state.voucherCounters[type]||0) + 1;
  return state.voucherCounters[type];
}
function formatVoucherNumber(type, num){
  return "0001-" + String(num).padStart(8,"0");
}

function calcIVADiscriminado(total){
  // Prices already include IVA. We discriminate it out, we don't add it on top.
  const pct = state.fiscal.ivaPorcentaje || 21;
  const neto = Math.round((total / (1 + pct/100)) * 100) / 100;
  const iva = Math.round((total - neto) * 100) / 100;
  return {pct, neto, iva, total};
}

// Pide el CAE a AFIP (Factura B, vía public/api/facturar.js) para los importes
// ya calculados. Devuelve {cae, caeVencimiento, numeroComprobante, puntoVenta,
// tipoComprobante, ambiente} o null si AFIP la rechazó / no se pudo conectar
// (ya avisa con un toast en ese caso — el llamador no genera el comprobante).
async function requestAfipCae({total, neto, iva, ivaPct, docNumber}){
  try{
    const res = await fetch('/api/facturar', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+((adminSession&&adminSession.access_token)||'')},
      body: JSON.stringify({total, neto, iva, ivaPct, docNumber: docNumber||null, puntoVenta: state.fiscal.puntoVenta||null}),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || ('Error '+res.status));
    return data;
  }catch(e){
    toast('No se pudo autorizar la factura ante AFIP: '+e.message, 'err');
    return null;
  }
}

/* Create a voucher object from a list of {name, qty, price} items.
   includeIVA: only meaningful for type 'factura' — whether to show IVA breakdown.
   Remito and Ticket never show IVA breakdown regardless of this flag.
   For type 'factura' this is async: pide el CAE a AFIP antes de guardar nada,
   y devuelve null (sin tocar contadores ni estado) si AFIP no la autoriza. */
async function createVoucher(type, items, customer, orderId, includeIVA, generalDiscount, pointsRedeemed){
  const afterItemDiscounts = items.reduce((s,it)=>{
    const lineTotal = it.price*it.qty;
    const discPct = Number(it.discountPct)||0;
    return s + lineTotal*(1-discPct/100);
  }, 0);
  const gd = generalDiscount || {type:"percent", value:0};
  const manualDiscountAmount = gd.value>0
    ? (gd.type==="percent" ? afterItemDiscounts*(gd.value/100) : Math.min(gd.value, afterItemDiscounts))
    : 0;
  // Canje de Puntos Royal: siempre un % sobre afterItemDiscounts, se suma al
  // descuento general que haya cargado el admin en vez de reemplazarlo.
  const pointsPct = pointsRedeemPct(pointsRedeemed);
  const pointsDiscountAmount = pointsPct > 0 ? afterItemDiscounts * (pointsPct/100) : 0;
  const generalDiscountAmount = manualDiscountAmount + pointsDiscountAmount;
  const total = Math.max(0, afterItemDiscounts - generalDiscountAmount);
  const showIVA = type === "factura" && !!includeIVA;
  const ivaCalc = calcIVADiscriminado(total);

  let afip = null;
  if(type === "factura"){
    afip = await requestAfipCae({total, neto: ivaCalc.neto, iva: ivaCalc.iva, ivaPct: ivaCalc.pct, docNumber: customer&&customer.doc});
    if(!afip) return null;
  }

  const number = nextVoucherNumber(type);
  const voucher = {
    id: "v"+Date.now()+Math.floor(Math.random()*1000),
    type, number,
    date: new Date().toISOString(),
    items, customer: customer||{name:"Consumidor Final", phone:"", address:""},
    total,
    generalDiscount: (gd.value>0 || pointsPct>0) ? {...gd, pointsRedeemed: pointsRedeemed||0, pointsDiscountPct: pointsPct, pointsDiscountAmount} : null,
    generalDiscountAmount,
    showIVA,
    ivaPct: ivaCalc.pct, iva: ivaCalc.iva, neto: ivaCalc.neto,
    orderId: orderId||null,
    afipCae: afip ? afip.cae : null,
    afipCaeVencimiento: afip ? afip.caeVencimiento : null,
    afipNumero: afip ? afip.numeroComprobante : null,
    afipPuntoVenta: afip ? afip.puntoVenta : null,
    afipTipoComprobante: afip ? afip.tipoComprobante : null,
    afipAmbiente: afip ? afip.ambiente : null,
    afipDocTipo: afip ? afip.docTipo : null,
    afipDocNro: afip ? afip.docNro : null,
    afipCuitEmisor: afip ? afip.cuitEmisor : null,
  };
  state.vouchers.unshift(voucher);
  // Credit points only for vouchers not tied to an order (orders already credit
  // points themselves), not for presupuestos (quotes aren't confirmed sales),
  // and only for phones that are already a known client — brand-new clients are
  // offered a save prompt instead, to respect the "ask before saving" preference.
  if(!orderId && type !== "presupuesto" && customer && customer.phone && state.clients[normalizePhone(customer.phone)]){
    creditPointsToClient(customer, total, voucher.id);
  }
  if(pointsRedeemed > 0 && customer && customer.phone){
    redeemClientPoints(customer.phone, pointsRedeemed);
  }
  saveState();
  apiSaveVoucher(voucher);
  return voucher;
}

async function generateVoucherFromOrder(orderId, type, includeIVA){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  // Los items vendidos por peso no tienen "qty" (tienen "grams"), así que se
  // pasan como 1 unidad cuyo "precio" es el importe total de esa línea —
  // si no, el comprobante calcula qty*price con qty=undefined y da $NaN.
  // Los items marcados sin stock no se facturan (no se van a entregar).
  const items = order.items.filter(it=>!it.sinStock).map(it=> it.grams
    ? {name: formatOrderItemLabel(it), qty:1, price: it.lineTotal!=null ? it.lineTotal : (it.price/1000)*it.grams}
    : {name: it.name, qty: it.qty, price: it.price}
  );
  if(type === "factura"){
    const overlay = document.getElementById("voucher-picker-overlay");
    if(overlay) overlay.querySelector(".modal-sheet").innerHTML = `<div class="modal-handle"></div><h3 class="modal-title">Factura</h3><p style="padding:24px 16px; font-size:13px; color:rgba(255,255,255,0.6); text-align:center;"><span class="spin" style="display:inline-block;">${ic('sparkle')}</span><br><br>Solicitando CAE a AFIP…</p>`;
  }
  const voucher = await createVoucher(type, items, order.customer, order.id, includeIVA);
  if(!voucher){ if(type==="factura") onPickOrderVoucherType(orderId, "factura"); return; }
  closeVoucherPickerModal();
  viewVoucher(voucher.id);
}

function manualVoucherRedeemUiHtml(){
  const d = manualVoucherDraft;
  if(d.editingVoucherId || d.items.length===0) return '';
  const client = manualVoucherClient();
  const maxRedeemable = maxRedeemablePoints(client ? client.points : 0);
  if(maxRedeemable < POINTS_REDEEM_BLOCK) return '';
  const redeemed = d.pointsRedeemed||0;

function adjustManualVoucherPoints(delta){
  const client = manualVoucherClient();
  const maxRedeemable = maxRedeemablePoints(client ? client.points : 0);
  manualVoucherDraft.pointsRedeemed = Math.min(maxRedeemable, Math.max(0, (manualVoucherDraft.pointsRedeemed||0) + delta));
  renderManualVoucherModal();
}
/* Computes the final total for the manual voucher draft, applying per-item
   discounts first, then the general discount (percent or fixed amount) and
   the points-redeem discount (always additive on top of it) on top of that
   subtotal. Returns the breakdown so the UI can show each step. */
function computeManualVoucherTotal(d){
  const subtotal = d.items.reduce((s,it)=>s+(it.price||0)*(Number(it.qty)||0),0);
  const afterItemDiscounts = d.items.reduce((s,it)=>{
    const lineTotal = (it.price||0)*(Number(it.qty)||0);
    const discPct = Number(it.discountPct)||0;
    return s + lineTotal*(1-discPct/100);
  },0);
  let generalDiscountAmount = 0;
  const gdType = d.generalDiscountType || "percent";
  const gdValue = Number(d.generalDiscountValue)||0;
  if(gdValue > 0){
    generalDiscountAmount = gdType === "percent" ? afterItemDiscounts*(gdValue/100) : Math.min(gdValue, afterItemDiscounts);
  }
  const pointsDiscountPct = pointsRedeemPct(d.pointsRedeemed);
  const pointsDiscountAmount = pointsDiscountPct > 0 ? afterItemDiscounts*(pointsDiscountPct/100) : 0;
  const total = Math.max(0, afterItemDiscounts - generalDiscountAmount - pointsDiscountAmount);
  return { subtotal, afterItemDiscounts, generalDiscountAmount, pointsDiscountPct, pointsDiscountAmount, total };
}
function renderManualVoucherTotals(){
  const d = manualVoucherDraft;
  const breakdown = computeManualVoucherTotal(d);
  const hasItemDiscounts = d.items.some(it=>(Number(it.discountPct)||0) > 0);
  let rows = "";
  if(hasItemDiscounts){
    rows += `<div class="summary-row"><span>Subtotal sin descuentos</span><span>${money(breakdown.subtotal)}</span></div>`;
    rows += `<div class="summary-row"><span>Después de descuentos por ítem</span><span>${money(breakdown.afterItemDiscounts)}</span></div>`;
  }
  if(breakdown.generalDiscountAmount > 0){
    rows += `<div class="summary-row"><span>Descuento general</span><span>-${money(breakdown.generalDiscountAmount)}</span></div>`;
  }
  if(breakdown.pointsDiscountAmount > 0){
    rows += `<div class="summary-row" style="color:var(--ok);"><span>Canje de puntos (${breakdown.pointsDiscountPct}%)</span><span>-${money(breakdown.pointsDiscountAmount)}</span></div>`;
  }
  if(d.type==="factura" && d.includeIVA){
    const c = calcIVADiscriminado(breakdown.total);
    rows += `
      <div class="summary-row"><span>Neto</span><span>${money(c.neto)}</span></div>
      <div class="summary-row"><span>IVA (${c.pct}%, incluido)</span><span>${money(c.iva)}</span></div>
    `;
  }
  rows += `<div class="summary-row total"><span>Total</span><span>${money(breakdown.total)}</span></div>`;
  return rows;
}

function updateManualItem(idx, field, value){
  if(field==="qty" && Number(value)<=0){ manualVoucherDraft.items.splice(idx,1); }
  else if(field==="qty"){ manualVoucherDraft.items[idx].qty = Math.max(1, Number(value)||1); }
  else if(field==="price"){ manualVoucherDraft.items[idx].price = Math.max(0, Number(value)||0); }
  else if(field==="discountPct"){ manualVoucherDraft.items[idx].discountPct = Math.min(100, Math.max(0, Number(value)||0)); }
  else{ manualVoucherDraft.items[idx][field] = value; }

async function confirmManualVoucher(){
  const d = manualVoucherDraft;
  if(d.items.length===0){ toast("Agregá al menos un producto", "err"); return; }
  const items = d.items.map(it=>({name: it.name||"Producto", qty:Number(it.qty)||1, price:it.price||0, discountPct:Number(it.discountPct)||0}));
  const customer = {name: d.customerName||"Consumidor Final", phone:d.customerPhone||"", address:d.customerAddress||"", doc:d.customerDoc||""};
  const generalDiscount = {type: d.generalDiscountType||"percent", value: Number(d.generalDiscountValue)||0};

  if(d.editingVoucherId){
    const voucher = updateVoucherInPlace(d.editingVoucherId, d.type, items, customer, d.includeIVA, generalDiscount);
    closeManualVoucherModal();
    if(voucher){ toast("Comprobante actualizado", "ok"); viewVoucher(voucher.id); }
    return;
  }
  const isNewClient = d.type !== "presupuesto" && customer.phone && !state.clients[normalizePhone(customer.phone)];
  const btn = document.getElementById("btn-confirm-voucher");
  const originalLabel = btn ? btn.innerHTML : null;
  if(d.type==="factura" && btn){ btn.innerHTML = `<span class="spin">${ic('sparkle')}</span> Solicitando CAE a AFIP…`; btn.disabled = true; }
  const voucher = await createVoucher(d.type, items, customer, null, d.includeIVA, generalDiscount, d.pointsRedeemed||0);
  if(!voucher){ if(btn){ btn.innerHTML = originalLabel; btn.disabled = false; } return; }
  closeManualVoucherModal();
  if(isNewClient){
    openSaveClientPrompt(customer, voucher.total, voucher.id);
  }else{
    viewVoucher(voucher.id);
  }
}

/* Edit an existing voucher in place: keeps id, number and original date,
   recalculates total/IVA breakdown from the new items/type/customer. */
function updateVoucherInPlace(voucherId, type, items, customer, includeIVA, generalDiscount){
  const voucher = state.vouchers.find(v=>v.id===voucherId);
  if(!voucher) return null;
  const afterItemDiscounts = items.reduce((s,it)=>{
    const lineTotal = it.price*it.qty;
    const discPct = Number(it.discountPct)||0;
    return s + lineTotal*(1-discPct/100);
  }, 0);
  const gd = generalDiscount || {type:"percent", value:0};
  const generalDiscountAmount = gd.value>0
    ? (gd.type==="percent" ? afterItemDiscounts*(gd.value/100) : Math.min(gd.value, afterItemDiscounts))
    : 0;
  const total = Math.max(0, afterItemDiscounts - generalDiscountAmount);
  const showIVA = type === "factura" && !!includeIVA;
  const ivaCalc = calcIVADiscriminado(total);
  voucher.type = type;
  voucher.items = items;
  voucher.customer = customer;
  voucher.total = total;
  voucher.generalDiscount = gd.value>0 ? gd : null;
  voucher.generalDiscountAmount = generalDiscountAmount;
  voucher.showIVA = showIVA;
  voucher.ivaPct = ivaCalc.pct;
  voucher.iva = ivaCalc.iva;
  voucher.neto = ivaCalc.neto;
  voucher.editedAt = new Date().toISOString();
  saveState();
  apiSaveVoucher(voucher);
  return voucher;
}

function confirmDeleteVoucher(voucherId){
  const voucher = state.vouchers.find(v=>v.id===voucherId);
  if(!voucher) return;
  const label = `${VOUCHER_META[voucher.type].label} ${formatVoucherNumber(voucher.type, voucher.number)}`;
  if(!confirm(`¿Eliminar ${label}? Esta acción no se puede deshacer.`)) return;
  state.vouchers = state.vouchers.filter(v=>v.id!==voucherId);
  saveState();
  apiDeleteVoucher(voucherId);
  toast("Comprobante eliminado", "ok");
  state.adminTab = "comprobantes";
  nav("admin");
}

// "20260815" -> "15/08/2026"
function formatAfipDate(yyyymmdd){
  const s = String(yyyymmdd||'');
  if(s.length!==8) return s;
  return s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4);
}
// Arma la URL del QR obligatorio en comprobantes electrónicos (RG 4291 de
// AFIP) a partir de los datos que devolvió AFIP al autorizar la factura.
function buildAfipQrUrl(voucher){
  const payload = {
    ver: 1,
    fecha: String(voucher.date||'').slice(0,10),
    cuit: Number(voucher.afipCuitEmisor)||0,
    ptoVta: voucher.afipPuntoVenta,
    tipoCmp: voucher.afipTipoComprobante,
    nroCmp: voucher.afipNumero,
    importe: voucher.total,
    moneda: 'PES',
    ctz: 1,
    tipoDocRec: voucher.afipDocTipo,
    nroDocRec: Number(voucher.afipDocNro)||0,
    tipoCodAut: 'E',
    codAut: Number(voucher.afipCae)||0,
  };
  return 'https://www.afip.gob.ar/fe/qr/?p=' + btoa(JSON.stringify(payload));
}

async function downloadVoucherPDF(voucherId){
  const voucher = state.vouchers.find(v=>v.id===voucherId);
  if(!voucher) return;
  const btn = document.getElementById("btn-download-pdf");
  const originalLabel = btn ? btn.innerHTML : null;
  if(btn){ btn.innerHTML = `<span class="spin">${ic('sparkle')}</span> Generando...`; btn.disabled = true; }

  // Open the window IMMEDIATELY, synchronously within the click handler.
  // Safari (especially iOS) only allows window.open() to succeed when it's directly
  // tied to a user gesture — any await before calling it breaks that link and the
  // popup gets silently blocked, which is why the button looked like it "did nothing".
  const win = window.open("", "_blank");
  if(win){ win.document.write("<title>Generando PDF…</title><body style='font-family:sans-serif; padding:24px; color:#444;'>Generando el comprobante, un momento…</body>"); }

  try{
    const [html2canvasMod, jsPDFMod] = await Promise.all([
      import("https://esm.sh/html2canvas@1.4.1"),
      import("https://esm.sh/jspdf@2.5.1"),
    ]);
    const html2canvas = html2canvasMod.default || html2canvasMod;
    const jsPDF = jsPDFMod.jsPDF || jsPDFMod.default || jsPDFMod;
    const source = document.getElementById("voucher-doc-content");
    if(!source) throw new Error("No se encontró el documento");
    // Small delay ensures any pending layout/reflow (e.g. blocks added right
    // before this call) is fully settled before html2canvas reads the DOM.
    await new Promise(r => setTimeout(r, 50));
    const canvas = await html2canvas(source, {
      scale: 2,
      backgroundColor: "#ffffff",
      windowWidth: source.scrollWidth,
      windowHeight: source.scrollHeight,
      height: source.scrollHeight,
      width: source.scrollWidth,
    });
    const imgData = canvas.toDataURL("image/png");
    const pdf = new jsPDF({ unit: "pt", format: "a4" });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const margin = 24;
    const usableWidth = pageWidth - margin*2;
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    pdf.addImage(imgData, "PNG", margin, margin, usableWidth, imgHeight);
    const blob = pdf.output("blob");
    const blobUrl = URL.createObjectURL(blob);
    if(win && !win.closed){
      win.location.href = blobUrl;
    }else{
      // Popup was blocked or closed by the user: fall back to navigating this tab
      window.location.href = blobUrl;
    }
    toast("PDF listo — usá el botón compartir para guardarlo", "ok");
  }catch(err){
    console.error(err);
    if(win && !win.closed) win.close();
    toast("No se pudo generar el PDF. Probá con 'Imprimir' y guardar como PDF.", "err");
  }finally{
    if(btn){ btn.innerHTML = originalLabel; btn.disabled = false; }
  }
}

function shareVoucherWA(voucherId){
  const voucher = state.vouchers.find(v=>v.id===voucherId);
  if(!voucher) return;
  let msg = `${VOUCHER_META[voucher.type].label} ${formatVoucherNumber(voucher.type, voucher.number)} — Sabores Royal\n\n`;
  voucher.items.forEach(it=>{ msg += `• ${it.qty}x ${it.name}${voucher.type!=="remito"?` — ${money(it.price*it.qty)}`:''}\n`; });
  if(voucher.type!=="remito") msg += `\nTotal: ${money(voucher.total)}`;
  if(voucher.type==="presupuesto") msg += `\n\nPresupuesto sin cargo, sujeto a confirmación y disponibilidad de stock.`;
  if(voucher.type!=="remito" && voucher.type!=="presupuesto" && state.fiscal.aliasTransferencia) msg += `\n\nTransferencias a alias: ${state.fiscal.aliasTransferencia}`;
  const phone = voucher.customer.phone ? voucher.customer.phone.replace(/\D/g,'') : WA_NUMBER;
  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), "_blank");
}

  const name = document.getElementById("hb-name").value.trim();

  const item = { id:'hb'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name: name||'Sin nombre', image };
  state.homeBackgrounds.push(item);
  state.homeBackgroundActiveId = item.id;
  saveState();
  closeHomeBgModal();
  render();
  toast('Fondo guardado y aplicado','ok');
  apiSaveHomeBackgrounds();
}

  arr.splice(idx, 1);
  saveState(); render();
  apiSaveContent(type==='novedad'?'novedades':'ofertas');
}

  sectionBannerDraft.images[i] = "";
  const overlay = document.getElementById("secbanner-modal-overlay");
  if(overlay) overlay.innerHTML = renderSectionBannerModalHTML(sectionBannerType);
}
function closeSectionBannerModal(){
  const el = document.getElementById("secbanner-modal-overlay");
  if(el) el.remove();
}
async function saveSectionBannerModal(type){
  const title = document.getElementById("sb-title").value.trim();
  const subtitle = document.getElementById("sb-subtitle").value.trim();
  const active = document.getElementById("sb-active").checked;
  const layout = sectionBannerDraft.layout==='grid4' ? 'grid4' : 'single';
  let image = "";
  let images = ["","","",""];
  let video = "";
  if(layout==='grid4'){
    if(!title && !sectionBannerDraft.images.some(x=>x)){ toast("Agregá al menos un título o una foto","err"); return; }
    for(let i=0;i<4;i++){
      let img = sectionBannerDraft.images[i] || "";
      if(img && img.startsWith('data:')){
        try{ img = await uploadPhoto(img, 'secbanner_'+type+'_g'+i+'_'+Date.now()); }
        catch(pe){ toast('Foto '+(i+1)+' no se pudo subir: '+pe.message,'err'); }
      }
      images[i] = img;
    }
    image = images.find(x=>x) || "";
  } else {
    image = sectionBannerDraft.image || "";
    video = sectionBannerDraft.video || "";
    if(!title && !image && !video){ toast("Agregá al menos un título, una imagen o un video","err"); return; }
    if(image && image.startsWith('data:')){
      try{ image = await uploadPhoto(image, 'secbanner_'+type+'_'+Date.now()); }
      catch(pe){ toast('Foto no se pudo subir: '+pe.message,'err'); }
    }
    if(video && video.startsWith('data:')){
      try{ video = await uploadPhoto(video, 'secbanner_'+type+'_vid_'+Date.now()); }
      catch(pe){ toast('Video no se pudo subir: '+pe.message,'err'); }
    }
  }
  const banner = { image, images, video, layout, title, subtitle, active };
  if(type==='novedad'){ state.bannerNovedades = banner; }
  else{ state.bannerOfertas = banner; }
  saveState();
  closeSectionBannerModal();
  render();
  toast('Banner guardado','ok');
  apiSaveSectionBanner(type);
}

/* =========================================================

   Flexible scope: everything, a whole section, a whole category,
   a whole subcategory, or hand-picked individual products. Price
   column can show normal, wholesale, or both side by side.
   ========================================================= */
let priceListDraft = { scope:{}, priceMode:"normal" }; // scope: {productId: true} when selected

function renderPriceListScopeTreeHTML(){
  return Object.keys(SECTION_META).map(section=>{
    const cats = state.categories[section]||{};
    const sectionProducts = state.products.filter(p=>p.section===section);
    if(sectionProducts.length===0) return "";
    return `
    <div style="padding:10px 16px 0;">
      <div class="cat-tree-item">
        <div class="cat-tree-head">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" ${sectionProducts.every(p=>priceListDraft.scope[p.id])?'checked':''} onchange="toggleScopeGroup(this.checked, ${JSON.stringify(sectionProducts.map(p=>p.id))})">
            ${SECTION_META[section].label}
          </label>
        </div>
        ${Object.keys(cats).sort((a,b)=>a.localeCompare(b,'es')).map(cat=>{
          const catProducts = sectionProducts.filter(p=>p.cat===cat);
          if(catProducts.length===0) return "";
          return `
          <div style="margin:10px 0 0 14px; padding:8px 0 0; border-top:1px solid var(--glass-bd);">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:rgba(255,255,255,0.85); margin-bottom:6px;">
              <input type="checkbox" ${catProducts.every(p=>priceListDraft.scope[p.id])?'checked':''} onchange="toggleScopeGroup(this.checked, ${JSON.stringify(catProducts.map(p=>p.id))})">
              ${cat}
            </label>
            <div style="margin-left:22px; display:flex; flex-direction:column; gap:5px;">
              ${catProducts.map(p=>`
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; color:rgba(255,255,255,0.65);">
                  <input type="checkbox" ${priceListDraft.scope[p.id]?'checked':''} onchange="toggleScopeProduct('${p.id}', this.checked)">
                  ${p.name}
                </label>
              `).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}
function renderPriceListScopeTree(){
  const el = document.getElementById("price-list-scope-tree");
  if(el) el.innerHTML = renderPriceListScopeTreeHTML();
}
function toggleScopeProduct(productId, checked){
  priceListDraft.scope[productId] = checked;
  renderPriceListScopeTree();
  render(); // refresh the "Generar lista (N)" counter button
}
function toggleScopeGroup(checked, productIds){
  productIds.forEach(id=> priceListDraft.scope[id] = checked);
  renderPriceListScopeTree();
  render();
}
function selectAllPriceListScope(value){
  state.products.forEach(p=> priceListDraft.scope[p.id] = value);
  render();
}

function generatePriceListDocument(){
  const selectedIds = Object.keys(priceListDraft.scope).filter(id=>priceListDraft.scope[id]);
  if(selectedIds.length===0){ toast("Seleccioná al menos un producto", "err"); return; }
  const products = state.products.filter(p=>selectedIds.includes(p.id));
  nav("price-list-view", { productIds: selectedIds, priceMode: priceListDraft.priceMode });
}

function buildPriceListDocHTML(productIds, priceMode){
  const products = state.products.filter(p=>productIds.includes(p.id));
  const dateStr = new Date().toLocaleDateString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric"});
  const showNormal = priceMode!=="wholesale";
  const showWholesale = priceMode==="wholesale" || priceMode==="both";
  // Group by section -> category, same structure as the catalog itself
  let rows = "";
  Object.keys(SECTION_META).forEach(section=>{
    const sectionProducts = products.filter(p=>p.section===section);
    if(sectionProducts.length===0) return;
    rows += `<tr><td colspan="${1+(showNormal?1:0)+(showWholesale?1:0)}" style="padding-top:14px; font-weight:800; font-size:13px; border-bottom:1.5px solid #1a1a1a;">${SECTION_META[section].label}</td></tr>`;
    const cats = [...new Set(sectionProducts.map(p=>p.cat))].sort((a,b)=>a.localeCompare(b,'es'));
    cats.forEach(cat=>{
      const catProducts = sectionProducts.filter(p=>p.cat===cat);
      rows += `<tr><td colspan="${1+(showNormal?1:0)+(showWholesale?1:0)}" style="padding-top:8px; font-weight:600; font-size:11.5px; color:#666;">${cat}</td></tr>`;
      catProducts.forEach(p=>{
        rows += `<tr>
          <td>${p.name}</td>
          ${showNormal?`<td style="text-align:right;">${money(p.price)}</td>`:''}
          ${showWholesale?`<td style="text-align:right; color:#1a6ea8;">${p.wholesalePrice?money(p.wholesalePrice):'—'}</td>`:''}
        </tr>`;
      });
    });
  });
  return `
    <div class="vd-head">
      <div class="vd-brand">
        <img src="${LOGO_DATA_URL}" alt="">
        <div>
          <h2>${state.fiscal.razonSocial}</h2>
          <p>${state.fiscal.domicilio}</p>
        </div>
      </div>
      <div class="vd-doctype">
        <div class="vd-letter" style="font-size:16px;">Lista de<br>Precios</div>
        <div class="vd-num">${dateStr}</div>
      </div>
    </div>
    <table>
      <thead><tr><th>Producto</th>${showNormal?'<th style="text-align:right;">Precio</th>':''}${showWholesale?'<th style="text-align:right;">Mayorista</th>':''}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="vd-footer">Lista de precios sujeta a modificaciones sin previo aviso · Sabores Royal — ${state.fiscal.domicilio}</div>
  `;
}

async function downloadPriceListPDF(){
  const btn = document.getElementById("btn-download-pricelist-pdf");
  const originalLabel = btn ? btn.innerHTML : null;
  if(btn){ btn.innerHTML = `<span class="spin">${ic('sparkle')}</span> Generando...`; btn.disabled = true; }
  const win = window.open("", "_blank");
  if(win){ win.document.write("<title>Generando PDF…</title><body style='font-family:sans-serif; padding:24px; color:#444;'>Generando la lista de precios, un momento…</body>"); }
  try{
    const [html2canvasMod, jsPDFMod] = await Promise.all([
      import("https://esm.sh/html2canvas@1.4.1"),
      import("https://esm.sh/jspdf@2.5.1"),
    ]);
    const html2canvas = html2canvasMod.default || html2canvasMod;
    const jsPDF = jsPDFMod.jsPDF || jsPDFMod.default || jsPDFMod;
    const source = document.getElementById("price-list-doc-content");
    if(!source) throw new Error("No se encontró el documento");
    await new Promise(r => setTimeout(r, 50));
    const canvas = await html2canvas(source, {
      scale: 2, backgroundColor: "#ffffff",
      windowWidth: source.scrollWidth, windowHeight: source.scrollHeight,
      height: source.scrollHeight, width: source.scrollWidth,
    });
    const imgData = canvas.toDataURL("image/png");
    const pdf = new jsPDF({ unit: "pt", format: "a4" });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const margin = 24;
    const usableWidth = pageWidth - margin*2;
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    pdf.addImage(imgData, "PNG", margin, margin, usableWidth, imgHeight);
    const blob = pdf.output("blob");
    const blobUrl = URL.createObjectURL(blob);
    if(win && !win.closed){ win.location.href = blobUrl; } else { window.location.href = blobUrl; }
    toast("PDF listo — usá el botón compartir para guardarlo", "ok");
  }catch(err){
    console.error(err);
    if(win && !win.closed) win.close();
    toast("No se pudo generar el PDF. Probá con 'Imprimir' y guardar como PDF.", "err");
  }finally{
    if(btn){ btn.innerHTML = originalLabel; btn.disabled = false; }
  }
}

function sendPriceListWA(){
  const phoneInput = document.getElementById("pricelist-wa-phone");
  const phone = phoneInput && phoneInput.value.trim() ? phoneInput.value.replace(/\D/g,'') : WA_NUMBER;
  let msg = `Lista de Precios — Sabores Royal\n\n`;
  msg += `Te comparto nuestra lista de precios actualizada. Cualquier consulta, escribime por aquí. 😊`;
  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), "_blank");
  const overlay = document.getElementById("pricelist-wa-overlay");
  if(overlay) overlay.remove();
}
