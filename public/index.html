let _chatPollTimer = null;
let _chatPendingFile = null;

function updateAppBadge(count){
  if(!('setAppBadge' in navigator)) return;
  if(count > 0) navigator.setAppBadge(count).catch(()=>{});
  else navigator.clearAppBadge().catch(()=>{});
}

async function syncClientChat(){
  const phone = state.currentClientPhone;
  if(!phone) return;
  try{
    const data = await rpcFetch('get_chat_messages', {p_phone: phone});
    const msgs = data || [];
    const changed = JSON.stringify(msgs) !== JSON.stringify(state.chatMessages);
    state.chatMessages = msgs;
    const newUnread = msgs.filter(m=>m.sender==='admin'&&!m.read).length;
    if(state.route.screen==='chat'){
      state.chatUnread = 0;
      updateAppBadge(0);
      rpcFetch('mark_chat_read_by_client', {p_phone: phone}).catch(()=>{});
      if(changed){
        // Actualiza solo el contenedor de mensajes — NO recrea el input
        const container = document.getElementById('chat-msgs');
        if(container){
          const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
          container.innerHTML = buildChatBubbles(msgs);
          if(wasAtBottom) container.scrollTop = container.scrollHeight;
        }
      }
    } else {
      const unreadChanged = newUnread !== state.chatUnread;
      state.chatUnread = newUnread;
      if(changed || unreadChanged){
        updateAppBadge(newUnread);
        // Actualiza solo el badge del bottom nav, sin destruir formularios activos
        const badge = document.getElementById('chat-nav-badge');
        if(badge){
          badge.textContent = newUnread;
          badge.style.display = newUnread > 0 ? '' : 'none';
        }
      }
    }
  }catch(e){ console.warn('Chat sync:', e); }
}

async function syncAdminChats(){
  if(!state.adminAuthed) return;
  try{
    const data = await adminFetch('/chat_messages?order=created_at.desc&limit=600', 'GET');
    const msgs = data || [];
    const changed = JSON.stringify(msgs) !== JSON.stringify(state.chatMessages);
    state.chatMessages = msgs;
    const unread = {};
    msgs.forEach(m=>{ if(m.sender==='client'&&!m.read) unread[m.client_phone]=(unread[m.client_phone]||0)+1; });
    state.adminChatUnread = unread;
    const totalUnread = Object.values(unread).reduce((s,n)=>s+n,0);
    updateAppBadge(totalUnread);
    if(state.adminChatPhone && state.adminTab==='chats'){
      if(changed){
        // Actualiza solo los mensajes — NO destruye el input de respuesta
        const container = document.getElementById('admin-chat-msgs');
        if(container){
          const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
          const chatMsgs = msgs.filter(m=>m.client_phone===state.adminChatPhone).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
          container.innerHTML = buildChatBubbles(chatMsgs, true);
          if(wasAtBottom) container.scrollTop = container.scrollHeight;
        }
      }
    } else if(changed){
      // No usar render() acá: esto corre cada 5s en segundo plano sin
      // importar en qué pestaña esté el admin, y un render() completo
      // borra cualquier formulario a medio llenar (ej: el selector de
      // proveedor del Comparador, o el archivo que estás por subir).
      // Solo actualizamos el globo de Chats en el lugar.
      updateAdminChatTabBadge(totalUnread);
    }
  }catch(e){ console.warn('Admin chat sync:', e); }
}
function updateAdminChatTabBadge(count){
  const btn = document.querySelector('.admin-tab[data-tab="chats"]');
  if(!btn) return;
  let badge = btn.querySelector('.admin-tab-badge');
  if(count>0){
    const text = count>99?'99+':String(count);
    if(badge){ badge.textContent = text; }
    else{
      badge = document.createElement('span');
      badge.className = 'admin-tab-badge';
      badge.textContent = text;
      btn.appendChild(badge);
    }
  } else if(badge){
    badge.remove();
  }
}

async function uploadChatFile(file){
  const ext = file.name.split('.').pop().toLowerCase() || 'bin';
  const filename = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/chat-attachments/${filename}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert': 'false'
    },
    body: file
  });
  if(!res.ok){ const t = await res.text(); throw new Error(t); }
  return {
    url: `${SUPABASE_URL}/storage/v1/object/public/chat-attachments/${filename}`,
    type: file.type
  };
}

function onChatFileSelected(inputEl, previewId){
  const file = inputEl.files[0];
  if(!file) return;
  if(file.size > 15 * 1024 * 1024){ toast("El archivo no puede superar 15 MB","err"); return; }
  _chatPendingFile = file;
  const preview = document.getElementById(previewId);
  if(!preview) return;
  if(file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = e => {
      preview.innerHTML = `<div style="position:relative;display:inline-block;">
        <img src="${e.target.result}" style="max-height:72px;border-radius:8px;display:block;">
        <button onclick="_chatPendingFile=null;document.getElementById('${previewId}').innerHTML=''" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e74c3c;border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">×</button>
      </div>`;
    };
    reader.readAsDataURL(file);
  } else {
    preview.innerHTML = `<div style="display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-bd);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--white);">
      📎 <span style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${file.name}</span>
      <button onclick="_chatPendingFile=null;document.getElementById('${previewId}').innerHTML=''" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1;padding:0 0 0 4px;">×</button>
    </div>`;
  }
}

// El cliente manda vía RPC — el servidor fuerza sender='client', así que
// nadie puede mandar un mensaje haciéndose pasar por 'admin' desde acá.
async function clientChatSend(phone, clientName, message, attachmentUrl='', attachmentType=''){
  return rpcFetch('send_chat_message', {
    p_phone: phone, p_client_name: clientName||'Cliente', p_message: message,
    p_attachment_url: attachmentUrl||null, p_attachment_type: attachmentType||null,
  });
}
// El admin manda con acceso directo a la tabla, autenticado con su sesión.
async function adminChatSend(phone, clientName, message, attachmentUrl='', attachmentType=''){
  const body = {client_phone:phone, client_name:clientName||'Cliente', sender:'admin', message};
  if(attachmentUrl){ body.attachment_url = attachmentUrl; body.attachment_type = attachmentType; }
  return adminFetch('/chat_messages', 'POST', body);
}

function buildChatBubbles(msgs, isAdmin=false){
  if(!msgs || msgs.length===0) return `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.45;padding:50px 24px;text-align:center;gap:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p style="font-size:13px;">Sin mensajes aún.</p>
    </div>`;
  return msgs.map(m=>{
    const mine = isAdmin ? m.sender==='admin' : m.sender==='client';
    const time = new Date(m.created_at).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const canDelete = isAdmin || mine;
    const delBtn = canDelete ? `<button class="chat-del-btn" title="Borrar mensaje" onclick="deleteChatMessage('${m.id}',decodeURIComponent('${encodeURIComponent(m.client_phone||'')}'),${isAdmin})">${ic('trash')}</button>` : '';
    const bgColor = mine ? 'var(--gold)' : 'var(--glass)';
    const textColor = mine ? 'var(--navy)' : 'var(--white)';
    let attachHtml = '';
    if(m.attachment_url){
      const safeUrl = escapeHtml(m.attachment_url);
      const isImg = m.attachment_type && m.attachment_type.startsWith('image/');
      if(isImg){
        // Envuelto en <a href> (no onclick con la URL embebida) — un onclick
        // con la URL adentro de comillas es un vector de inyección de JS
        // aunque la URL esté HTML-escapada, porque el navegador decodifica
        // las entidades HTML del atributo antes de interpretarlo como JS.
        attachHtml = `<a href="${safeUrl}" target="_blank"><img src="${safeUrl}" style="max-width:220px;max-height:220px;border-radius:10px;display:block;cursor:pointer;margin-bottom:${m.message?'6px':'0'};" onerror="this.style.display='none'"></a>`;
      } else {
        const fname = escapeHtml(decodeURIComponent(m.attachment_url.split('/').pop().replace(/^\d+_[a-z0-9]+\./, '')));
        attachHtml = `<a href="${safeUrl}" target="_blank" download style="display:flex;align-items:center;gap:7px;color:${textColor};text-decoration:none;background:rgba(0,0,0,0.15);border-radius:8px;padding:8px 10px;margin-bottom:${m.message?'6px':'0'};font-size:12.5px;">📎 <span style="word-break:break-all;">${fname}</span></a>`;
      }
    }
    const hasPad = !m.attachment_url || m.message;
    return `
      <div style="display:flex;flex-direction:${mine?'row-reverse':'row'};align-items:flex-end;gap:8px;margin-bottom:2px;">
        ${!mine&&!isAdmin?`<div style="width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--navy);flex-shrink:0;">SR</div>`:''}
        <div style="max-width:78%;padding:${hasPad?'10px 14px':'6px'};border-radius:${mine?'18px 18px 4px 18px':'18px 18px 18px 4px'};background:${bgColor};border:${mine?'none':'1px solid var(--glass-bd)'};color:${textColor};overflow:hidden;">
          ${attachHtml}
          ${m.message?`<p style="font-size:14px;line-height:1.45;word-break:break-word;">${escapeHtml(m.message)}</p>`:''}
          <p style="font-size:10px;opacity:.55;margin-top:4px;display:flex;align-items:center;justify-content:flex-end;padding:${hasPad?'0':'0 8px 4px'};">${time}${delBtn}</p>
        </div>
      </div>`;
  }).join('');
}

async function deleteChatMessage(id, phone, isAdmin){
  if(!confirm('¿Borrar este mensaje? Esta acción no se puede deshacer.')) return;
  try{
    if(isAdmin){
      await adminFetch(`/chat_messages?id=eq.${encodeURIComponent(id)}`, 'DELETE');
      await syncAdminChats();
    } else {
      await rpcFetch('delete_chat_message', {p_phone: phone, p_id: String(id)});
      await syncClientChat();
    }
  }catch(e){ toast("Error al borrar: "+e.message,"err"); }
}

async function clientSendChat(){
  const phone = state.currentClientPhone;
  const client = phone ? state.clients[phone] : null;
  const input = document.getElementById('chat-input');
  if(!input) return;
  const msg = input.value.trim();
  if(!msg && !_chatPendingFile){ if(!phone){ toast("Necesitás una cuenta para chatear","err"); } return; }
  if(!phone){ toast("Necesitás una cuenta para chatear","err"); return; }
  input.value = ''; input.disabled = true;
  let attachUrl='', attachType='';
  if(_chatPendingFile){
    try{
      const up = await uploadChatFile(_chatPendingFile);
      attachUrl = up.url; attachType = up.type;
    }catch(e){ toast("Error subiendo archivo: "+e.message,"err"); input.disabled=false; return; }
    _chatPendingFile = null;
    const preview = document.getElementById('chat-file-preview');
    if(preview) preview.innerHTML='';

  try{
    await clientChatSend(phone, client?.name||'Cliente', msg, attachUrl, attachType);

    if(c) c.scrollTop = c.scrollHeight;
  }catch(e){ toast("Error: "+e.message,"err"); input.value = msg; }
  finally{ input.disabled=false; input.focus(); }
}

    if(!convMap[m.client_phone]) convMap[m.client_phone]={phone:m.client_phone,name:m.client_name||m.client_phone,last:m};
    if(new Date(m.created_at)>new Date(convMap[m.client_phone].last.created_at)) convMap[m.client_phone].last=m;

function advanceOrderStatus(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const flow = ["Pendiente","Revision","Listo","Entregado"];
  const idx = flow.indexOf(order.status);
  if(idx < flow.length-1){ order.status = flow[idx+1]; saveState(); render(); apiUpdateOrderStatus(orderId, order.status); }
}
// Vuelve el pedido un paso atrás en el flujo (ej. lo marcaste "Listo" por
// error, o hay que volver a "En revisión" para corregir algo antes de
// avisarle al cliente). No toca stock ni total, solo el estado.
function regressOrderStatus(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const flow = ["Pendiente","Revision","Listo","Entregado"];
  const idx = flow.indexOf(order.status);
  if(idx > 0){ order.status = flow[idx-1]; saveState(); render(); apiUpdateOrderStatus(orderId, order.status); }
}
// Anular un pedido: a diferencia de borrarlo, el pedido queda visible con
// estado "Cancelado" y el stock que create_order() había descontado se
// devuelve (solo para ítems vendidos por unidad — los vendidos por peso
// nunca descontaron stock). El descuento/devolución real y atómica pasa en
// el servidor vía el RPC cancel_order; acá solo se refleja al toque en la
// pantalla para no esperar a la próxima sincronización.
function confirmCancelOrder(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  if(!confirm(`¿Anular el pedido #${order.id} de ${order.customer.name}? El stock descontado se va a devolver.`)) return;
  order.items.forEach(it=>{
    if(it.grams) return;
    const p = state.products.find(pr=>pr.id===String(it.id));
    if(p) p.stock = (p.stock||0) + (it.qty||1);
  });
  order.status = "Cancelado";
  saveState(); render();
  apiCancelOrder(orderId);
  toast("Pedido anulado, stock devuelto", "ok");
}
async function apiCancelOrder(orderId){
  try{
    await adminFetch('/rpc/cancel_order', 'POST', {p_order_id: orderId});
    apiSyncProducts();
  }catch(e){
    console.warn('Error anulando pedido:', e);
    toast('Se anuló acá pero no en el servidor: '+e.message, 'err');
  }
}
// Suma de lineTotal de todos los items sin importar sinStock — se usa para
// mostrar tachado el total "original" al lado del nuevo total ya descontado.
function orderOriginalTotal(order){
  const base = order.items.reduce((s,it)=>s+Number(it.lineTotal||0), 0);
  const discPct = order.clientDiscountPct || 0;
  return base - (discPct>0 ? Math.round(base*discPct/100) : 0);
}
// Recalcula el total del pedido excluyendo los items marcados sinStock,
// reaplicando el % de descuento del cliente si tenía uno.
function recalcOrderTotal(order){
  const base = order.items.reduce((s,it)=> s + (it.sinStock ? 0 : Number(it.lineTotal||0)), 0);
  const discPct = order.clientDiscountPct || 0;
  const discAmount = discPct>0 ? Math.round(base*discPct/100) : 0;
  order.clientDiscountAmount = discAmount || undefined;
  order.total = base - discAmount;
}
// Marca/desmarca un item del pedido como sin stock: lo tacha, descuenta su
// importe del total (con el % de descuento reaplicado) y devuelve/retira el
// stock del producto (solo para items vendidos por unidad — los vendidos
// por peso nunca descontaron stock al crear el pedido).
function toggleOrderItemStock(orderId, itemIndex){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const it = order.items[itemIndex];
  if(!it) return;
  const marking = !it.sinStock;
  if(marking && !confirm(`¿Marcar "${it.name}" como sin stock? Se descuenta del total del pedido.`)) return;
  it.sinStock = marking;
  if(!it.grams){
    const p = state.products.find(pr=>pr.id===String(it.id));
    if(p){
      p.stock = Math.max(0, p.stock + (marking ? (it.qty||1) : -(it.qty||1)));
      apiPatchProductStock(p);
    }
  }
  recalcOrderTotal(order);
  saveState(); render();
  apiUpdateOrderItems(order);
  toast(marking ? "Producto marcado sin stock, descontado del total" : "Producto restaurado al pedido", "ok");
}

// Cambia solo la cantidad/gramos de un item, manteniendo el mismo producto
// y precio unitario ya acordado. Para items vendidos por unidad, ajusta el
// stock por la diferencia (positiva o negativa) entre la cantidad vieja y
// la nueva — los vendidos por peso nunca tocan stock.
function saveEditOrderItemQty(orderId, itemIndex){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const it = order.items[itemIndex];
  if(!it) return;
  const input = document.getElementById('eoi-qty');
  const val = Number(input.value);
  if(!val || val<=0){ toast('Ingresá una cantidad válida', 'err'); return; }
  const isWeight = !!it.grams;
  if(isWeight){
    it.grams = val;
  } else {
    const delta = val - (it.qty||0);
    it.qty = val;
    if(!it.sinStock && delta !== 0){
      const p = state.products.find(pr=>pr.id===String(it.id));
      if(p){
        p.stock = Math.max(0, p.stock - delta);
        apiPatchProductStock(p);
      }
    }
  }
  it.lineTotal = isWeight ? (it.price/1000)*it.grams : it.price*it.qty;
  recalcOrderTotal(order);
  saveState(); render();
  apiUpdateOrderItems(order);
  closeEditOrderItemModal();
  toast('Item actualizado', 'ok');
}
// Reemplaza el producto de un item del pedido por otro (ej. no hay stock de
// la marca pedida). Devuelve el stock del producto viejo (si correspondía
// descontarlo) y descuenta el del nuevo, y recalcula precio según si el
// cliente es mayorista y si el producto nuevo tiene oferta activa.
function replaceOrderItemProduct(orderId, itemIndex, newProductId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const it = order.items[itemIndex];
  if(!it) return;
  const newProduct = state.products.find(p=>p.id===newProductId);
  if(!newProduct) return;
  if(!confirm(`¿Reemplazar "${it.name}" por "${newProduct.name}"?`)) return;

  if(!it.grams && !it.sinStock){
    const oldProduct = state.products.find(pr=>pr.id===String(it.id));
    if(oldProduct){ oldProduct.stock = (oldProduct.stock||0) + (it.qty||1); apiPatchProductStock(oldProduct); }
  }

  const clientPhone = order.customer && order.customer.phone ? normalizePhone(order.customer.phone) : null;
  const client = clientPhone ? state.clients[clientPhone] : null;
  const isWholesale = !!(client && client.wholesale);
  const promo = activePromo(newProduct);

  it.id = Number(newProduct.id);
  it.name = newProduct.name;
  it.sinStock = false;
  if(newProduct.sellByWeight){
    const grams = it.grams || newProduct.minGrams || 50;
    const pricePerKg = isWholesale ? (newProduct.wholesalePricePerKg || newProduct.pricePerKg) : (promo !== null ? promo : newProduct.pricePerKg);
    it.price = pricePerKg;
    it.grams = grams;
    delete it.qty;
    it.lineTotal = (pricePerKg/1000)*grams;
  } else {
    const qty = it.qty || 1;
    const unitPrice = isWholesale ? (newProduct.wholesalePrice || newProduct.price) : (promo !== null ? promo : newProduct.price);
    it.price = unitPrice;
    it.qty = qty;
    delete it.grams;
    it.lineTotal = unitPrice*qty;
    newProduct.stock = Math.max(0, (newProduct.stock||0) - qty);
    apiPatchProductStock(newProduct);
  }
  recalcOrderTotal(order);
  saveState(); render();
  apiUpdateOrderItems(order);
  closeEditOrderItemModal();
  toast('Producto reemplazado', 'ok');
}

// Agrega el item nuevo al pedido con el precio según si el cliente es
// mayorista y si el producto tiene oferta activa, y descuenta stock (solo
// para productos vendidos por unidad — por peso nunca descuentan stock).
function confirmAddOrderItem(orderId, productId){
  const order = state.orders.find(o=>o.id===orderId);
  const product = state.products.find(p=>p.id===productId);
  if(!order || !product) return;
  const input = document.getElementById('aoi-qty');
  const val = Number(input.value);
  if(!val || val<=0){ toast('Ingresá una cantidad válida', 'err'); return; }

  const clientPhone = order.customer && order.customer.phone ? normalizePhone(order.customer.phone) : null;
  const client = clientPhone ? state.clients[clientPhone] : null;
  const isWholesale = !!(client && client.wholesale);
  const promo = activePromo(product);

  const newItem = { id: Number(product.id), name: product.name };
  if(product.sellByWeight){
    const pricePerKg = isWholesale ? (product.wholesalePricePerKg || product.pricePerKg) : (promo !== null ? promo : product.pricePerKg);
    newItem.price = pricePerKg;
    newItem.grams = val;
    newItem.lineTotal = (pricePerKg/1000)*val;
  } else {
    const unitPrice = isWholesale ? (product.wholesalePrice || product.price) : (promo !== null ? promo : product.price);
    newItem.price = unitPrice;
    newItem.qty = val;
    newItem.lineTotal = unitPrice*val;
    product.stock = Math.max(0, (product.stock||0) - val);
    apiPatchProductStock(product);
  }
  order.items.push(newItem);
  recalcOrderTotal(order);
  saveState(); render();
  apiUpdateOrderItems(order);
  closeAddOrderItemModal();
  toast('Producto agregado al pedido', 'ok');
}
async function apiPatchProductStock(p){
  if(!IS_ADMIN_APP || !p._apiId) return;
  try{
    await adminFetch('/products?id=eq.'+p._apiId, 'PATCH', {stock: p.stock});
  }catch(e){
    console.warn('Error actualizando stock del producto:', e);
    toast('No se pudo actualizar el stock en el servidor: '+e.message, 'err');
  }
}
async function apiUpdateOrderItems(order){
  if(!IS_ADMIN_APP) return;
  try{
    await adminFetch('/orders?id=eq.'+encodeURIComponent(order.id), 'PATCH', {
      items: order.items, total: order.total, discount_amount: order.clientDiscountAmount||null,
    });
  }catch(e){
    console.warn('Error actualizando items del pedido:', e);
    toast('No se pudo actualizar en el servidor: '+e.message, 'err');
  }
}

  if(!win){ toast("El navegador bloqueó la ventana emergente. Permití los pop-ups.", "err"); return; }
  const fecha = new Date(o.date||o._savedAt||'').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

function shareOrder(orderId){
  const o = state.orders.find(ord=>ord.id===orderId);
  if(!o) return;
  if(o.status==="Pendiente" || o.status==="Revision"){ toast("Marcá el pedido como Listo antes de compartirlo — terminá de revisar stock/cantidades primero", "err"); return; }
  const fecha = new Date(o.date||o._savedAt||'').toLocaleDateString('es-AR');
  let txt = `📦 *Pedido #${o.id}* — Sabores Royal\n`;
  txt += `📅 ${fecha} · ${orderStatusLabel(o.status)}\n`;
  txt += `👤 ${o.customer?.name||'—'}`;
  if(o.customer?.phone) txt += ` · ${o.customer.phone}`;
  if(o.customer?.address) txt += `\n📍 ${o.customer.address}`;
  txt += `\n\n`;
  (o.items||[]).forEach(it=>{
    const cant = it.grams ? `${it.grams}g de` : `${it.qty||1}x`;
    txt += it.sinStock ? `❌ ${cant} ${it.name||'Producto'} (sin stock — no incluido)\n` : `• ${cant} ${it.name||'Producto'}\n`;
  });
  if(o.clientDiscountPct) txt += `\n🎁 Descuento (${o.clientDiscountPct}%): -$${Number(o.clientDiscountAmount||0).toLocaleString('es-AR')}`;
  txt += `\n💰 *Total: $${Number(o.total||0).toLocaleString('es-AR')}*`;
  if(navigator.share){
    navigator.share({ title: `Pedido #${o.id} — Sabores Royal`, text: txt }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(txt)
      .then(()=>toast("Texto copiado al portapapeles","ok"))
      .catch(()=>toast("Copiá el texto manualmente","err"));
  }
}

function renderAdminProductos(){
  const q = (state.adminProductQ||'').toLowerCase().trim();
  let productos = q
    ? state.products.filter(p=>p.name.toLowerCase().includes(q))
    : state.products;
  if(state.adminProductLowStockOnly) productos = productos.filter(isLowStock);
  if(state.adminProductHiddenOnly) productos = productos.filter(p=>p.hidden);
  if(state.adminProductCatFilter) productos = productos.filter(p=>p.cat===state.adminProductCatFilter);
  if(state.adminProductSubFilter) productos = productos.filter(p=>p.sub===state.adminProductSubFilter);
  if(productos.length===0){
    return `<div class="empty-state">${ic('box')}<p>${state.adminProductLowStockOnly?'Ningún producto con stock bajo.':state.adminProductHiddenOnly?'Ningún producto oculto.':(q?`Sin resultados para "${q}"`:'No hay productos que coincidan con el filtro.')}</p></div>`;
  }
  return productos.map(p=>`
    <div class="prod-row-v2 ${p.hidden?'is-hidden':''}">
      <div class="prod-row-v2-top">
        <img src="${p.photoThumb||p.photo||''}" loading="lazy" onerror="this.style.opacity=0">
        <div class="prod-row-v2-info">
          <h4>${p.name}${p.sellByWeight?' <span style="font-size:9px; color:#6db8e8;">(x kg)</span>':''}${p.hidden?' <span class="badge-oculto">OCULTO</span>':''}</h4>
          <p>Stock: ${p.stock} · ${SECTION_META[p.section]?.label||p.section}${p.sub?` · ${p.sub}`:''} ${isLowStock(p)?`<span style="color:${p.stock===0?'var(--danger)':'var(--warn)'}; font-weight:700;">· ${p.stock===0?'Sin stock':'Stock bajo'}</span>`:''}</p>
        </div>
      </div>
      <div class="prod-row-v2-bottom">
        <div class="prod-row-v2-price-col">
          <span class="prod-row-v2-price-label">Cliente</span>
          ${p.sellByWeight ? `
            <input type="number" value="${p.pricePerKg||''}" onchange="updateProductPriceInline('${p.id}','pricePerKg',this.value)" style="color:var(--gold2);">
          ` : `
            <input type="number" value="${p.price}" onchange="updateProductPriceInline('${p.id}','price',this.value)" style="color:var(--gold2);">
          `}
        </div>
        <div class="prod-row-v2-price-col">
          <span class="prod-row-v2-price-label">Mayorista</span>
          ${p.sellByWeight ? `
            <input type="number" value="${p.wholesalePricePerKg||''}" placeholder="—" onchange="updateProductPriceInline('${p.id}','wholesalePricePerKg',this.value)" style="color:#6db8e8;">
          ` : `
            <input type="number" value="${p.wholesalePrice||''}" placeholder="—" onchange="updateProductPriceInline('${p.id}','wholesalePrice',this.value)" style="color:#6db8e8;">
          `}
        </div>
        <div class="prod-row-actions">
          <button class="icon-btn" style="font-size:14px; ${p.hidden?'color:var(--danger); border-color:var(--danger);':''}" title="${p.hidden?'Oculto — tocá para mostrarlo a los clientes':'Visible — tocá para ocultarlo de los clientes'}" onclick="toggleProductHidden('${p.id}')">${p.hidden?'🙈':'👁️'}</button>
          <button class="icon-btn" style="${p.barcode?'':'color:var(--warn); border-color:var(--warn);'}" title="${p.barcode?'Código: '+p.barcode:'Sin código de barras'}" onclick="openBarcodeScannerModal(code=>updateProductBarcode('${p.id}', code))">${ic('camera')}</button>
          <button class="icon-btn" onclick="openProductModal('${p.id}')">${ic('edit')}</button>

function toggleProductHidden(id){
  const p = state.products.find(pr=>pr.id===id);
  if(!p) return;
  p.hidden = !p.hidden;
  saveState();
  apiSaveProduct(p);
  renderAdminProductosInPlace();
  toast(p.hidden ? "Producto oculto para los clientes" : "Producto visible para los clientes", "ok");
}
function renderAdminProductosInPlace(){
  const el = document.getElementById('admin-productos-list');
  if(el) el.innerHTML = renderAdminProductos();
}
function updateProductPriceInline(productId, field, value){
  const p = state.products.find(pr=>pr.id===productId);
  if(!p) return;
  // Al corregir el precio de cliente, si el producto ya tenía un precio
  // mayorista cargado, se mantiene el mismo % de descuento en vez de
  // dejarlo desactualizado (mismo cálculo que el % desc. mayorista del
  // modal de producto).
  if(field==="price"){
    const oldPrice = p.price;
    p.price = Math.max(0, Number(value)||0);
    if(p.wholesalePrice && oldPrice>0){
      const pct = 1 - (p.wholesalePrice/oldPrice);
      p.wholesalePrice = Math.round(p.price*(1-pct));
    }
  }
  else if(field==="wholesalePrice"){ p.wholesalePrice = value.trim()==="" ? null : Math.max(0, Number(value)||0); }
  else if(field==="pricePerKg"){
    const oldPrice = p.pricePerKg;
    p.pricePerKg = Math.max(0, Number(value)||0);
    if(p.wholesalePricePerKg && oldPrice>0){
      const pct = 1 - (p.wholesalePricePerKg/oldPrice);
      p.wholesalePricePerKg = Math.round(p.pricePerKg*(1-pct));
    }
  }
  else if(field==="wholesalePricePerKg"){ p.wholesalePricePerKg = value.trim()==="" ? null : Math.max(0, Number(value)||0); }
  saveState();
  apiSaveProduct(p);
  renderAdminProductosInPlace();
  toast("Precio actualizado", "ok");
}
function deleteProduct(id){
  const toDelete = state.products.find(p=>p.id===id);
  if(!toDelete) return;
  if(!confirm(`¿Eliminar el producto "${toDelete.name}"? Esta acción no se puede deshacer.`)) return;
  state.products = state.products.filter(p=>p.id!==id);
  saveState(); render();
  apiDeleteProduct(toDelete);
}

// Recalcula el precio mayorista (unidad o por kilo, según suffix) a partir
// del precio normal y el % de descuento cargado, cada vez que se toca
// cualquiera de los dos campos. El campo de precio mayorista queda
// editable igual, por si se quiere afinar el número a mano.
function applyWholesalePct(suffix){
  const priceEl = document.getElementById(suffix==='-kg' ? 'pm-price-per-kg' : 'pm-price');
  const pctEl = document.getElementById('pm-wholesale-pct'+suffix);
  const wholesaleEl = document.getElementById('pm-wholesale-price'+(suffix==='-kg'?'-per-kg':''));
  const price = Number(priceEl.value)||0;
  const pct = Number(pctEl.value)||0;
  if(pct>0 && price>0){
    wholesaleEl.value = Math.round(price*(1-pct/100));
  }
}

function saveProductModal(id){
  const name = document.getElementById("pm-name").value.trim();
  const section = document.getElementById("pm-section").value;
  const cat = document.getElementById("pm-cat").value;
  const sub = document.getElementById("pm-sub").value;
  const price = Number(document.getElementById("pm-price").value)||0;
  const wholesaleRaw = document.getElementById("pm-wholesale-price").value.trim();
  const wholesalePrice = wholesaleRaw ? Number(wholesaleRaw) : null;
  const stock = Number(document.getElementById("pm-stock").value)||0;
  const barcode = document.getElementById("pm-barcode").value.trim();
  const desc = document.getElementById("pm-desc").value.trim();
  const sellByWeight = document.getElementById("pm-sellbyweight-toggle").classList.contains("on");
  const sinTacc = document.getElementById("pm-sintacc-toggle").classList.contains("on");
  const sinAzucar = document.getElementById("pm-sinazucar-toggle").classList.contains("on");
  const hidden = document.getElementById("pm-hidden-toggle").classList.contains("on");
  const displayQty = Number(document.getElementById("pm-display-qty").value)||null;
  const displayDiscount = Number(document.getElementById("pm-display-discount").value)||null;
  const promoPriceRaw = sellByWeight
    ? document.getElementById("pm-promo-price-per-kg").value.trim()
    : document.getElementById("pm-promo-price").value.trim();
  const promoPrice = promoPriceRaw ? Number(promoPriceRaw) : null;
  const promoUntil = (sellByWeight
    ? document.getElementById("pm-promo-until-per-kg").value
    : document.getElementById("pm-promo-until").value) || null;
  const pricePerKg = sellByWeight ? (Number(document.getElementById("pm-price-per-kg").value)||0) : null;
  const wholesalePerKgRaw = sellByWeight ? document.getElementById("pm-wholesale-price-per-kg").value.trim() : "";
  const wholesalePricePerKg = wholesalePerKgRaw ? Number(wholesalePerKgRaw) : null;
  const minGrams = sellByWeight ? (Number(document.getElementById("pm-min-grams").value)|| 50) : null;
  if(!name){ toast("Ingresá un nombre", "err"); return; }
  if(sellByWeight && !pricePerKg){ toast("Ingresá el precio por kilo", "err"); return; }
  if(!id){
    const dup = state.products.find(pr=>pr.name.toLowerCase().trim()===name.toLowerCase().trim());
    if(dup && !confirm(`Ya existe un producto llamado "${dup.name}" en ${SECTION_META[dup.section]?.label||dup.section}. ¿Guardarlo igual?`)) return;
  }
  // El sello Sin TACC se estampa directo en los píxeles de la foto final:
  // photoClean es la versión de abajo, sin el sello, guardada aparte para
  // que el toggle del editor de fotos se pueda apagar más adelante sin
  // perder la edición. Si el toggle de la foto está apagado, no hace
  // falta guardar una versión "limpia" separada (la foto final ya lo es).
  const photoClean = adminPhotoDraft.sinTacc ? (adminPhotoDraft.currentClean||null) : null;
  let savedProduct;
  if(id){
    const p = state.products.find(pr=>pr.id===id);
    Object.assign(p, {name, section, cat, sub, price, wholesalePrice, stock, desc, barcode, sellByWeight, pricePerKg, wholesalePricePerKg, minGrams, sinTacc, sinAzucar, hidden, displayQty, displayDiscount, promoPrice, promoUntil, photo:adminPhotoDraft.current||p.photo, photoClean});

  }else{
    savedProduct = {
      id: "p"+Date.now(), section, cat, sub, name, price, wholesalePrice, stock, desc, barcode,
      sellByWeight, pricePerKg, wholesalePricePerKg, minGrams, sinTacc, sinAzucar, hidden, displayQty, displayDiscount, promoPrice, promoUntil,
      photo: adminPhotoDraft.current||"", photoClean
    };
    state.products.push(savedProduct);
  }
  saveState();
  apiSaveProduct(savedProduct);
  if(barcode) upsertBarcodeCatalog(barcode, name, price);
  closeProductModal();
  render();
  toast("Producto guardado", "ok");
}

/* ---------- ESCANEO DE CÓDIGO DE BARRAS ----------
   Dos motores, en orden de preferencia:
   1) BarcodeDetector nativo del navegador — donde existe (Chrome/Android
      sobre todo) usa el decodificador de códigos del sistema operativo
      (Play Services Barcode API en Android), mucho más preciso y rápido
      que cualquier librería en JS. No hace falta cargar nada.
   2) @zxing/browser por CDN como respaldo en navegadores sin soporte
      nativo (desktop, iOS Safari). Es el mismo motor de decodificación
      que usan la mayoría de las libs de escaneo web, incluida la que se
      había probado antes acá y no leía bien los códigos de barras.
   En los dos casos se pide explícito qué formatos buscar (EAN/UPC/Code128
   para productos de supermercado + QR) para que no pierda tiempo
   probando formatos que no van a aparecer.
   Además hay un campo para escribir el código a mano por si la cámara
   sigue sin leerlo (mala luz, código dañado, etc).

   openBarcodeScannerModal(onResult): un solo escaneo, cierra sola y
     devuelve el código (para el campo del modal de producto).
   openBulkBarcodeScanner(): cámara continua — cada código escaneado
     pausa la cámara, te deja elegir a qué producto del catálogo
     pertenece, lo guarda, y sigue escaneando sin volver a abrir nada. */
const BARCODE_FORMATS_NATIVE = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf','qr_code'];
let _barcodeScanOnResult = null;
let _barcodeScanMode = 'single'; // 'single' | 'bulk'
let _barcodeStream = null;
let _barcodePollTimer = null;
let _zxingControls = null;
let _zxingLoadPromise = null;

function scannerModalHTML(title, bodyExtra, closeLabel){
  return `
    <div class="modal-sheet" style="padding-bottom:20px;">
      <div class="modal-handle"></div>
      <h3 class="modal-title">${title}</h3>

        <video id="barcode-video" autoplay playsinline muted style="width:100%; max-height:320px; display:block; object-fit:cover;"></video>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80%; height:100px; border:2px solid var(--gold); border-radius:10px; pointer-events:none;"></div>
      </div>
      ${bodyExtra}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="barcode-manual-input" placeholder="O escribilo a mano…" style="flex:1; padding:11px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-bd); color:var(--cream); outline:none;" onkeydown="if(event.key==='Enter') submitManualBarcode()">
        <button class="btn-secondary" style="flex:none; padding:0 16px;" onclick="submitManualBarcode()">Usar</button>
      </div>

}
function openBarcodeScannerModal(onResult){
  _barcodeScanMode = 'single';

function onBarcodeDetected(code){
  if(!code) return;

    pauseBarcodeCamera();

  } else if(_barcodeScanMode==='conteo'){
    pauseBarcodeCamera();

}
function submitManualBarcode(){

function loadZXingLib(){
  if(window.ZXingBrowser) return Promise.resolve();
  if(_zxingLoadPromise) return _zxingLoadPromise;
  _zxingLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/browser@0.1.5';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _zxingLoadPromise=null; reject(new Error('No se pudo cargar el lector de respaldo')); };
    document.head.appendChild(s);
  });
  return _zxingLoadPromise;
}
function setBarcodeStatus(msg){
  const status = document.getElementById('barcode-scan-status');
  if(status) status.textContent = msg;
}
// Diagnóstico temporal: vamos por la tercera vuelta tratando de resolver
// la pantalla negra en iPhone a ciegas (sin poder probar en el dispositivo
// acá), así que en vez de adivinar de nuevo, esto deja un rastro de texto
// visible en el propio modal (motor usado, si getUserMedia respondió, qué
// tamaño de frame llegó) para diagnosticar con datos reales la próxima vez.
// Sacar esto una vez que el escaneo funcione andando bien.
function appendBarcodeDebug(msg){
  const el = document.getElementById('barcode-debug');
  if(el) el.textContent += (el.textContent?' | ':'') + msg;
}
function startBarcodeCamera(){
  const video = document.getElementById('barcode-video');
  if(video){
    video.addEventListener('loadedmetadata', ()=>{
      video.play().catch(e=>appendBarcodeDebug('play() rechazado: '+e.message));
      appendBarcodeDebug('frame '+video.videoWidth+'x'+video.videoHeight);
    });
    video.addEventListener('error', ()=>appendBarcodeDebug('<video> error'));
  }
  appendBarcodeDebug('BarcodeDetector: '+(window.BarcodeDetector?'sí':'no'));
  // Si getSupportedFormats se cuelga o tarda de más en algún navegador
  // raro, no queremos dejar al usuario mirando una pantalla negra para
  // siempre — a los 2.5s probamos directo con ZXing.
  let decided = false;
  const fallbackTimer = setTimeout(()=>{ if(!decided){ decided=true; appendBarcodeDebug('timeout formatos, uso ZXing'); startBarcodeCameraZXing(); } }, 2500);
  if(window.BarcodeDetector){
    BarcodeDetector.getSupportedFormats().then(supported=>{
      if(decided) return; decided=true; clearTimeout(fallbackTimer);
      const wanted = BARCODE_FORMATS_NATIVE.filter(f=>supported.includes(f));
      appendBarcodeDebug('formatos soportados: '+supported.join(','));
      if(wanted.length) startBarcodeCameraNative(wanted); else startBarcodeCameraZXing();
    }).catch(e=>{ if(decided) return; decided=true; clearTimeout(fallbackTimer); appendBarcodeDebug('getSupportedFormats falló: '+e.message); startBarcodeCameraZXing(); });
  } else {
    decided = true; clearTimeout(fallbackTimer);
    startBarcodeCameraZXing();
  }
}
function startBarcodeCameraNative(formats){
  appendBarcodeDebug('motor: nativo');
  const video = document.getElementById('barcode-video');
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} } }).then(stream=>{
    appendBarcodeDebug('getUserMedia ok, tracks: '+stream.getVideoTracks().length);
    _barcodeStream = stream;
    video.srcObject = stream;
    // Sin este play() explícito, en varios navegadores de celular el
    // stream queda asignado pero el video nunca arranca — se ve todo
    // negro aunque el permiso de cámara ya esté dado.
    video.play().catch(()=>{});
    try{
      const detector = new BarcodeDetector({formats});
      _barcodePollTimer = setInterval(()=>{
        if(!video || video.readyState < 2) return;
        detector.detect(video).then(codes=>{
          if(codes && codes.length) onBarcodeDetected(codes[0].rawValue);
        }).catch(()=>{});
      }, 180);
    }catch(e){
      appendBarcodeDebug('BarcodeDetector constructor falló: '+e.message);
      pauseBarcodeCamera();
      startBarcodeCameraZXing();
    }
  }).catch(err=>{ appendBarcodeDebug('getUserMedia falló: '+err.name); setBarcodeStatus('No se pudo abrir la cámara: '+(err.message||err)); });
}
function startBarcodeCameraZXing(){
  appendBarcodeDebug('motor: ZXing');
  const video = document.getElementById('barcode-video');
  loadZXingLib().then(()=>{
    appendBarcodeDebug('ZXing lib cargada');
    // El build de @zxing/browser que sirve el CDN no siempre expone
    // DecodeHintType/BarcodeFormat en el global (varía según versión) —
    // acceder a esos hints ahí rompía todo el flujo con un error de JS
    // ANTES de siquiera pedir la cámara, así que quedaba todo negro. Si
    // están disponibles los usamos (más rápido/preciso); si no, el lector
    // igual funciona probando todos los formatos que soporta.
    let hints = undefined;
    try{
      if(ZXingBrowser.DecodeHintType && ZXingBrowser.BarcodeFormat){
        const F = ZXingBrowser.BarcodeFormat;
        hints = new Map();
        hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS, [
          F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODABAR, F.ITF, F.QR_CODE,
        ]);
        appendBarcodeDebug('hints de formato aplicados');
      } else {
        appendBarcodeDebug('sin DecodeHintType/BarcodeFormat, sigo sin hints');
      }
    }catch(e){ appendBarcodeDebug('armado de hints falló: '+e.message); hints = undefined; }
    const codeReader = new ZXingBrowser.BrowserMultiFormatReader(hints);
    codeReader.decodeFromConstraints(
      { video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080} } },
      video,
      (result)=>{ if(result) onBarcodeDetected(result.getText()); }
    ).then(controls=>{ _zxingControls = controls; appendBarcodeDebug('decodeFromConstraints ok'); })
    .catch(err=>{ appendBarcodeDebug('decodeFromConstraints falló: '+(err.name||'')+' '+err.message); setBarcodeStatus('No se pudo abrir la cámara: '+(err.message||err)); });
  }).catch(err=>{ appendBarcodeDebug('carga de ZXing falló'); setBarcodeStatus(err.message); });
}
function pauseBarcodeCamera(){
  if(_barcodePollTimer){ clearInterval(_barcodePollTimer); _barcodePollTimer=null; }
  if(_zxingControls){ try{ _zxingControls.stop(); }catch(e){} _zxingControls=null; }
  if(_barcodeStream){ _barcodeStream.getTracks().forEach(t=>t.stop()); _barcodeStream=null; }
  const video = document.getElementById('barcode-video');
  if(video) video.srcObject = null;
}
function closeBarcodeScannerModal(){
  pauseBarcodeCamera();
  const el = document.getElementById("barcode-scanner-overlay");
  if(el) el.remove();
}
function showBarcodeAssignPanel(code){

        <span style="font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(p.name)}</span>
        ${p.barcode?`<span style="font-size:10px; color:rgba(255,255,255,0.4); flex-shrink:0;">ya tiene código</span>`:''}
      </div>`).join('') || `<div style="text-align:center; padding:14px; color:rgba(255,255,255,0.4); font-size:12.5px;">Sin resultados.</div>`}

  const panel = document.getElementById('barcode-scan-panel');

function updateProductBarcode(id, code, skipConfirm){
  const p = state.products.find(pr=>pr.id===id);
  if(!p) return;
  const dup = state.products.find(pr=>pr.barcode===code && pr.id!==id);
  if(dup && !skipConfirm && !confirm(`Ese código ya está asignado a "${dup.name}". ¿Reasignarlo a "${p.name}"?`)) return;
  p.barcode = code;
  saveState();
  apiSaveProduct(p);
  renderAdminProductosInPlace();
  toast('Código asignado a '+p.name, 'ok');
}

/* ---------- ADMIN: CONTEO DE STOCK ----------
   Registro de conteo físico de mercadería: se escanea cada producto
   con la cámara (reutilizando el mismo motor de arriba, en modo
   'conteo'), se carga la cantidad contada y el precio de venta, y
   queda un registro aparte — no toca products.stock ni products.price.
   Mismo patrón que Alquiler/Pagos: todo vive en un único registro de
   app_settings ('stock_count'), leído y escrito entero. Ver
   supabase-migration-stock-count.sql. */
function stockCountId(){ return 'sc'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function stockCountTotals(){
  const items = state.stockCount.items||[];
  return {
    count: items.length,
    qty: items.reduce((s,it)=>s+Number(it.qty||0),0),
    money: items.reduce((s,it)=>s+Number(it.qty||0)*Number(it.price||0),0),
  };
}
async function apiSyncStockCount(){
  try{
    const rows = await adminFetch('/app_settings?setting_key=eq.stock_count&select=setting_value', 'GET');
    const row = rows && rows[0];
    if(row){
      const parsed = JSON.parse(row.setting_value);
      state.stockCount = Object.assign({items:[]}, parsed);
    }
    stockCountLoaded = true;
    saveState();
    render();
  }catch(e){
    stockCountLoaded = true;
    toast('Error cargando conteo de stock: '+e.message, 'err');
    render();
  }
}
async function apiSaveStockCount(){
  try{
    const val = JSON.stringify(state.stockCount);
    const existing = await adminFetch('/app_settings?setting_key=eq.stock_count&select=id', 'GET');
    if(existing && existing.length>0){
      await adminFetch('/app_settings?setting_key=eq.stock_count', 'PATCH', {setting_value: val});
    }else{
      await adminFetch('/app_settings', 'POST', {setting_key:'stock_count', setting_value: val});
    }
  }catch(e){ toast('Error guardando conteo: '+e.message, 'err'); }
}

function confirmStockCountEntry(code, productId){
  const name = (document.getElementById('sc-name')?.value||'').trim();
  const qty = Number(document.getElementById('sc-qty')?.value);
  const price = Number(document.getElementById('sc-price')?.value);
  if(!name){ toast('Ingresá un nombre para el producto', 'err'); return; }
  if(!(qty>=0)){ toast('Ingresá una cantidad válida', 'err'); return; }
  if(!(price>=0)){ toast('Ingresá un precio válido', 'err'); return; }
  const items = state.stockCount.items||(state.stockCount.items=[]);
  const idx = items.findIndex(it=>it.barcode===code);
  const entry = {id: idx>=0?items[idx].id:stockCountId(), barcode:code, productId: productId||null, name, qty, price, updatedAt:new Date().toISOString()};
  if(idx>=0) items[idx] = entry; else items.push(entry);
  saveState();
  apiSaveStockCount();
  upsertBarcodeCatalog(code, name, price);
  toast('Agregado: '+name, 'ok');
  resumeStockCountScan();
}

  const qty = Number(document.getElementById('scm-qty').value);
  const price = Number(document.getElementById('scm-price').value);
  if(!name){ toast('Ingresá un nombre', 'err'); return; }
  if(!(qty>=0)){ toast('Ingresá una cantidad válida', 'err'); return; }
  if(!(price>=0)){ toast('Ingresá un precio válido', 'err'); return; }
  const items = state.stockCount.items||(state.stockCount.items=[]);
  if(itemId){
    const idx = items.findIndex(it=>it.id===itemId);
    if(idx>=0) items[idx] = Object.assign({}, items[idx], {name, barcode, qty, price, updatedAt:new Date().toISOString()});

  closeStockCountManualModal();
  saveState(); render();
  apiSaveStockCount();
  if(barcode) upsertBarcodeCatalog(barcode, name, price);
}

/* ---------- PHOTO UPLOAD + FILTERS + AI BG REMOVAL + BACKGROUNDS ---------- */
// Redimensiona y comprime la foto original (las fotos de celular pueden pesar
// 10-20MB) para que la subida no falle por el tamaño del archivo/la conexión.
function downscaleImageDataUrl(dataUrl, maxDim=1600, quality=0.85){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}
// Herramienta de una sola vez para achicar las fotos de producto ya
// subidas (antes de que las nuevas empezaran a subirse a 900px): las baja
// una por una, las recomprime, y si el resultado pesa bastante menos las
// vuelve a subir — apiSaveProduct ya sabe subir un data: URL y actualizar
// photo_url solo, así que reutiliza exactamente el mismo camino que usa
// cualquier edición manual de producto.
async function optimizeProductPhotos(){
  // También agarra productos cuya foto principal ya está liviana pero
  // todavía no tienen miniatura (photoThumb) — así el botón sirve para
  // ir completando las miniaturas de a poco sin recomprimir de nuevo lo
  // que ya está bien, y es seguro correrlo más de una vez.
  const targets = state.products.filter(p=>p.photo && p.photo.startsWith('http') && !p.photoThumb);
  if(targets.length===0){ toast('No hay fotos para optimizar', 'err'); return; }
  if(!confirm(`Esto recomprime la foto principal si hace falta y genera una miniatura liviana para ${targets.length} productos, para que catálogo/carrito/listas carguen más rápido. Puede tardar varios minutos — no cierres esta pantalla mientras corre. ¿Continuar?`)) return;
  toast(`Optimizando fotos de ${targets.length} productos...`, 'ok');
  let done=0, failed=0;
  for(const p of targets){
    try{
      const res = await fetch(p.photo);
      const blob = await res.blob();
      const dataUrl = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      const resized = await downscaleImageDataUrl(dataUrl, 900, 0.8);
      // Pasa por data: siempre (aunque la recompresión no ahorre nada) para
      // que apiSaveProduct genere la miniatura de paso al subir.
      p.photo = resized.length < dataUrl.length * 0.9 ? resized : dataUrl;
      await apiSaveProduct(p);
      done++;
    }catch(e){ console.warn('No se pudo optimizar foto de', p.name, e); failed++; }
  }
  saveState(); render();
  toast(`Fotos optimizadas: ${done} · con error: ${failed}`, 'ok');
}
function onPhotoSelected(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let dataUrl = e.target.result;
    // 900px/calidad 0.8 para fotos de producto en vez del default de 1600 —
    // se ven en tarjetas chiquitas del catálogo y en un detalle no muy
    // grande, 1600 era mucho más peso del que se aprovecha y hacía más
    // lenta la carga del catálogo en conexiones móviles.
    try{ dataUrl = await downscaleImageDataUrl(dataUrl, 900, 0.8); }
    catch(err){ console.warn("No se pudo optimizar la foto, se usa el original:", err); }
    adminPhotoDraft.original = dataUrl;
    adminPhotoDraft.current = dataUrl;
    adminPhotoDraft.filter = "none";
    adminPhotoDraft.bgRemoved = false;
    adminPhotoDraft.bgRemovedImage = "";
    adminPhotoDraft.background = "none";
    adminPhotoDraft.sinTacc = false;
    adminPhotoDraft.brightness = 100;
    adminPhotoDraft.contrast = 100;
    adminPhotoDraft.saturation = 100;
    adminPhotoDraft.rotation = 0;
    document.getElementById("photo-preview-container").innerHTML = renderPhotoPreview();
  };
  reader.readAsDataURL(file);
}

function paintBackground(ctx, key, w, h){
  if(key==="none") return;
  if(key==="white"){ ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h); return; }
  if(key==="black"){
    const g=ctx.createRadialGradient(w/2,h*0.35,0,w/2,h/2,w*0.8);
    g.addColorStop(0,"#1a1a1a"); g.addColorStop(1,"#000000");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); return;
  }
  if(key==="cream"){ ctx.fillStyle="#f8f5ec"; ctx.fillRect(0,0,w,h); return; }
  if(key==="linen"){
    ctx.fillStyle="#f2ede3"; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=0.06;
    for(let i=0;i<h;i+=3){ ctx.fillStyle=i%6===0?"#b8a98a":"#d4c9b0"; ctx.fillRect(0,i,w,1.5); }
    for(let i=0;i<w;i+=3){ ctx.fillStyle=i%6===0?"#b8a98a":"#d4c9b0"; ctx.fillRect(i,0,1.5,h); }
    ctx.globalAlpha=1; return;
  }
  if(key==="slate"){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#2c3440"); g.addColorStop(1,"#1a2030");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); return;
  }
  if(key==="lightgray"){ ctx.fillStyle="#e9e9ec"; ctx.fillRect(0,0,w,h); return; }
  if(key==="green-dark"){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#1a3d2b"); g.addColorStop(1,"#0d2218");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); return;
  }
  if(key==="bokeh"){
    const g=ctx.createRadialGradient(w*0.35,h*0.35,0,w/2,h/2,w*0.85);
    g.addColorStop(0,"#e8f4fd"); g.addColorStop(0.4,"#b8d8f5"); g.addColorStop(1,"#7ab3e0");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=0.18;
    [[w*0.2,h*0.2,w*0.14],[w*0.75,h*0.3,w*0.1],[w*0.5,h*0.7,w*0.18],[w*0.85,h*0.75,w*0.08]].forEach(([cx,cy,r])=>{
      const c=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      c.addColorStop(0,"rgba(255,255,255,0.9)"); c.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1; return;
  }
  if(key==="kraft"){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#c4945a"); g.addColorStop(1,"#a67840");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=0.08;
    for(let i=0;i<h;i+=2){ ctx.fillStyle=i%4===0?"#7a5020":"#e8b870"; ctx.fillRect(0,i,w,1); }
    ctx.globalAlpha=1; return;
  }
  if(key==="denim"){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#2d4a7a"); g.addColorStop(1,"#1a3060");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=0.07;
    for(let i=-h;i<w+h;i+=6){
      ctx.strokeStyle="#6a90c8"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+h,h); ctx.stroke();
    }
    ctx.globalAlpha=1; return;
  }
  if(key==="navy"){
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#1a2a5e"); g.addColorStop(1,"#0f1c45");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); return;
  }
  if(key==="gold"){
    const g = ctx.createRadialGradient(w/2,h*0.35,10,w/2,h/2,w*0.7);
    g.addColorStop(0,"#f3d98a"); g.addColorStop(0.6,"#e0bb4a"); g.addColorStop(1,"#c5a028");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); return;
  }
  if(key==="studio"){
    const g = ctx.createRadialGradient(w/2,h*0.4,10,w/2,h/2,w*0.75);
    g.addColorStop(0,"#ffffff"); g.addColorStop(1,"#d7d7da");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h); return;
  }
  if(key==="wood"){
    ctx.fillStyle="#8a5a35"; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=0.18;
    for(let i=0;i<14;i++){
      ctx.strokeStyle = i%2===0 ? "#6b4322" : "#a8703f";
      ctx.lineWidth = h/22;
      ctx.beginPath();
      const y = (i/14)*h + (Math.sin(i)*6);
      ctx.moveTo(0,y); ctx.bezierCurveTo(w*0.3,y+10,w*0.7,y-10,w,y);
      ctx.stroke();
    }
    ctx.globalAlpha=1; return;
  }
  if(key==="marble"){
    ctx.fillStyle="#f0eee9"; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle="rgba(170,170,165,0.35)";
    for(let i=0;i<9;i++){
      ctx.lineWidth = Math.random()*2+0.5;
      ctx.beginPath();
      const startX = Math.random()*w, startY = Math.random()*h;
      ctx.moveTo(startX,startY);
      ctx.bezierCurveTo(startX+Math.random()*120-60, startY+Math.random()*120-60, startX+Math.random()*200-100, startY+Math.random()*200-100, startX+Math.random()*260-130, startY+Math.random()*260-130);
      ctx.stroke();
    }
    return;
  }
}

function renderPhotoPreview(){
  const d = adminPhotoDraft;
  const filterCss = PHOTO_FILTERS.find(f=>f.key===d.filter)?.css || '';

/* Renders the small background-swatch thumbnails inside the modal using the
   same paintBackground() routine, so the preview always matches the real result. */
function renderBackgroundThumbnails(){
  PHOTO_BACKGROUNDS.forEach(bg=>{
    const canvas = document.querySelector(`canvas[data-bg-thumb="${bg.key}"]`);
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    paintBackground(ctx, bg.key, canvas.width, canvas.height);
  });
}

function paintSinTaccSeal(ctx, w, h, callback){
  const s    = Math.min(w, h);
  const ox   = (w - s) / 2;
  const oy   = (h - s) / 2;
  const size = s * 0.32;
  const pad  = s * 0.02;
  const x = ox + s - size - pad;
  const y = oy + s - size - pad;
  const sealImg = new Image();
  sealImg.onload = ()=>{
    ctx.save();
    ctx.globalAlpha = 0.82;
    ctx.drawImage(sealImg, x, y, size, size);
    ctx.restore();
    callback();
  };
  sealImg.onerror = callback;
  sealImg.src = '/sin-tacc-seal.png';
}

/* Recomposes the final image from: removed-bg source (or original) -> filter -> background -> seal.
   This is the single source of truth for what gets saved as the product photo. */
function recomposePhotoDraft(){
  const d = adminPhotoDraft;
  const baseSrc = d.bgRemoved ? d.bgRemovedImage : d.original;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = ()=>{
    const rot = (d.rotation||0) % 360;
    const swap = rot===90 || rot===270;
    const w = swap ? img.height : img.width;
    const h = swap ? img.width : img.height;
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    if(d.bgRemoved){ paintBackground(ctx, d.background, w, h); }
    const adjCss = `brightness(${d.brightness||100}%) contrast(${d.contrast||100}%) saturate(${d.saturation||100}%)`;
    const filterStr = [PHOTO_FILTERS.find(f=>f.key===d.filter)?.css||'', adjCss].filter(Boolean).join(' ');
    ctx.filter = filterStr || "none";
    if(rot){
      ctx.translate(w/2, h/2);
      ctx.rotate(rot * Math.PI/180);
      ctx.drawImage(img, -img.width/2, -img.height/2);
    } else {
      ctx.drawImage(img, 0, 0);
    }
    ctx.filter = "none";
    const needsAlpha = d.bgRemoved && (d.background||"none")==="none";
    // Snapshot ANTES de estampar el sello: es la versión "limpia" que se
    // guarda aparte (product.photoClean), para poder sacar el sello más
    // adelante sin perder el resto de la edición (fondo/filtros/rotación),
    // incluso después de haber guardado el producto con el sello puesto.
    d.currentClean = needsAlpha ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.85);
    const finalize = ()=>{
      d.current = needsAlpha ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.85);
      const container = document.getElementById("photo-preview-container");
      if(container){
        container.innerHTML = renderPhotoPreview();
        if(d.bgRemoved) renderBackgroundThumbnails();
      }
    };
    if(d.sinTacc){ paintSinTaccSeal(ctx, w, h, finalize); }
    else { finalize(); }
  };
  img.src = baseSrc;
}
function applyPhotoFilter(key){
  adminPhotoDraft.filter = key;
  recomposePhotoDraft();
}
function applyPhotoBackground(key){
  adminPhotoDraft.background = key;
  recomposePhotoDraft();
}
function rotatePhoto(deg){
  adminPhotoDraft.rotation = ((adminPhotoDraft.rotation||0) + deg + 360) % 360;
  const img = document.getElementById("photo-preview-img");
  if(img) img.style.transform = adminPhotoDraft.rotation ? `rotate(${adminPhotoDraft.rotation}deg)` : '';
}
function adjPhoto(prop, val){
  adminPhotoDraft[prop] = Number(val);
  const lblMap = {brightness:'lbl-br', contrast:'lbl-ct', saturation:'lbl-sat'};
  const lbl = document.getElementById(lblMap[prop]);
  if(lbl) lbl.textContent = val+'%';
  const img = document.getElementById("photo-preview-img");
  if(img){
    const d = adminPhotoDraft;
    const filterCss = PHOTO_FILTERS.find(f=>f.key===d.filter)?.css||'';
    img.style.filter = [filterCss, `brightness(${d.brightness}%) contrast(${d.contrast}%) saturate(${d.saturation}%)`].filter(Boolean).join(' ');
  }
}
function togglePhotoSinTacc(){
  adminPhotoDraft.sinTacc = !adminPhotoDraft.sinTacc;
  recomposePhotoDraft();
}
async function removePhotoBackgroundAI(){
  if(!adminPhotoDraft.current){ toast("Subí una foto primero", "err"); return; }
  if(adminPhotoDraft.bgRemoved){ toast("El fondo ya fue quitado", "ok"); return; }
  aiProcessing = true;
  const btn = document.getElementById("btn-ai-remove");
  if(btn){ btn.innerHTML = `<span class="spin">${ic('sparkle')}</span> Procesando...`; btn.disabled = true; }
  try{
    const { removeBackground } = await import("https://esm.sh/@imgly/background-removal@1.5.7");
    const blob = await fetch(adminPhotoDraft.original).then(r=>r.blob());
    const resultBlob = await removeBackground(blob);
    const reader = new FileReader();
    reader.onload = (e)=>{
      adminPhotoDraft.bgRemoved = true;
      adminPhotoDraft.bgRemovedImage = e.target.result;
      adminPhotoDraft.background = "none";
      adminPhotoDraft.sinTacc = false;
      aiProcessing = false;
      recomposePhotoDraft();
      toast("Fondo eliminado — elegí un fondo nuevo si querés", "ok");
    };
    reader.readAsDataURL(resultBlob);
  }catch(err){
    aiProcessing = false;
    const container = document.getElementById("photo-preview-container");
    if(container) container.innerHTML = renderPhotoPreview();
    toast("No se pudo quitar el fondo. Probá con otra foto.", "err");
    console.error(err);
  }
}

// existe por producto individual) a todos los productos de una categoría
// o, si se pasa sub, solo de esa subcategoría. Cada producto se guarda
// como si se hubiera editado uno por uno (mismo apiSaveProduct de siempre).
function productsInCategoryGroup(section, cat, sub){
  return state.products.filter(p=>p.section===section && p.cat===cat && (sub==null || p.sub===sub));
}

  document.body.appendChild(overlay);
}
function renderCategoryPromoModal(section, cat, sub){
  const count = productsInCategoryGroup(section, cat, sub).length;

  const today = new Date().toISOString().slice(0,10);
  return `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 class="modal-title">Oferta por tiempo limitado</h3>
      <p style="padding:0 16px 14px; font-size:13px; color:rgba(255,255,255,0.6);">${label} · ${count} producto${count===1?'':'s'}. Se va a mostrar en el catálogo con precio tachado, igual que una oferta individual.</p>

    </div>
  `;
}
function closeCategoryPromoModal(){
  const el = document.getElementById("category-promo-overlay");
  if(el) el.remove();
}
function applyCategoryPromo(section, cat, sub){
  const pct = Number(document.getElementById("catpromo-pct").value);
  const until = document.getElementById("catpromo-until").value;
  if(!pct || pct<=0 || pct>=100){ toast("Ingresá un descuento válido (1-99%)", "err"); return; }
  if(!until){ toast("Elegí hasta cuándo dura la oferta", "err"); return; }
  const products = productsInCategoryGroup(section, cat, sub);
  products.forEach(p=>{
    const base = p.sellByWeight ? p.pricePerKg : p.price;
    p.promoPrice = Math.round(base * (1 - pct/100));
    p.promoUntil = until;
    apiSaveProduct(p);
  });

  closeCategoryPromoModal();
  render();
  toast(`Oferta del ${pct}% aplicada a ${products.length} producto${products.length===1?'':'s'}`, "ok");

function clearCategoryPromo(section, cat, sub){
  const products = productsInCategoryGroup(section, cat, sub);
  if(!confirm(`¿Quitar la oferta de los ${products.length} productos de este grupo?`)) return;
  products.forEach(p=>{
    p.promoPrice = null;
    p.promoUntil = null;
    apiSaveProduct(p);
  });
  saveState();
  closeCategoryPromoModal();
  render();
  toast(`Oferta quitada de ${products.length} producto${products.length===1?'':'s'}`, "ok");
}

function renderCategoryWholesaleModal(section, cat, sub){

        <p style="font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:10px;">⚠️ Esto SUMA (o resta) al % que ya tenga cada producto, no lo reemplaza — usalo solo si parten de porcentajes distintos entre sí. Para poner el mismo % a todos, usá "Fijar" arriba.</p>
        <div class="form-group"><label>Puntos porcentuales a sumar (negativo para bajar el descuento)</label><input id="catws-delta" type="number" step="1" placeholder="Ej: 5, o -5"></div>
        <button class="btn-secondary" style="width:100%;" onclick="applyCategoryWholesaleAdjust('${section}','${cat}',${sub?`'${sub}'`:'null'})">Sumar/restar en ${withWholesale.length}</button>
      </div>
      ${withoutWholesale.length>0 ? `
      <div style="border-top:1px solid var(--glass-bd); padding-top:14px;">

        <div class="form-group"><label>% de descuento a crear para los ${withoutWholesale.length} que no tienen</label><input id="catws-create-pct" type="number" min="1" max="99" step="1" placeholder="Ej: 15"></div>
        <button class="btn-primary" style="width:100%;" onclick="applyCategoryWholesaleCreate('${section}','${cat}',${sub?`'${sub}'`:'null'})">Crear en ${withoutWholesale.length}</button>

// Fija el % de descuento mayorista tal cual (reemplaza el valor de cada
// producto del grupo, no lo suma al que ya tenía).
function applyCategoryWholesaleSet(section, cat, sub){
  const raw = document.getElementById("catws-set-pct").value;
  const pct = Number(raw);
  if(raw.trim()==="" || isNaN(pct) || pct<=0 || pct>=100){ toast("Ingresá un % entre 1 y 99", "err"); return; }
  const group = productsInCategoryGroup(section, cat, sub).filter(p => p.sellByWeight ? !!p.wholesalePricePerKg : !!p.wholesalePrice);
  group.forEach(p=>{
    if(p.sellByWeight){ p.wholesalePricePerKg = Math.round(p.pricePerKg * (1 - pct/100)); }
    else{ p.wholesalePrice = Math.round(p.price * (1 - pct/100)); }
    apiSaveProduct(p);
  });
  if(group.length===0){ toast("Ningún producto de este grupo tiene precio mayorista cargado todavía", "err"); return; }
  saveState();
  closeCategoryWholesaleModal();
  render();
  toast(`Descuento mayorista fijado en ${pct}% para ${group.length} producto${group.length===1?'':'s'}`, "ok");
}
function applyCategoryWholesaleAdjust(section, cat, sub){
  const raw = document.getElementById("catws-delta").value;
  const delta = Number(raw);
  if(raw.trim()==="" || isNaN(delta) || delta===0){ toast("Ingresá cuántos puntos porcentuales sumar (o restar con -)", "err"); return; }
  const group = productsInCategoryGroup(section, cat, sub);
  let count = 0;
  group.forEach(p=>{
    if(p.sellByWeight){
      if(!p.wholesalePricePerKg || !(p.pricePerKg>0)) return;
      const currentPct = (1 - p.wholesalePricePerKg/p.pricePerKg) * 100;
      const newPct = Math.min(99, Math.max(1, Math.round(currentPct + delta)));
      p.wholesalePricePerKg = Math.round(p.pricePerKg * (1 - newPct/100));
    }else{
      if(!p.wholesalePrice || !(p.price>0)) return;
      const currentPct = (1 - p.wholesalePrice/p.price) * 100;
      const newPct = Math.min(99, Math.max(1, Math.round(currentPct + delta)));

/* ---------- ADMIN: CLIENTES ---------- */
/* ---------- CLIENTES DUPLICADOS ----------
   normalizePhone() antes no agregaba el "9" que necesitan los celulares
   argentinos en formato internacional (ver supabase-migration-merge-
   phone-duplicates.sql) — según cómo se haya tipeado el número las
   distintas veces, el mismo cliente real podía terminar como dos filas
   separadas (una con el 9, otra sin él, o con otras variantes de
   formato). Acá los detectamos comparando los últimos 10 dígitos del
   teléfono (el número real, sin importar 54/9/0/15 adelante) y los
   fusionamos en uno solo con el formato correcto. */
function findDuplicateClientGroups(){
  const groups = {};
  Object.values(state.clients).forEach(c=>{
    const digits = (c.phone||'').replace(/\D/g,'');
    const core = digits.slice(-10);
    if(!core || core.length<8) return;
    (groups[core] = groups[core]||[]).push(c);
  });
  return Object.values(groups).filter(g=>g.length>1);
}
function pickCanonicalClient(group){
  const proper = group.find(c=>/^\+549\d{10}$/.test(c.phone));
  return proper || group.slice().sort((a,b)=>(b.points||0)-(a.points||0))[0];
}
async function mergeDuplicateClients(){
  const groups = findDuplicateClientGroups();
  if(groups.length===0){ toast('No encontré clientes duplicados', 'ok'); return; }
  const totalDupes = groups.reduce((s,g)=>s+g.length-1, 0);
  if(!confirm(`Encontré ${groups.length} cliente${groups.length!==1?'s':''} con filas duplicadas (${totalDupes} de más). Se van a fusionar en una sola por cliente — sumando puntos y completando nombre/dirección/email/mayorista/descuento desde todas las filas. ¿Continuar?`)) return;
  let merged = 0;
  for(const group of groups){
    const canon = pickCanonicalClient(group);
    const canonPhone = /^\+549\d{10}$/.test(canon.phone) ? canon.phone : normalizePhone(canon.phone);
    const others = group.filter(c=>c!==canon);
    let points = canon.points||0, name = canon.name, address = canon.address, email = canon.email,
      doc = canon.doc, city = canon.city, province = canon.province,
      wholesale = !!canon.wholesale, discountPct = canon.discountPct;
    others.forEach(o=>{
      points += (o.points||0);
      name = name || o.name; address = address || o.address; email = email || o.email;
      doc = doc || o.doc; city = city || o.city; province = province || o.province;
      wholesale = wholesale || !!o.wholesale;
      discountPct = discountPct || o.discountPct;
    });
    // Si el elegido como canónico tampoco tenía el formato +549 bien puesto
    // (el caso más común: TODAS las filas del grupo vienen del mismo bug de
    // formato, así que ninguna pasa el regex de pickCanonicalClient), su
    // fila vieja en Supabase también hay que borrarla — si no, queda
    // huérfana con el teléfono mal formateado y el PATCH de abajo apunta a
    // una fila con el teléfono nuevo que todavía no existe, así que no
    // actualiza nada (esto era lo que hacía que "fusionar" no sirviera).
    const canonNeedsRename = canonPhone !== canon.phone;
    const rowsToDelete = canonNeedsRename ? [...others, canon] : others;
    delete state.clients[canon.phone];
    others.forEach(o=>delete state.clients[o.phone]);
    state.clients[canonPhone] = {phone:canonPhone, name:name||'', address:address||'', email:email||'', doc:doc||'', city:city||'', province:province||'', points, orders:[], wholesale, discountPct};
    if(state.currentClientPhone && group.some(c=>c.phone===state.currentClientPhone)) state.currentClientPhone = canonPhone;
    for(const o of rowsToDelete){
      try{ await adminFetch('/clients?phone=eq.'+encodeURIComponent(o.phone), 'DELETE'); }
      catch(e){ console.warn('Error borrando duplicado', o.phone, e); }
    }
    try{
      if(canonNeedsRename){
        await adminFetch('/clients', 'POST', {phone:canonPhone, full_name:name||'Cliente', address:address||null, email:email||null});
      }else{
        await adminFetch('/clients?phone=eq.'+encodeURIComponent(canonPhone), 'PATCH', {full_name:name||'', address:address||null, email:email||null});
      }
    }
    catch(e){ console.warn('Error actualizando cliente fusionado', canonPhone, e); }
    try{ await adminFetch('/rpc/set_client_points', 'POST', {p_phone: canonPhone, p_points: points}); }
    catch(e){ console.warn('Error actualizando puntos fusionados', e); }
    merged++;
  }
  saveState(); render();
  try{ await apiSaveWholesaleClients(); }catch(e){}
  try{ await apiSaveClientDiscounts(); }catch(e){}
  toast(`${merged} cliente${merged!==1?'s':''} fusionado${merged!==1?'s':''}`, 'ok');
}
