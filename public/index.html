// Normaliza para comparar sin importar tildes (así "fiambreria" encuentra
// "Fiambrería") ni mayúsculas.
function normText(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
// Un producto matchea si el texto buscado aparece en su nombre, categoría,
// subcategoría o el nombre de su sección — así buscar "combo" encuentra los
// productos de la categoría "Combos Ofertas" aunque el nombre del producto
// no diga "combo", y buscar "fiambre"/"fiambrería" encuentra todo lo de la
// sección Fiambrería, no solo productos que tengan esa palabra en el nombre.
function productMatchesSearch(p, qNorm){
  if(!qNorm) return true;
  if(normText(p.name).includes(qNorm)) return true;
  if(normText(p.cat).includes(qNorm)) return true;
  if(normText(p.sub).includes(qNorm)) return true;
  const secLabel = (SECTION_META[p.section]||{}).label || '';
  if(normText(secLabel).includes(qNorm)) return true;
  return false;
}
function renderCatalogResults(section){
  const q = (state.route.q||"").toLowerCase();
  const activeCat = state.route.cat || null;
  const sinTaccOnly = !!state.route.sinTaccOnly;
  const sinAzucarOnly = !!state.route.sinAzucarOnly;
  const cats = Object.keys(state.categories[section]||{}).sort((a,b)=>a.localeCompare(b,'es'));
  // La tarjeta "Sin Azúcar" muestra todo producto marcado sin azúcar, esté
  // filado en la sección "sinazucar" o en cualquier otra (natural, market, etc).
  const baseProducts = section==="sinazucar"
    ? state.products.filter(p=>!p.hidden && (p.sinAzucar || p.section===section))
    : state.products.filter(p=>!p.hidden && p.section===section);
  // Al buscar, no limitar a la sección actual: si escribís "fantoche" desde
  // Market tiene que aparecer aunque el producto esté cargado en Golosinas,
  // si no parece que el buscador no encuentra nada.
  let products = q ? state.products.filter(p=>!p.hidden) : baseProducts;
  if(activeCat) products = products.filter(p=>p.cat===activeCat);
  if(sinTaccOnly) products = products.filter(p=>p.sinTacc);
  if(sinAzucarOnly) products = products.filter(p=>p.sinAzucar);
  if(q) products = products.filter(p=>productMatchesSearch(p, normText(q)));
  const hasSinTacc = baseProducts.some(p=>p.sinTacc);
  const hasSinAzucar = baseProducts.some(p=>p.sinAzucar);
  return `
    <div class="chip-row">
      <button class="chip ${!activeCat && !sinTaccOnly && !sinAzucarOnly?'active':''}" onclick="setCatalogCat(null)">Todas</button>
      ${cats.map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="setCatalogCat('${c}')">${c}</button>`).join('')}
      ${hasSinTacc ? `<button class="chip ${sinTaccOnly?'active':''}" onclick="toggleSinTaccFilter()" style="${sinTaccOnly?'':'background:rgba(46,125,79,0.15); border-color:rgba(46,125,79,0.5); color:#6fcf97;'}">🌾 Sin TACC</button>` : ''}
      ${hasSinAzucar ? `<button class="chip ${sinAzucarOnly?'active':''}" onclick="toggleSinAzucarFilter()" style="${sinAzucarOnly?'':'background:rgba(180,140,0,0.15); border-color:rgba(180,140,0,0.5); color:#f0c040;'}">🚫🍬 Sin Azúcar</button>` : ''}
    </div>
    ${renderCatalogRibbonHTML(section)}
    ${products.length===0 ? `
      <div class="empty-state">${ic('box')}<p>No encontramos productos${q?` para "${q}"`:''}.</p></div>
    ` : `
      <div class="product-grid">
        ${products.map(p=>`
          <div class="product-card" onclick="openProduct('${p.id}')">
            <div class="pc-img">
              ${pcImgBadgeHtml(p)}
              ${p.photo ? `<img src="${p.photoThumb||p.photo}" alt="" loading="lazy">` : ic('box')}
            </div>
            <div class="pc-body">${pcCardBodyHtml(p)}</div>
          </div>
        `).join('')}
      </div>
    `}
  `;
}
function onSearchInput(val){

/* Returns the effective price-per-kg for a weight-sold product, applying
   wholesale pricing and ofertas the same way effectivePrice() does for unit
   products (prioridad: mayorista > promo > precio normal). */
function effectivePriceForWeight(product){
  if(!product) return 0;
  const client = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  const isWholesaleClient = !!(client && client.wholesale);
  if(isWholesaleClient){
    return product.wholesalePricePerKg || product.pricePerKg;
  }
  const promo = activePromo(product);
  return promo !== null ? promo : product.pricePerKg;
}

function clientDiscountPct(){
  if(IS_ADMIN_APP) return 0;
  const c = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  if(!c) return 0;
  return c.discountPct ? Number(c.discountPct) : 0;
}
function applyClientDiscount(price){
  const pct = clientDiscountPct();
  return pct > 0 ? Math.round(price * (1 - pct/100)) : price;
}
function discBadge(pct, sm=false){
  if(!pct) return '';
  return `<span style="background:#e74c3c;color:#fff;border-radius:5px;padding:${sm?'2px 6px':'2px 6px'};font-size:${sm?'10px':'10px'};font-weight:800;margin-left:4px;vertical-align:middle;">-${pct}%</span>`;
}
// Badge de oferta (promoPrice), separado de discBadge (descuento personal del
// cliente) para que se note más: gradiente cálido + 🔥, en vez del rojo plano.
function promoBadge(pct, sm=false){
  if(!pct) return '';
  return `<span style="background:linear-gradient(135deg,#ffe066,#ffd400);color:#c62222;border-radius:6px;padding:${sm?'3px 8px':'3px 9px'};font-size:${sm?'11px':'11px'};font-weight:800;margin-left:4px;vertical-align:middle;box-shadow:0 1px 5px rgba(255,212,0,0.5);">🔥 -${pct}%</span>`;
}
function pcPriceHtml(p){
  const client = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  const isWholesaleClient = !!(client && client.wholesale);
  const isWholesale = isWholesaleClient && !!p.wholesalePrice;
  const promo = isWholesaleClient ? null : activePromo(p);
  const base = isWholesale ? p.wholesalePrice : (promo !== null ? promo : p.price);
  const pct = clientDiscountPct();
  const final = pct > 0 ? Math.round(base*(1-pct/100)) : base;
  const mayoristaTag = isWholesale ? '<span style="font-size:9px;color:#6db8e8;font-weight:700;margin-left:5px;">MAYORISTA</span>' : '';
  if(pct > 0){
    const badgePct = pct;
    return `<span style="text-decoration:line-through;opacity:.4;font-size:11px;font-weight:500;display:block;">${money(base)}</span>${money(final)}${discBadge(badgePct,true)}${mayoristaTag}`;
  }
  if(isWholesale) return money(base)+mayoristaTag;
  if(promo !== null){
    const badgePct = Math.round((1-promo/p.price)*100);
    return `<span style="text-decoration:line-through;opacity:.45;font-size:11px;font-weight:500;display:block;">${money(p.price)}</span><span style="color:#c62222;">${money(promo)}</span>${promoBadge(badgePct,true)}`;
  }
  return money(p.price);
}
// Productos pesables no llevan un "sin stock" basado en unidades (mismo
// criterio que isLowStock, que ya los excluye del aviso de stock bajo).
function isOutOfStock(p){ return !p.sellByWeight && p.stock<=0; }

  if(promo !== null){

    const pct = Math.round((1-promo/basePrice)*100);
    html += `<span class="pc-promo-badge">🔥 -${pct}%</span>`;

  return html;
}

    <div>
      ${state.cart.map(item=>{
        const p = state.products.find(pr=>pr.id===item.id);

        if(item.grams){
          const min = p.minGrams|| 50;

// quiere mirar el catálogo), así que hasta que lo tipea acá state.
// currentClientPhone puede seguir en null aunque el cliente sea mayorista
// o tenga descuento especial — todo lo que vio hasta este punto (catálogo,
// carrito) le mostró precio de lista sin que hubiera forma de saber que
// era mayorista. Por eso el resumen de esta pantalla se recalcula en vivo
// apenas escribe el teléfono (onCheckoutPhoneInput), resolviendo la
// identidad ANTES de mostrar el total — así lo que ve acá es exactamente
// lo mismo que se termina cobrando y mandando por WhatsApp, en vez de
// mostrar un total y cobrar otro.
function renderCheckoutSummaryHtml(){
  const base = cartTotal();
  const specialPct = clientDiscountPct();
  const client = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  const maxRedeemable = maxRedeemablePoints(client ? client.points : 0);
  if(state.checkoutPointsRedeemed > maxRedeemable) state.checkoutPointsRedeemed = maxRedeemable;
  const redeemed = state.checkoutPointsRedeemed || 0;
  const redeemPct = pointsRedeemPct(redeemed);
  const discPct = specialPct + redeemPct;
  const discAmount = discPct > 0 ? Math.round(base * discPct / 100) : 0;
  const finalTotal = base - discAmount;
  const isWholesale = !!(client && client.wholesale);
  return `
    ${isWholesale ? `<div class="summary-row" style="color:#6db8e8;"><span>👑 Precio mayorista aplicado</span><span></span></div>` : ''}
    ${maxRedeemable >= POINTS_REDEEM_BLOCK ? `
      <div class="summary-row" style="align-items:center;">
        <span>👑 Canjear puntos (tenés ${client.points})</span>
        <div style="display:flex; align-items:center; gap:10px;">
          <button onclick="adjustCheckoutPoints(-${POINTS_REDEEM_BLOCK})" ${redeemed<=0?'disabled':''} style="width:26px; height:26px; border-radius:50%; border:1px solid var(--glass-bd); background:var(--glass); color:var(--cream); font-size:16px; line-height:1;">−</button>
          <span style="min-width:40px; text-align:center;">${redeemed}</span>
          <button onclick="adjustCheckoutPoints(${POINTS_REDEEM_BLOCK})" ${redeemed>=maxRedeemable?'disabled':''} style="width:26px; height:26px; border-radius:50%; border:1px solid var(--glass-bd); background:var(--glass); color:var(--cream); font-size:16px; line-height:1;">+</button>
        </div>
      </div>
    ` : ''}
    ${discPct > 0 ? `
      <div class="summary-row"><span>Subtotal</span><span>${money(base)}</span></div>
      ${specialPct > 0 ? `<div class="summary-row" style="color:var(--ok);"><span>Descuento especial (${specialPct}%)</span><span>-${money(Math.round(base*specialPct/100))}</span></div>` : ''}
      ${redeemPct > 0 ? `<div class="summary-row" style="color:var(--ok);"><span>Canje de puntos (${redeemPct}%)</span><span>-${money(Math.round(base*redeemPct/100))}</span></div>` : ''}
    ` : ''}
    <div class="summary-row total"><span>Total a pagar</span><span>${money(finalTotal)}</span></div>
  `;
}
// Resuelve el teléfono tipeado contra los clientes ya conocidos SOLO para
// que el precio mostrado sea el correcto — no guarda nada ni registra al
// cliente todavía (eso sigue pasando recién al confirmar en submitOrder).
function onCheckoutPhoneInput(){
  const rawPhone = (document.getElementById("ck-phone")||{}).value || '';
  const phone = rawPhone.trim() ? normalizePhone(rawPhone) : null;
  const resolved = (phone && state.clients[phone]) ? phone : null;
  if(resolved !== state.currentClientPhone) state.checkoutPointsRedeemed = 0;
  state.currentClientPhone = resolved;
  const summaryEl = document.getElementById("ck-summary");
  if(summaryEl) summaryEl.innerHTML = renderCheckoutSummaryHtml();
}
function adjustCheckoutPoints(delta){
  const client = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  const maxRedeemable = maxRedeemablePoints(client ? client.points : 0);
  state.checkoutPointsRedeemed = Math.min(maxRedeemable, Math.max(0, (state.checkoutPointsRedeemed||0) + delta));
  const summaryEl = document.getElementById("ck-summary");
  if(summaryEl) summaryEl.innerHTML = renderCheckoutSummaryHtml();
}
function renderCheckout(){
  const saved = state.currentClientPhone ? state.clients[state.currentClientPhone] : null;
  const savedPhoneDigits = saved ? saved.phone.replace(/^\+?549?/,'') : '';
  return `
  <div class="screen">
    <div class="topbar"><button class="back" onclick="nav('cart')">${ic('chevron')}</button><h2>Tus datos</h2></div>
    <div class="form-group"><label>Nombre completo</label><input id="ck-name" value="${saved?saved.name:''}" placeholder="Tu nombre"></div>
    <div class="form-group"><label>Teléfono</label><div style="display:flex; gap:8px;">
      <div style="padding:13px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-bd); color:var(--cream); font-weight:700;">+549</div>
      <input id="ck-phone" value="${savedPhoneDigits}" placeholder="11 1234 5678" style="flex:1;" oninput="onCheckoutPhoneInput()">
    </div></div>
    <div class="form-group"><label>Dirección de entrega (opcional)</label><input id="ck-address" value="${saved?saved.address:''}" placeholder="Calle, número, barrio"></div>
    <div class="form-group"><label>Notas (opcional)</label><textarea id="ck-notes" placeholder="Aclaraciones sobre tu pedido"></textarea></div>
    <div class="cart-summary" id="ck-summary">${renderCheckoutSummaryHtml()}</div>
    <div style="padding:0 16px 90px;">
      <button class="btn-primary" onclick="submitOrder()">${ic('wa')} Confirmar pedido por WhatsApp</button>
    </div>
  </div>`;
}
async function submitOrder(){
  const name = document.getElementById("ck-name").value.trim();
  const rawPhone = document.getElementById("ck-phone").value.trim();
  const address = document.getElementById("ck-address").value.trim();
  const notes = document.getElementById("ck-notes").value.trim();
  if(!name || !rawPhone){ toast("Completá nombre y teléfono", "err"); return; }
  const phone = normalizePhone(rawPhone);
  state.currentClientPhone = phone;
  const clientForDiscount = state.clients[phone];
  const specialPct = clientForDiscount && clientForDiscount.discountPct ? Number(clientForDiscount.discountPct) : 0;
  // Recorta contra el saldo real del cliente por si el estado quedó desactualizado
  // (p.ej. el teléfono tipeado nunca disparó onCheckoutPhoneInput).
  const redeemedPoints = Math.min(state.checkoutPointsRedeemed||0, maxRedeemablePoints(clientForDiscount?clientForDiscount.points:0));
  const discPct = specialPct + pointsRedeemPct(redeemedPoints);
  // Reservamos la pestaña de WhatsApp ACÁ, antes de cualquier await: en
  // iOS/Safari (y varios navegadores mobile) un window.open() que se llama
  // después de una llamada de red ya no cuenta como "toque del usuario" y
  // el navegador lo bloquea en silencio, sin ningún error — el pedido se
  // guardaba bien pero WhatsApp nunca se abría. Guardando la referencia acá
  // y recién asignándole la URL más abajo evita el bloqueo.
  const waWin = window.open('', '_blank');
  try{
    const order = await placeOrder({name, phone, address}, discPct);
    // notes no viaja al servidor (create_order no tiene ese parámetro) — se
    // manda igual por WhatsApp, que es donde realmente se coordina el
    // pedido, así no se pierde lo que el cliente aclaró.
    order.notes = notes;
    if(redeemedPoints > 0){ redeemClientPoints(phone, redeemedPoints); state.checkoutPointsRedeemed = 0; }
    saveState();
    const msg = buildOrderWAMessage(order);
    openWaWindow(waWin, msg);
    nav("success", {order});
  }catch(e){
    if((e.message||'').startsWith('sin_stock')){
      if(waWin && !waWin.closed) waWin.close();
      toast('No hay stock suficiente de "'+e.message.split(':').slice(1).join(':')+'". Ajustá el carrito e intentá de nuevo.', 'err');
      return;
    }
    // Cualquier otro error (red, Supabase caído, etc.) — no es un problema
    // de stock, así que igual dejamos mandar el pedido por WhatsApp para
    // no perder la venta. Antes esto solo mostraba un toast que quedaba
    // tapado por la pestaña de WhatsApp que se abre al toque — el cliente
    // nunca se enteraba de que el pedido no había llegado al panel. Ahora
    // se bloquea con un modal que hay que cerrar a propósito, y recién
    // ahí se abre WhatsApp.
    console.warn('No se pudo guardar el pedido en el servidor, se manda igual por WhatsApp:', e);
    const order = placeOrderLocalFallback({name, phone, address}, discPct);
    order.notes = notes;
    if(redeemedPoints > 0){ redeemClientPoints(phone, redeemedPoints); state.checkoutPointsRedeemed = 0; }
    await confirmOrderNotSaved(e);
    const msg = buildOrderWAMessage(order, true);
    openWaWindow(waWin, msg);
    nav("success", {order});
  }
}
// Asigna la URL de WhatsApp a una pestaña ya abierta (ver comentario en
// submitOrder). Si por lo que sea no se pudo reservar antes (bloqueador de
// pop-ups estricto), como último recurso intenta abrirla ahora.
function openWaWindow(win, msg){
  const link = waLink(msg);
  if(win && !win.closed){ win.location.href = link; }
  else{ window.open(link, "_blank"); }
}
// Modal bloqueante (hay que tocar el botón para cerrarlo) que avisa que el
// pedido no se pudo guardar en el servidor y solo quedó en este celular —
// se usa antes de abrir WhatsApp para que el cliente no se lo pierda.
// Muestra el mensaje de error técnico (además del aviso en criollo) para
// poder diagnosticar con solo pedir una captura de pantalla.
function confirmOrderNotSaved(err){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "order-fail-overlay";
    const errText = escapeHtml((err && (err.message||String(err))) || 'sin detalle');
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h3 class="modal-title" style="color:var(--danger);">⚠️ Tu pedido no se guardó solo</h3>
        <p style="padding:0 16px 14px; font-size:14px; line-height:1.5;">Hubo un problema de conexión y el pedido <b>no llegó al sistema de la tienda</b>. Lo vas a mandar igual por WhatsApp a continuación — <b>esperá que te confirmen por ese medio</b> antes de darlo por hecho.</p>
        <p style="margin:0 16px 14px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,0.06); font-family:monospace; font-size:11px; line-height:1.4; word-break:break-word; color:rgba(255,255,255,0.6);">${errText}</p>
        <div style="padding:0 16px 16px;">
          <button class="btn-primary" style="width:100%;" id="order-fail-ack">Entendido, mandar por WhatsApp</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("order-fail-ack").onclick = ()=>{ overlay.remove(); resolve(); };
  });
}

/* ---------- ORDERS LOOKUP (CLIENT) ---------- */
// Los pedidos de un cliente ya no viven en el blob local — se piden al
// servidor (RPC get_my_orders) por teléfono cada vez que se entra a esta
// pantalla, así funciona también desde un dispositivo nuevo.
async function fetchMyOrders(phone){
  state.lookupOrdersLoading = true;
  render();
  try{
    const rows = await rpcFetch('get_my_orders', {p_phone: phone});
    // Si mientras esperábamos la respuesta el usuario ya buscó otro
    // teléfono, esta respuesta quedó vieja — no pisamos el resultado actual.
    if(state._lookupOrdersFor !== phone) return;
    state.lookupOrdersResult = (rows||[]).map(mapOrderRow);
  }catch(e){
    console.warn('lookupOrders:', e);
    if(state._lookupOrdersFor !== phone) return;
    toast('No pudimos buscar tus pedidos: '+e.message, 'err');
  }finally{
    if(state._lookupOrdersFor === phone) state.lookupOrdersLoading = false;
    render();
  }
}
function renderOrdersLookup(){
  const phone = state.route.lookupPhone || state.currentClientPhone || "";
  if(phone && state._lookupOrdersFor !== phone && !state.lookupOrdersLoading){
    state._lookupOrdersFor = phone;
    fetchMyOrders(phone);
  }
  const orders = state.lookupOrdersResult || [];
  return `
  <div class="screen">
    <div class="topbar"><button class="back" onclick="nav('home')">${ic('chevron')}</button><h2>Mis Pedidos</h2></div>
    <div class="form-group"><label>Buscar por teléfono</label><div style="display:flex; gap:8px;">

      <input id="lookup-phone" value="${phone.replace(/^\+?549?/,'')}" placeholder="11 1234 5678" style="flex:1;">
    </div></div>
    <div style="padding:0 16px 16px;"><button class="btn-outline-gold" onclick="lookupOrders()">Buscar pedidos</button></div>
    ${state.lookupOrdersLoading ? `<div class="empty-state">${ic('package')}<p>Buscando…</p></div>` :
      orders.length===0 ? `<div class="empty-state">${ic('package')}<p>${phone?'No encontramos pedidos para ese teléfono.':'Ingresá tu teléfono para ver tus pedidos.'}</p></div>` :
      orders.map(o=>`
        <div class="order-card">
          <div class="oc-head"><span class="oc-id">#${o.id}</span><span class="status-pill status-${o.status.toLowerCase()}">${orderStatusLabel(o.status)}</span></div>
          <div class="oc-items">${o.items.map(it=>formatOrderItemLabel(it)).join(', ')}</div>
          <div style="font-weight:700; color:var(--gold2);">${money(o.total)}</div>
        </div>
      `).join('')
    }
  </div>`;
}
function lookupOrders(){
  const raw = document.getElementById("lookup-phone").value.trim();
  state.route.lookupPhone = raw ? normalizePhone(raw) : "";
  state._lookupOrdersFor = null;
  render();
}

async function loginAccount(){
  const rawPhone = (document.getElementById("acc-phone")||{}).value||"";
  if(!rawPhone.trim()){ toast("Ingresá un teléfono", "err"); return; }
  const phone = normalizePhone(rawPhone.trim());
  if(state.clients[phone]){
    state.currentClientPhone = phone;
    saveState(); render();
    return;
  }
  // Buscar en Supabase (vía RPC — la tabla clients ya no es legible directo)
  try{
    const found = await rpcFetch('get_client_by_phone', {p_phone: phone});
    if(found && found.length>0){
      const c = found[0];
      state.clients[phone] = { phone, name:c.full_name, address:c.address||"", email:c.email||"", doc:"", city:"", province:"", points:0, orders:[] };
      state.currentClientPhone = phone;
      saveState(); render();
      toast("¡Bienvenido de vuelta, "+c.full_name+"!", "ok");
      return;
    }
  }catch(e){ console.warn("lookup cliente:", e); }
  state.route.accMode = "register";
  state.route.accPhone = phone;
  render();
}
// Los celulares argentinos necesitan el "9" después del 54 en formato
// internacional (+549341... en vez de +54341...) para que WhatsApp los
// reconozca — sin esto, el mismo número real podía normalizarse distinto
// según cómo se haya tipeado, y terminaba creando un cliente duplicado
// cada vez. Mucha gente ya escribe su celular CON ese "9" adelante (así
// se marca en Argentina: "9 341 6833210"), así que hay que sacarlo antes
// de agregar el nuestro — si no, queda "5499..." con el 9 duplicado.
function normalizePhone(raw){
  let digits = (raw||'').replace(/\D/g,'');
  if(digits.startsWith("54")) digits = digits.slice(2);
  if(digits.startsWith("9")) digits = digits.slice(1);
  return "+549"+digits;
}
async function completeRegistration(){
  const name = document.getElementById("reg-name").value.trim();
  const rawPhone = document.getElementById("reg-phone").value.trim();
  const email = (document.getElementById("reg-email")||{}).value?.trim()||"";
  const addressBase = (document.getElementById("reg-address")||{}).value?.trim()||"";
  const floor = (document.getElementById("reg-floor")||{}).value?.trim()||"";
  const apt = (document.getElementById("reg-apt")||{}).value?.trim()||"";
  const address = [addressBase, floor?`Piso ${floor}`:'', apt?`Depto ${apt}`:''].filter(Boolean).join(', ');
  const age = (document.getElementById("reg-age")||{}).value?.trim()||"";
  const doc = (document.getElementById("reg-doc")||{}).value?.trim()||"";
  const city = (document.getElementById("reg-city")||{}).value?.trim()||"";
  if(!name || !rawPhone){ toast("Completá al menos nombre y teléfono", "err"); return; }
  const phone = normalizePhone(rawPhone);
  state.clients[phone] = { phone, name, email, address, age, doc, city, province:"", points:0, orders:[] };
  state.currentClientPhone = phone;
  state.route.accMode = null;
  saveState(); render();
  toast("¡Bienvenido, "+name+"! 👑", "ok");
  try{
    // OJO: find_or_create_client tiene dos versiones en Supabase (una vieja de
    // 4 parámetros y una nueva de 7 con datos de facturación) y Postgres no
    // puede elegir cuál usar si no le mandamos los 7 nombrados — mandar solo
    // 4 tira "ambiguous function" y el cliente nunca se guarda en el servidor.
    await rpcFetch('find_or_create_client', {p_phone: phone, p_name: name, p_address: address||city||null, p_email: email||null, p_cuit: null, p_razon_social: null, p_condicion_iva: null});

/* =========================================================
   COMPARADOR DE PRECIOS (solo superadmin)
   ========================================================= */

// ── HELPERS ─────────────────────────────────────────────
function cmpNorm(s){
  return String(s||'').toLowerCase()
    .replace(/[à-å]/g,'a').replace(/[è-ë]/g,'e')
    .replace(/[ì-ï]/g,'i').replace(/[ò-ö]/g,'o')
    .replace(/[ù-ü]/g,'u').replace(/ñ/g,'n')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function cmpMoney(v){ const n=parseFloat(v); return isNaN(n)?'-':'$'+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// Condiciones de precio del proveedor: lista de % que se aplican en cascada
// (cada uno sobre el resultado del anterior) al precio bruto que figura en
// la lista, para llegar al precio real de compra — ej: la lista trae el
// precio de lista y hay que restarle descuentos y sumarle IVA: [-5,-2,-3,21].
// Se cargan una vez al dar de alta el proveedor y se aplican solos en cada
// importación, para no tener que recalcular a mano lista por lista.
function cmpProvAdjustPcts(prov){
  const a=prov&&prov.mapping&&Array.isArray(prov.mapping.priceAdjustPct)?prov.mapping.priceAdjustPct:[];
  return a.filter(n=>typeof n==='number'&&!isNaN(n));
}
// Muchos proveedores (sobre todo Tyna) escriben el tamaño del bulto en el
// propio nombre del producto como "N*M" (ej: "6*220 ML" = 6 latas por
// bulto) — el precio del comparador siempre es por unidad individual (para
// poder comparar entre proveedores), pero al armar el pedido real hay que
// pedirlo por bulto cerrado, no lata por lata.
function cmpPackSize(name){
  const m=String(name||'').match(/(\d+)\s*\*\s*\d/);
  const n=m?parseInt(m[1],10):1;
  return (n>1&&n<1000)?n:1;
}
// Cuántas unidades individuales entran en "un bulto" para pedir de a bulto
// cerrado. Primero intenta el patrón "N*M" del nombre (Tyna); si no hay,
// y el proveedor vende por unidad (precio ya por unidad, ej. Milenium/
// Cuneo) y la lista trae la cantidad real por bulto, usa esa cantidad.
// OJO: si el precio es por BULTO (ej. Emporio), NO corresponde multiplicar
// de nuevo por unitQty — ahí "1" en el carrito ya es 1 bulto completo.
function cmpItemPack(it){
  const fromName=cmpPackSize(it.name);
  if(fromName>1) return fromName;
  if(it.pricePerUnit && it.unitQty>1) return it.unitQty;
  return 1;
}
function cmpApplyAdjust(price,prov){
  const final=cmpProvAdjustPcts(prov).reduce((p,pct)=>p*(1+pct/100),price);
  return Math.round(final*100)/100;
}
// Precio por unidad de una fila ya importada, para comparar entre
// proveedores: si el proveedor tiene "pricePerUnit" el precio de lista ya
// es por unidad (no se divide de nuevo); si no, se divide por la cantidad
// del bulto.
function cmpRowUPrice(row,prov){
  const pricePerUnit=!!(prov&&prov.mapping&&prov.mapping.pricePerUnit);
  return pricePerUnit?row.price:row.price/(row.unitQty||1);
}
function cmpParseAdjustInput(str){
  return String(str||'').split(',').map(s=>s.trim()).filter(s=>s!=='').map(s=>parseFloat(s.replace('%','').replace(',','.'))).filter(n=>!isNaN(n));
}
function cmpAdjustPreviewText(pcts,base){
  if(!pcts.length) return cmpMoney(base)+' (sin cambios)';
  const final=pcts.reduce((p,pct)=>p*(1+pct/100),base);
  return cmpMoney(base)+' → '+cmpMoney(Math.round(final*100)/100);
}
function cmpAdjustPreview(){
  const el=document.getElementById('cpadj-prev'); if(!el) return;
  const pcts=cmpParseAdjustInput(document.getElementById('cpadj').value);
  el.textContent=cmpAdjustPreviewText(pcts,7989.07);
}
const CMP_COLORS=['#1a6b4a','#6b1a4a','#1a3a6b','#6b4a1a','#4a1a6b','#6b1a1a'];
function cmpColor(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))|0; return CMP_COLORS[Math.abs(h)%CMP_COLORS.length]; }
function cmpInitial(name){ return String(name||'').trim().charAt(0).toUpperCase(); }
function cmpFmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function cmpCountProds(provId){ const l=cmpDB.listas.find(x=>x.provId===provId); return l?l.rows.length:0; }
function cmpEsc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// ── MOTOR DE BÚSQUEDA ───────────────────────────────────
function cmpTokenize(s){ return cmpNorm(s).split(/\s+/).filter(w=>w.length>0); }
function cmpBigrams(s){ const r=[]; for(let i=0;i<s.length-1;i++) r.push(s[i]+s[i+1]); return r; }
function cmpTokSim(a,b){
  if(a===b) return 1;
  if(a.length<2||b.length<2) return 0;
  if(b.startsWith(a)||a.startsWith(b)) return 0.85;
  const ba=cmpBigrams(a),bb=cmpBigrams(b);
  if(!ba.length||!bb.length) return 0;
  let inter=0; const used={};
  ba.forEach(g=>{ for(let i=0;i<bb.length;i++){if(!used[i]&&bb[i]===g){inter++;used[i]=1;break;}} });
  return 2*inter/(ba.length+bb.length);
}
// Palabras de cantidad/unidad ("x38g", "40u", "500", "kg") — se ignoran al
// comparar productos entre proveedores porque cada uno las escribe distinto
// (x38g vs 38grs vs 38 gr) y eso le baja el puntaje a productos que en
// realidad son el mismo. La cantidad por bulto para el precio por unidad
// sale de lo que la IA extrajo al importar (ver api/comparador-parse.js),
// nunca del nombre del producto.
const CMP_UNIT_WORDS = new Set(['gr','grs','gramos','kg','kgs','mg','ml','mls','lt','lts','litros','cc','cm','u','un','und','unid','unidades','uds','pack','cja','caja','cajas','docena','display','bulto','fardo','kilo','kilos','x']);
function cmpIsNoiseToken(t){
  if(/^x?\d+[a-z]{0,4}$/.test(t)) return true; // 38g, x38g, 40u, 500, 1kg...
  if(/^\d+x\d+[a-z]{0,4}$/.test(t)) return true; // 6x822g, 24x40gr, 12x1kg — bulto*tamaño pegado sin espacios (proveedores que escriben "NOMBRE.6X822G" con puntos en vez de espacios), cmpNorm no separa la "x" porque es una letra
  return CMP_UNIT_WORDS.has(t);
}
// Sinónimos entre proveedores para la misma variante de producto — cada uno
// le dice distinto a lo mismo (blanco/simple, negro/chocolate). Se puede ir
// agregando más pares acá a medida que aparezcan casos reales.
const CMP_SYNONYMS = {blanco:'simple', blanca:'simple', negro:'chocolate', negra:'chocolate'};
// Tokens de 1 letra (ej: la "c" que queda de "C/PASTA" → "c pasta") nunca
// pueden matchear nada porque cmpTokSim exige longitud >=2, así que solo
// restaban puntaje sin aportar nada. Y una palabra repetida dentro del
// mismo nombre (ej: "MANTECOL ALFAJOR RELLENO C/PASTA MANTECOL 24*40 GR."
// dice "mantecol" dos veces) no suma información nueva para matchear —
// solo la primera aparición puede emparejar con el otro nombre, y la
// segunda inflaba el denominador y bajaba el score de nombres verbosos
// (con relleno descriptivo) contra nombres cortos que en realidad son el
// mismo producto. Por eso se filtran los de 1 letra y se deduplica.
function cmpMatchTokens(s){
  const toks=cmpTokenize(s).filter(t=>!cmpIsNoiseToken(t)&&t.length>=2).map(t=>CMP_SYNONYMS[t]||t);
  return [...new Set(toks)];
}
// Intenta sacar el tamaño individual del producto (900ml, 1.5l, 38grs...),
// normalizado a una unidad base (ml o gramos) — para no confundir
// presentaciones distintas del mismo producto (ej: una botella de 900ml
// con un bidón de 5 litros) que el matcheo de texto por sí solo trataría
// como "el mismo producto", porque las palabras de cantidad se ignoran a
// propósito arriba para tolerar que cada proveedor las escriba distinto.
// Devuelve el número más grande que encuentre (para no quedarse con la
// cantidad de bulto, ej. el "4" de "4*5 LTS", en vez del tamaño real).
// Recibe el nombre CRUDO (no el normalizado con cmpNorm), porque cmpNorm
// saca los puntos y rompe los decimales ("1.5" → "1 5", que se leería
// mal como "5").
function cmpExtractSize(name){
  const s=String(name||'').toLowerCase();
  const re=/(\d+(?:[.,]\d+)?)\s*(ml|mls|cc|l|lt|lts|litros|kg|kgs|kilos|kilo|gr|grs|gramos|g)\b/g;
  let m,best=null;
  while((m=re.exec(s))){
    let val=parseFloat(m[1].replace(',','.'));
    if(/^(l|lt|lts|litros)$/.test(m[2])) val*=1000;
    else if(/^(kg|kgs|kilos|kilo)$/.test(m[2])) val*=1000;
    if(best===null||val>best) best=val;
  }
  return best;
}
// a,b acá son los NOMBRES (no .norm) — cmpMatchTokens/cmpTokenize
// normalizan por su cuenta adentro, y cmpExtractSize necesita el texto
// crudo para no perder los decimales.
function cmpProdSim(a,b){
  const sizeA=cmpExtractSize(a),sizeB=cmpExtractSize(b);
  if(sizeA!==null&&sizeB!==null){
    const diff=Math.abs(sizeA-sizeB)/Math.max(sizeA,sizeB);
    if(diff>0.08) return 0; // tamaños claramente distintos: no es el mismo producto
  }
  const ta=cmpMatchTokens(a),tb=cmpMatchTokens(b);
  if(!ta.length||!tb.length) return 0;
  let matched=0; const usedB={};
  ta.forEach(wa=>{
    let best=0,bestI=-1;
    tb.forEach((wb,i)=>{ if(usedB[i]) return; const s=cmpTokSim(wa,wb); if(s>best){best=s;bestI=i;} });
    if(best>=0.75){matched+=best;if(bestI>=0)usedB[bestI]=1;}
  });
  // Coeficiente de solapamiento (matched / lado más corto), no Dice
  // (2*matched/suma) — un proveedor que abrevia el nombre y se come la
  // marca o la línea del producto (ej: "ALF. MINITORTA CLA 21X69G" vs
  // "ARCOR ALFAJOR AGUILA MINITORTA CLASICO 21*69 GR.") matcheaba TODAS
  // sus palabras contra el nombre largo, pero con Dice el nombre largo
  // (con marca+línea de más) inflaba el denominador y el puntaje quedaba
  // por debajo del umbral aunque fuera, sin dudas, el mismo producto. El
  // gate de tamaño de arriba y el de precio por unidad en cmpDoSearch ya
  // filtran presentaciones distintas, así que no hace falta que ambos
  // nombres tengan la misma cantidad de palabras para considerarlos el
  // mismo producto.
  return matched/Math.min(ta.length,tb.length);
}
// Variante de cmpProdSim que compara FILAS (no nombres sueltos) cacheando
// tamaño/tokens por fila en un WeakMap — el emparejamiento ahora busca la
// pareja de cada producto en la lista COMPLETA de cada proveedor (no solo
// entre lo que ya pasó el filtro de la búsqueda escrita, ver cmpDoSearch),
// así que la misma fila se compara muchas veces por búsqueda; sin cachear
// se recalculaba tamaño y tokens desde cero en cada comparación y con
// listas de varios miles de filas (ej: Tyna) eso trababa el navegador.
const _cmpSizeCache=new WeakMap(), _cmpTokCache=new WeakMap();
function cmpRowSize(row){
  if(_cmpSizeCache.has(row)) return _cmpSizeCache.get(row);
  const v=cmpExtractSize(row.name); _cmpSizeCache.set(row,v); return v;
}
function cmpRowTokens(row){
  if(_cmpTokCache.has(row)) return _cmpTokCache.get(row);
  const v=cmpMatchTokens(row.name); _cmpTokCache.set(row,v); return v;
}
function cmpProdSimRows(rowA,rowB){
  const sizeA=cmpRowSize(rowA),sizeB=cmpRowSize(rowB);
  if(sizeA!==null&&sizeB!==null){
    const diff=Math.abs(sizeA-sizeB)/Math.max(sizeA,sizeB);
    if(diff>0.08) return 0;
  }
  const ta=cmpRowTokens(rowA),tb=cmpRowTokens(rowB);
  if(!ta.length||!tb.length) return 0;
  let matched=0; const usedB={};
  ta.forEach(wa=>{
    let best=0,bestI=-1;
    tb.forEach((wb,i)=>{ if(usedB[i]) return; const s=cmpTokSim(wa,wb); if(s>best){best=s;bestI=i;} });
    if(best>=0.75){matched+=best;if(bestI>=0)usedB[bestI]=1;}
  });
  return matched/Math.min(ta.length,tb.length);
}
function cmpQScore(norm,qt){
  if(!qt.length) return 0;
  const pt=norm.split(/\s+/).filter(w=>w.length>0);
  let tot=0,ok=true;
  qt.forEach(qw=>{ let best=0; pt.forEach(pw=>{const s=cmpTokSim(qw,pw);if(s>best)best=s;}); if(best<0.6) ok=false; tot+=best; });
  return ok?tot/qt.length:0;
}

// Comparador de precios (solo superadmin) — reusa adminFetch, que ya
// maneja el refresh automático del token cuando vence.
async function cmpFetch(path, method, body, prefer){
  return adminFetch(path, method, body, prefer);
}

async function cmpLoadData(){
  try{
    const [provs,listas]=await Promise.all([
      cmpFetch('/cmp_proveedores?select=*&order=name'),
      cmpFetch('/cmp_listas?select=prov_id,at,rows')
    ]);
    cmpDB.proveedores=(provs||[]).map(p=>({id:p.id,name:p.name,phone:p.phone||'',lastImport:p.last_import,mapping:p.mapping}));
    cmpDB.listas=(listas||[]).map(l=>({provId:l.prov_id,at:l.at,rows:l.rows||[]}));
    cmpLoaded=true;
    // Los pedidos viven en una tabla aparte (cmp_pedidos) agregada después;
    // si todavía no se corrió esa migración, que falle en silencio y no
    // rompa el resto del comparador (proveedores/listas/comparar siguen andando).
    try{
      const pedidos=await cmpFetch('/cmp_pedidos?select=*&order=created_at.desc');
      cmpDB.pedidos=(pedidos||[]).map(p=>({id:p.id,provId:p.prov_id,items:p.items||[],total:Number(p.total)||0,status:p.status||'pendiente',note:p.note||'',createdAt:p.created_at,updatedAt:p.updated_at}));
    }catch(pe){ cmpDB.pedidos=cmpDB.pedidos||[]; }
    render();
  }catch(e){ toast('Error cargando comparador: '+e.message,'err'); }
}

async function cmpSaveProvSupa(prov){
  await cmpFetch('/cmp_proveedores','POST',{id:prov.id,name:prov.name,phone:prov.phone||null,last_import:prov.lastImport||null,mapping:prov.mapping||null},'resolution=merge-duplicates');
}
async function cmpDelProvSupa(id){
  await Promise.all([

  ]);

function renderAdminComparador(){
  if(!cmpLoaded){ cmpLoadData(); return `<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.4);">Cargando...</div>`; }
  const tab=state.cmpTab||'comparar';
  const cartCount=Object.values(state.cmpCart||{}).reduce((s,arr)=>s+(arr?arr.length:0),0);
  const tabs=[{k:'comparar',l:'Comparar'},{k:'importar',l:'Importar'},{k:'proveedores',l:'Proveedores'},{k:'pedidos',l:'Pedidos'+(cartCount?' ('+cartCount+')':'')}];
  let html=`<div class="cmp-tabs-bar">${tabs.map(t=>`<button class="cmp-tab-btn${tab===t.k?' active':''}" onclick="state.cmpTab='${t.k}';render()">${t.l}</button>`).join('')}</div>`;
  if(tab==='proveedores') html+=cmpHtmlProveedores();
  else if(tab==='importar') html+=cmpHtmlImportar();
  else if(tab==='pedidos') html+=cmpHtmlPedidos();
  else html+=cmpHtmlComparar();
  return html;
}

async function cmpSaveProv(){
  const name=(document.getElementById('cpn').value||'').trim();
  const phone=(document.getElementById('cpph').value||'').trim();
  const priceAdjustPct=cmpParseAdjustInput(document.getElementById('cpadj').value);
  const pricePerUnit=!!document.getElementById('cpunit').checked;
  const aiNotes=(document.getElementById('cpnotes').value||'').trim();
  const mapping={priceAdjustPct,pricePerUnit,aiNotes};
  const idEl=document.getElementById('cpid');
  const id=idEl?idEl.value:'';
  if(!name){ toast('Ingresá un nombre','err'); return; }
  let prov;
  if(id){
    prov=cmpDB.proveedores.find(x=>x.id===id); if(prov){ prov.name=name; prov.phone=phone; prov.mapping=mapping; }
  } else {
    prov={id:'p'+Date.now(),name,phone,lastImport:null,mapping};
    cmpDB.proveedores.push(prov);
  }
  cmpCloseModal();
  try{ await cmpSaveProvSupa(prov); toast('Guardado'); render(); }
  catch(e){ toast('Error: '+e.message,'err'); }
}

function cmpOnFile(input){
  const f=input.files[0]; if(!f) return;
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX){
      const s=document.createElement('script');
      s.src='xlsx.min.js';
      s.onload=()=>cmpReadXlsxToText(f);
      s.onerror=()=>toast('xlsx.min.js no disponible — exportá como CSV','err');
      document.head.appendChild(s);
    } else { cmpReadXlsxToText(f); }
  } else if(ext==='pdf'){
    cmpReadPdf(f);
  } else {
    const r=new FileReader();
    r.onload=e=>cmpAiParse(e.target.result,f.name);
    r.readAsText(f,'UTF-8');
  }
}

async function cmpReadPdf(f){
  toast('Leyendo PDF...');
  const loadLib=()=>new Promise((res,rej)=>{
    if(window.pdfjsLib){res();return;}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res();
    };
    s.onerror=()=>rej(new Error('No se pudo cargar pdf.js'));
    document.head.appendChild(s);
  });
  try{
    await loadLib();
    const buf=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    // Extraer texto página a página manteniendo estructura de filas
    const pageTexts=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      // Agrupar items por línea usando la coordenada Y
      const byY={};
      content.items.forEach(item=>{
        const y=Math.round(item.transform[5]);
        if(!byY[y]) byY[y]=[];
        byY[y].push({x:item.transform[4],str:item.str});
      });
      const ys=Object.keys(byY).map(Number).sort((a,b)=>b-a);
      ys.forEach(y=>{
        const line=byY[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join('\t').trim();
        if(line) pageTexts.push(line);
      });
    }
    const text=pageTexts.join('\n');
    if(!text.trim()){ toast('No se encontró texto en el PDF','err'); return; }
    cmpAiParse(text,f.name);
  }catch(e){ toast('Error al leer PDF: '+e.message,'err'); }
}

function cmpReadXlsxToText(f){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const csv=XLSX.utils.sheet_to_csv(ws);
      if(!csv.trim()){ toast('Archivo vacío','err'); return; }
      cmpAiParse(csv,f.name);
    }catch(err){ toast('Error al leer Excel: '+err.message,'err'); }
  };
  r.readAsArrayBuffer(f);
}

// Importar un CSV que ya viene prolijo (Producto, Precio, [Cant x Bulto],
// [Codigo]) sin pasar por la IA — no tiene costo, para listas que ya se
// limpiaron a mano de antemano. A diferencia del camino con IA, el precio
// de la columna se usa TAL CUAL como precio final: no se le aplican los
// descuentos/IVA cargados en el proveedor (ver _cmpImportSkipAdjust).
let _cmpImportSkipAdjust = false;
function cmpOnSimpleCsv(input){
  const f=input.files[0]; if(!f) return;
  const provId=(document.getElementById('cmp-prov')||{}).value||'';
  if(!provId){ toast('Seleccioná un proveedor primero','err'); return; }
  const r=new FileReader();
  r.onload=e=>{
    const items=cmpParseSimpleCsv(e.target.result);
    if(!items){ toast('No reconozco las columnas de este CSV — necesita al menos "Producto" y "Precio"','err'); return; }
    if(!items.length){ toast('El archivo no tiene productos','err'); return; }
    _cmpAiFilename=f.name;
    _cmpAiItems=items;
    _cmpImportSkipAdjust=true;
    cmpRenderAiPreview();
  };
  r.readAsText(f,'UTF-8');
}
function cmpParseSimpleCsv(text){
  const lines=String(text||'').split(/\r\n|\n/).filter(l=>l.trim()!=='');
  if(!lines.length) return null;
  const parseLine=(line)=>{
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(inQ){
        if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=c;
      } else {
        if(c==='"') inQ=true;
        else if(c===','){ out.push(cur); cur=''; }
        else cur+=c;
      }
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const header=parseLine(lines[0]).map(h=>h.toLowerCase());
  const idxName=header.findIndex(h=>/producto|nombre|descrip/.test(h));
  const idxPrice=header.findIndex(h=>/precio/.test(h));
  const idxQty=header.findIndex(h=>/cant.*bulto|unitqty|cantidad/.test(h));
  const idxCode=header.findIndex(h=>/codigo|código|sku/.test(h));
  if(idxName<0||idxPrice<0) return null;
  const items=[];
  for(let i=1;i<lines.length;i++){
    const cols=parseLine(lines[i]);
    const name=(cols[idxName]||'').trim();
    const price=parseFloat(cols[idxPrice]);
    if(!name||!(price>0)) continue;
    const qty=idxQty>=0?(parseInt(cols[idxQty])||1):1;
    const code=idxCode>=0?(cols[idxCode]||'').trim():'';
    items.push({name,price,unit:'',unitQty:qty,code});
  }
  return items;
}

// Le mandamos el texto crudo (CSV, texto de PDF, o pegado a mano) a una IA
// en el backend, que devuelve {name, price, unit, unitQty, code} por
// producto ya limpio — reemplaza el mapeo manual de columnas de antes.
// Ver api/comparador-parse.js.
async function cmpAiParse(text,filename){
  const provId=(document.getElementById('cmp-prov')||{}).value||'';
  if(!provId){ toast('Seleccioná un proveedor primero','err'); return; }
  if(!text||!text.trim()){ toast('El archivo parece vacío','err'); return; }
  _cmpAiFilename=filename;
  _cmpImportSkipAdjust=false;
  const el=document.getElementById('cmp-imp-preview');
  if(el) el.innerHTML=`<div style="background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;padding:28px 14px;text-align:center;">
    <span class="spin" style="display:inline-block;font-size:22px;">${ic('sparkle')}</span>
    <p style="margin-top:10px;font-size:13px;color:rgba(255,255,255,0.6);">Analizando &ldquo;${cmpEsc(filename)}&rdquo; con IA&hellip;</p>
  </div>`;
  const prov=cmpDB.proveedores.find(p=>p.id===provId);
  const notes=(prov&&prov.mapping&&prov.mapping.aiNotes)||'';
  try{
    const res=await fetch('/api/comparador-parse',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+((adminSession&&adminSession.access_token)||'')},
      body:JSON.stringify({text,filename,notes})
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||('Error '+res.status));
    if(!data.items||!data.items.length) throw new Error('No se encontraron productos en el archivo');
    _cmpAiItems=data.items;
    cmpRenderAiPreview();
    if(data.truncated) toast('El archivo era muy largo, se analizó una parte','err');
  }catch(e){
    if(el) el.innerHTML=`<div style="background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;padding:16px;text-align:center;">
      <p style="font-size:13px;color:var(--warn);margin-bottom:10px;">${cmpEsc(e.message)}</p>
      <button class="btn-secondary" onclick="document.getElementById('cmp-imp-preview').innerHTML=''">Cerrar</button>
    </div>`;
  }
}

// Compara la lista nueva (todavía sin importar) contra la que ya estaba
// guardada para este proveedor, matcheando por nombre normalizado exacto
// (cmpNorm) — no la búsqueda difusa del comparador, esto es solo para dar
// un aviso rápido de qué cambió antes de pisar la lista vieja. Devuelve
// null si el proveedor no tenía lista previa (nada para comparar).
function cmpDiffAgainstPrevList(items, prov, provId){
  const oldLista=cmpDB.listas.find(l=>l.provId===provId);
  if(!oldLista || !oldLista.rows.length) return null;
  const oldByNorm={};
  oldLista.rows.forEach(r=>{ oldByNorm[r.norm]=r; });
  const newNorms={};
  const pricePerUnit=!!(prov&&prov.mapping&&prov.mapping.pricePerUnit);
  const perItem=items.map(it=>{
    const norm=cmpNorm(it.name);
    newNorms[norm]=1;
    const finalPrice=_cmpImportSkipAdjust?it.price:cmpApplyAdjust(it.price,prov);
    const qty=it.unitQty||1;
    const newUnit=pricePerUnit?finalPrice:finalPrice/(qty||1);
    const old=oldByNorm[norm];
    if(!old) return {status:'new'};
    const oldUnit=pricePerUnit?old.price:old.price/(old.unitQty||1);
    if(!(oldUnit>0) || Math.abs(newUnit-oldUnit)<0.01) return {status:'same'};
    const pct=Math.round((newUnit-oldUnit)/oldUnit*100);
    return {status:pct>0?'up':'down', pct, oldUnit};
  });
  const discontinued=oldLista.rows.filter(r=>!newNorms[r.norm]);
  return {perItem, discontinued};
}

function cmpRenderAiPreview(){
  const el=document.getElementById('cmp-imp-preview');
  if(!el) return;
  const provId=(document.getElementById('cmp-prov')||{}).value||'';
  const prov=cmpDB.proveedores.find(p=>p.id===provId);
  const pricePerUnit=!!(prov&&prov.mapping&&prov.mapping.pricePerUnit);
  const hasAdj=!_cmpImportSkipAdjust && cmpProvAdjustPcts(prov).length>0;
  const items=_cmpAiItems||[];
  const diff=cmpDiffAgainstPrevList(items, prov, provId);
  const upCount=diff?diff.perItem.filter(d=>d.status==='up').length:0;
  const downCount=diff?diff.perItem.filter(d=>d.status==='down').length:0;
  const newCount=diff?diff.perItem.filter(d=>d.status==='new').length:0;
  const rowsHtml=items.map((it,i)=>{
    const finalPrice=_cmpImportSkipAdjust?it.price:cmpApplyAdjust(it.price,prov);
    const d=diff?diff.perItem[i]:null;
    let diffBadge='';
    if(d&&d.status==='up') diffBadge=`<div style="font-size:10px;color:var(--warn);margin-top:2px;">▲ +${d.pct}% (antes ${cmpMoney(d.oldUnit)}/u)</div>`;
    else if(d&&d.status==='down') diffBadge=`<div style="font-size:10px;color:var(--ok);margin-top:2px;">▼ ${d.pct}% (antes ${cmpMoney(d.oldUnit)}/u)</div>`;
    else if(d&&d.status==='new') diffBadge=`<div style="font-size:10px;color:var(--gold2);margin-top:2px;">NUEVO</div>`;
    return `
    <tr>
      <td><input class="cmp-inp" style="padding:6px 8px;font-size:12px;" value="${cmpEsc(it.name)}" oninput="_cmpAiItems[${i}].name=this.value">${diffBadge}</td>
      <td>
        <input class="cmp-inp" style="padding:6px 8px;font-size:12px;width:80px;" type="number" step="0.01" value="${it.price}" oninput="_cmpAiItems[${i}].price=parseFloat(this.value)||0;cmpRenderAiPreview()">
        ${hasAdj?`<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;">→ ${cmpMoney(finalPrice)}</div>`:''}
      </td>
      <td><input class="cmp-inp" style="padding:6px 8px;font-size:12px;width:64px;" type="number" step="1" value="${it.unitQty}" oninput="_cmpAiItems[${i}].unitQty=parseInt(this.value)||1">
        ${pricePerUnit?`<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;">no divide el precio</div>`:''}
      </td>
      <td><button class="icon-btn" onclick="cmpAiRemoveItem(${i})">${ic('trash')}</button></td>
    </tr>`;}).join('');
  el.innerHTML=`<div style="background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;padding:14px;">
    <div style="font-size:11px;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Archivo: ${cmpEsc(_cmpAiFilename)}</div>
    <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">${items.length} producto(s) detectados &middot; revisá antes de importar${hasAdj?' &middot; el precio final ya incluye los descuentos/IVA cargados en el proveedor':''}${pricePerUnit?' &middot; el precio ya es por unidad, "Uds/bulto" es solo informativo para pedir por bulto':''}</div>
    ${diff?`<div class="cmp-note" style="margin-bottom:12px;">Comparado con la lista anterior de este proveedor: <b style="color:var(--warn)">${upCount} subieron</b>, <b style="color:var(--ok)">${downCount} bajaron</b>, <b style="color:var(--gold2)">${newCount} nuevos</b>${diff.discontinued.length?`, y <b style="color:var(--danger)">${diff.discontinued.length} ya no están en este archivo</b> y van a dejar de listarse para este proveedor al importar`:''}.</div>`:''}
    <div style="display:flex;gap:10px;margin-bottom:12px;">
      <button class="btn-primary" style="flex:1;" onclick="cmpDoAiImport()">Importar ${items.length} producto(s)</button>
      <button class="btn-secondary" style="flex:none;font-size:12.5px;" onclick="_cmpAiItems=null;_cmpImportSkipAdjust=false;render()">Cancelar</button>
    </div>
    <div class="cmp-tbl-wrap"><table>
      <tr><th>Producto</th><th>Precio</th><th>Uds/bulto</th><th></th></tr>
      ${rowsHtml}
    </table></div>
    <button class="btn-primary" style="width:100%;margin-top:14px;" onclick="cmpDoAiImport()">Importar ${items.length} producto(s)</button>
    <button class="btn-secondary" style="width:100%;margin-top:8px;font-size:12.5px;" onclick="_cmpAiItems=null;_cmpImportSkipAdjust=false;render()">Cancelar</button>
  </div>`;
}

async function cmpDoAiImport(){

  }));

// ── COMPARAR ────────────────────────────────────────────
function cmpHtmlComparar(){
  const noData=!cmpDB.listas.length;
  return `<div class="cmp-search-wrap">
    <input id="cmp-q" placeholder="Buscar producto..." oninput="cmpSearch()" autocomplete="off">
  </div>
  ${noData?`<div style="padding:40px 20px;text-align:center;color:rgba(255,255,255,0.4);">Importá listas de precios primero en <b>Importar</b>.</div>`:`<div style="padding:0 16px 8px;font-size:12px;color:rgba(255,255,255,0.35);">Escribí al menos 2 letras para buscar</div>`}
  <div id="cmp-results"></div>`;
}

let _cmpSt;
function cmpSearch(){ clearTimeout(_cmpSt); _cmpSt=setTimeout(cmpDoSearch,220); }
function cmpDoSearch(){
  const el=document.getElementById('cmp-results'); if(!el) return;
  const q=(document.getElementById('cmp-q').value||'').trim();
  if(q.length<2){ el.innerHTML=''; return; }
  const qt=cmpTokenize(q);
  const provs=[];
  cmpDB.listas.forEach(lista=>{ const prov=cmpDB.proveedores.find(p=>p.id===lista.provId); if(prov) provs.push({prov,lista}); });
  if(!provs.length){ el.innerHTML='<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.4);">No hay listas importadas.</div>'; return; }
  const allHits=[];
  provs.forEach(pl=>{ pl.lista.rows.forEach(row=>{ const sc=cmpQScore(row.norm,qt); if(sc>=0.6) allHits.push({row,prov:pl.prov,sc}); }); });
  if(!allHits.length){
    el.innerHTML=`<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.4);">Sin resultados para &ldquo;<b>${cmpEsc(q)}</b>&rdquo;.</div>`;
    return;
  }
  allHits.sort((a,b)=>b.sc-a.sc);
  const SHOW_MAX=150;
  // Los "seeds" (la fila que da nombre a cada grupo) salen de lo que
  // matchea tu búsqueda, pero la PAREJA de cada proveedor se busca en su
  // lista COMPLETA, no solo entre lo que también pasó el filtro de
  // búsqueda — antes, si el nombre de un proveedor para el mismo producto
  // no matcheaba bien contra el texto exacto que escribiste (ej: buscás
  // "aceite de maiz" y ese proveedor lo tiene como "aceite maiz" sin "de",
  // por eso no llegaba al 0.6 de cmpQScore), esa fila quedaba afuera del
  // pool entero y nunca se emparentaba con nadie aunque su nombre
  // matcheara perfecto contra el de otro proveedor vía cmpProdSim.
  // Emparentar según lo que escribís y no según el producto en sí era
  // justamente el bug: el mismo producto podía aparecer emparentado o
  // suelto según la búsqueda. cmpProdSimRows cachea tamaño/tokens por fila
  // (ver arriba) para que recorrer listas de varios miles de productos por
  // cada seed no trabe el navegador.
  const capped=allHits.slice(0,SHOW_MAX);
  _cmpRowIdx=[];
  const groups=[],used={};
  capped.forEach(h=>{
    const key=h.prov.id+'|'+h.row.norm;
    if(used[key]) return;
    const g={name:h.row.name,byProv:{}}; g.byProv[h.prov.id]={row:h.row,prov:h.prov}; used[key]=1;
    const seedUPrice=cmpRowUPrice(h.row,h.prov);
    // Por cada proveedor nos quedamos con el candidato de MAYOR similitud
    // de TODA su lista, no con el primero que supere el umbral — antes, si
    // dos productos del mismo proveedor pasaban el 0.7 (ej: "Shot Tableta
    // 90g" y "Shot Tableta Chocolate 170g"), se quedaba con el que
    // apareciera primero en la lista aunque el otro fuera una coincidencia
    // mucho mejor, mezclando presentaciones distintas en la misma fila.
    provs.forEach(pl2=>{
      if(pl2.prov.id===h.prov.id) return;
      let best=null;
      pl2.lista.rows.forEach(row2=>{
        const k2=pl2.prov.id+'|'+row2.norm;
        if(used[k2]) return;
        // 0.55 emparejaba variantes de un mismo producto que en realidad son
        // presentaciones distintas (ej: "Cofler Block 24x300g" con "Cofler
        // Block 40grs 36u Simple") porque comparten marca+línea y las
        // palabras de cantidad se ignoran a propósito. Más exigente para que
        // haga falta coincidencia real más allá del nombre de la línea.
        const sim=cmpProdSimRows(h.row,row2);
        if(sim<0.7) return;
        // Algunos proveedores cuentan "la unidad" distinto para el mismo tipo
        // de producto (ej: Tyna calcula el precio "por unidad" de una bolsa
        // de 700g de caramelos como precio por BOLSA, mientras que Emporio
        // calcula precio por CARAMELO SUELTO dividiendo por los 210 que
        // trae) — el nombre matchea pero no es la misma unidad, y termina
        // mostrando diferencias de precio sin sentido (+2000%). Si el precio
        // por unidad resultante es 4 veces o más distinto, mejor no
        // emparejarlos que mostrar una comparación falsa.
        const candUPrice=cmpRowUPrice(row2,pl2.prov);
        if(seedUPrice>0&&candUPrice>0){
          const ratio=Math.max(seedUPrice,candUPrice)/Math.min(seedUPrice,candUPrice);
          if(ratio>4) return;
        }
        if(!best||sim>best.sim) best={row:row2,prov:pl2.prov,sim,key:k2};
      });
      if(best){ g.byProv[best.prov.id]={row:best.row,prov:best.prov}; used[best.key]=1; }
    });
    groups.push(g);
  });
  html=`<div style="padding:0 16px 8px;font-size:12px;color:rgba(255,255,255,0.35);">${groups.length} producto(s)${groups.length>SHOW_MAX?' — mostrando los primeros '+SHOW_MAX+', afiná la búsqueda para ver el resto':''}</div>`;
  html+=`<div class="cmp-wrap"><table class="cmp-table"><thead><tr><th>Producto</th>`;
  provs.forEach(pl=>{ html+=`<th><div class="cmp-prov-th-av" style="background:${cmpColor(pl.prov.id)}">${cmpInitial(pl.prov.name)}</div><br>${cmpEsc(pl.prov.name)}</th>`; });
  html+=`</tr></thead><tbody>`;
  groups.slice(0,SHOW_MAX).forEach(g=>{
    // El qty por proveedor sale SOLO de lo que se mapeó al importar (columna
    // "Cant x Bulto" o texto de presentación). Si el proveedor tiene
    // "pricePerUnit" (el precio de lista ya es por unidad, ej. Milenium),
    // esa cantidad es solo informativa (cuántas unidades trae el bulto para
    // pedir) y NO se usa para dividir el precio — dividirlo de nuevo daría
    // un precio por unidad absurdamente chico.
    const provQtys={};
    provs.forEach(pl=>{
      if(g.byProv[pl.prov.id]){
        const r=g.byProv[pl.prov.id].row;
        const pricePerUnit=!!(pl.prov.mapping&&pl.prov.mapping.pricePerUnit);
        provQtys[pl.prov.id]={qty:r.unitQty||1, pricePerUnit};
      }
    });
    const unitPrices=[];
    provs.forEach(pl=>{ if(g.byProv[pl.prov.id]){ const r=g.byProv[pl.prov.id].row; const qInfo=provQtys[pl.prov.id]; unitPrices.push(qInfo.pricePerUnit?r.price:r.price/qInfo.qty); } });
    const minU=unitPrices.length?Math.min(...unitPrices):null;
    const hasBulto=provs.some(pl=>g.byProv[pl.prov.id]&&provQtys[pl.prov.id]&&provQtys[pl.prov.id].qty>1);
    html+=`<tr><td>${cmpEsc(g.name)}</td>`;
    provs.forEach(pl=>{
      const entry=g.byProv[pl.prov.id];
      if(!entry){ html+=`<td class="cmp-cell-empty">&mdash;</td>`; return; }
      const r=entry.row;
      const qInfo=provQtys[pl.prov.id],qty=qInfo.qty,uPrice=qInfo.pricePerUnit?r.price:r.price/qty;
      const isBest=minU!==null&&Math.abs(uPrice-minU)<0.01&&unitPrices.length>1;
      const diffPct=(minU&&uPrice>minU)?Math.round((uPrice-minU)/minU*100):0;
      const rowIdx=_cmpRowIdx.push({provId:pl.prov.id,name:r.name,price:r.price,unit:r.unit,unitQty:qty,code:r.code,pricePerUnit:qInfo.pricePerUnit})-1;
      html+=`<td${isBest?' class="cmp-cell-best"':''}>`;
      if(hasBulto){
        html+=`<span class="cmp-cell-price">${cmpMoney(uPrice)}<span style="font-size:10px;font-weight:400;color:rgba(255,255,255,0.4)">/u</span></span>`;
        if(qty>1) html+=`<span class="cmp-cell-unit">${qInfo.pricePerUnit?'bulto de '+qty+'u ('+cmpMoney(r.price*qty)+')':cmpMoney(r.price)+' &times; '+qty+'u'}${r.unit?' &middot; '+cmpEsc(r.unit):''}</span>`;
        else html+=`<span class="cmp-cell-unit" style="color:var(--warn)">&#9888; sin datos de bulto</span>`;
      } else {
        html+=`<span class="cmp-cell-price">${cmpMoney(r.price)}</span>`;
        if(r.unit) html+=`<span class="cmp-cell-unit">${cmpEsc(r.unit)}</span>`;
      }
      if(isBest&&unitPrices.length>1) html+=`<span class="cmp-best-tag">MEJOR PRECIO</span>`;
      else if(diffPct>0) html+=`<span class="cmp-cell-diff" style="color:var(--warn)">+${diffPct}% m&aacute;s caro</span>`;
      html+=`<button class="cmp-add-btn" onclick="cmpCartAdd(${rowIdx})" title="Agregar al pedido">+</button>`;
      html+=`</td>`;
    });

// ── PEDIDOS A PROVEEDORES ───────────────────────────────
// El pedido en curso (carrito) vive en state.cmpCart -> {provId: [items]}
// y se persiste solo localmente (localStorage vía saveState) hasta que se
// "genera": ahí se guarda en cmp_pedidos y se vacía el carrito de ese
// proveedor. No se llama render() al agregar desde la tabla de Comparar
// para no perder la búsqueda en curso — un toast alcanza como feedback.
function cmpCartAdd(idx){
  const ctx=_cmpRowIdx[idx]; if(!ctx) return;
  const key=(ctx.code||ctx.name).toLowerCase();
  const pack=cmpItemPack(ctx);
  const arr=state.cmpCart[ctx.provId]=state.cmpCart[ctx.provId]||[];
  const existing=arr.find(it=>it.key===key);
  if(existing) existing.qty+=pack;
  else arr.push({key,name:ctx.name,price:ctx.price,unit:ctx.unit,unitQty:ctx.unitQty,code:ctx.code,pricePerUnit:ctx.pricePerUnit,qty:pack});
  saveState();
  const prov=cmpDB.proveedores.find(p=>p.id===ctx.provId);
  toast('Agregado al pedido de '+(prov?prov.name:'proveedor'));
}
function cmpCartQty(pid,key,delta){
  const arr=state.cmpCart[pid]; if(!arr) return;
  const it=arr.find(x=>x.key===key); if(!it) return;
  it.qty+=delta;
  if(it.qty<=0) state.cmpCart[pid]=arr.filter(x=>x.key!==key);
  saveState(); render();
}
// Escribir la cantidad a mano en vez de tocar +/- — value viene en "bultos"
// (o unidades sueltas si el producto no tiene patrón de bulto en el nombre).
function cmpCartSetQty(pid,key,value,pack){
  const arr=state.cmpCart[pid]; if(!arr) return;
  const it=arr.find(x=>x.key===key); if(!it) return;
  const n=Math.max(0,parseInt(value)||0);
  it.qty=n*pack;
  if(it.qty<=0) state.cmpCart[pid]=arr.filter(x=>x.key!==key);
  saveState(); render();
}
function cmpCartClearProv(pid){
  if(!confirm('¿Vaciar el pedido en curso de este proveedor?')) return;
  delete state.cmpCart[pid];
  saveState(); render();
}
function cmpCartTotal(items){ return (items||[]).reduce((s,it)=>s+it.price*it.qty,0); }
function cmpStatusLabel(s){ return {pendiente:'Pendiente',enviado:'Enviado',recibido:'Recibido'}[s]||s; }
function cmpPedidoId(){ return 'ped'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function cmpGeneratePedido(pid){
  const items=state.cmpCart[pid];
  if(!items||!items.length){ toast('No hay productos para este proveedor','err'); return; }
  const total=cmpCartTotal(items);
  const now=new Date().toISOString();
  const pedido={id:cmpPedidoId(),provId:pid,items:items.map(it=>Object.assign({},it)),total,status:'pendiente',note:'',createdAt:now,updatedAt:now};
  try{
    await cmpSavePedidoSupa(pedido);
    cmpDB.pedidos.unshift(pedido);
    delete state.cmpCart[pid];
    saveState();
    toast('Pedido generado');
    render();

}

// Excel real (formato SpreadsheetML de Office) armado a mano como texto,
// sin librerías — algunos proveedores (ej. Milenium) piden el pedido en
// planilla en vez de WhatsApp/PDF. Se guarda con extensión .xls, que Excel
// abre nativamente como planilla (a diferencia de exportar un <table> HTML
// con esa extensión, que Excel abre con un cartel de advertencia).
function cmpXlsEsc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cmpXlsCell(v){
  return (typeof v==='number')?`<Cell><Data ss:Type="Number">${v}</Data></Cell>`:`<Cell><Data ss:Type="String">${cmpXlsEsc(v)}</Data></Cell>`;
}
function cmpXlsRow(cells){ return `<Row>${cells.map(cmpXlsCell).join('')}</Row>`; }
function cmpPedidoExcelXml(ped,prov){
  const header=cmpXlsRow(['Código','Producto','Cantidad','Unidad','Precio unitario','Subtotal']);
  const rows=ped.items.map(it=>{
    const pack=cmpItemPack(it);
    const cant=pack>1?Math.round(it.qty/pack):it.qty;
    const unidad=pack>1?'bulto x'+pack+'u':'u';
    return cmpXlsRow([it.code||'', it.name, cant, unidad, it.price, Math.round(it.price*it.qty*100)/100]);
  }).join('');
  const totalRow=cmpXlsRow(['','','','','TOTAL', ped.total]);
  return `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n<Worksheet ss:Name="Pedido">\n<Table>\n${header}\n${rows}\n${totalRow}\n</Table>\n</Worksheet>\n</Workbook>`;
}
function cmpExportPedidoExcel(id){
  const ped=cmpDB.pedidos.find(p=>p.id===id); if(!ped) return;
  const prov=cmpDB.proveedores.find(p=>p.id===ped.provId);
  const xml=cmpPedidoExcelXml(ped,prov);
  const blob=new Blob([xml],{type:'application/vnd.ms-excel'});
  const provName=(prov?prov.name:'proveedor').replace(/[^a-z0-9]+/gi,'_');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Pedido_'+provName+'_'+cmpFmtDate(ped.createdAt).replace(/\//g,'-')+'.xls';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Excel descargado');
}

/* =========================================================
   ALQUILER — seguimiento de deuda mensual (solo superadmin)
   Se guarda como un único registro en app_settings (clave
   'rent_ledger'), excluido de la lectura pública — igual que
   sub_admins/orders_list. El cargo mensual se agrega solo: al
   entrar a la pestaña se completan los meses faltantes desde el
   último movimiento hasta el mes actual.
   ========================================================= */
const RENT_MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function rentId(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function rentAddMonths(period, n){
  const [y,m] = period.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function rentCurrentPeriod(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function rentMonthLabel(period){
  const [y,m] = period.split('-').map(Number);
  return RENT_MONTH_NAMES[m-1]+' '+y;
}
function rentBalance(){
  return (state.rentLedger.movements||[]).reduce((sum,m)=> sum + (m.type==='pago' ? -m.amount : m.amount), 0);
}
// Completa los meses sin cargar entre el último movimiento y el mes
// actual. Idempotente: cada mes queda marcado por su "period", así que
// entrar varias veces al mes no duplica el cargo.
function ensureRentAutoCharge(){
  const ledger = state.rentLedger;
  if(!ledger.movements || !ledger.movements.length) return;
  const periods = ledger.movements.map(m=>m.period).filter(Boolean).sort();
  if(!periods.length) return;
  const chargedPeriods = new Set(periods);
  const cp = rentCurrentPeriod();
  let p = rentAddMonths(periods[0], 1);
  let added = false;
  while(p <= cp){
    if(!chargedPeriods.has(p)){
      ledger.movements.push({id:rentId(), date:p+'-01', type:'cargo', period:p, amount:ledger.monthlyAmount, note:'Alquiler de '+rentMonthLabel(p)});
      chargedPeriods.add(p);
      added = true;
    }
    p = rentAddMonths(p, 1);
  }
  if(added){ saveState(); apiSaveRent(); }
}
async function apiSyncRent(){
  try{
    const rows = await adminFetch('/app_settings?setting_key=eq.rent_ledger&select=setting_value', 'GET');
    const row = rows && rows[0];
    if(row){
      const parsed = JSON.parse(row.setting_value);
      state.rentLedger = Object.assign({monthlyAmount:1500000, movements:[]}, parsed);
    }
    rentLoaded = true;
    ensureRentAutoCharge();
    saveState();
    render();
  }catch(e){
    rentLoaded = true;
    toast('Error cargando alquiler: '+e.message, 'err');
    render();
  }
}
async function apiSaveRent(){
  try{
    const val = JSON.stringify(state.rentLedger);
    const existing = await adminFetch('/app_settings?setting_key=eq.rent_ledger&select=id', 'GET');
    if(existing && existing.length>0){
      await adminFetch('/app_settings?setting_key=eq.rent_ledger', 'PATCH', {setting_value: val});
    }else{
      await adminFetch('/app_settings', 'POST', {setting_key:'rent_ledger', setting_value: val});
    }
  }catch(e){ toast('Error guardando alquiler: '+e.message, 'err'); }
}
function updateRentMonthlyAmount(val){
  const n = Number(val);
  if(!n || n<=0) return;
  state.rentLedger.monthlyAmount = n;

// Arma el detalle de movimientos (cargos y pagos) con saldo corrido, para
// mandarle al dueño del local un resumen claro de cuánto se debe y por qué.
function buildRentWAMessage(){
  const ledger = state.rentLedger;
  const movs = [...(ledger.movements||[])].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  let running = 0;
  const rows = movs.map(m=>{ running += (m.type==='pago' ? -m.amount : m.amount); return Object.assign({}, m, {running}); });
  const balance = running;
  let msg = `*Detalle de Alquiler — Sabores Royal*\n`;
  msg += `_Actualizado al ${fmtDateAR(new Date().toISOString().slice(0,10))}_\n\n`;
  rows.forEach(m=>{
    const label = m.note || (m.type==='pago'?'Pago':'Cargo');
    const signo = m.type==='pago' ? '-' : '+';
    msg += `${fmtDateAR(m.date)} — ${label}: ${signo}${money(m.amount)}\n`;
  });
  msg += `\n*Saldo actual: ${money(balance)}*`;
  if(balance>0) msg += ' (a favor del propietario)';
  else if(balance<0) msg += ' (a favor del local)';
  return msg;
}

function paymentsId(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
// Formatea "YYYY-MM-DD" a "DD/MM/YYYY" con split de string, no con Date():
// un Date() de una fecha sin hora se interpreta en UTC y en Argentina
// (UTC-3) puede mostrar el día anterior.
function fmtDateAR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
const MONTH_ABBR_ES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
function dateBadgeParts(iso){
  if(!iso) return {day:'—', month:''};
  const [y,m,d] = iso.split('-');
  return {day:d, month:MONTH_ABBR_ES[Number(m)-1]||''};
}

// Suma "months" meses a una fecha "YYYY-MM-DD", recortando al último día
// del mes destino si hace falta (ej: 31 ene + 1 mes = 28/29 feb, no 3 mar).
function addMonthsClamped(iso, months){
  const [y,m,d] = iso.split('-').map(Number);
  const total = (m-1) + months;
  const targetY = y + Math.floor(total/12);
  const targetM = ((total%12)+12)%12;
  const daysInTarget = new Date(targetY, targetM+1, 0).getDate();
  const targetD = Math.min(d, daysInTarget);
  return `${targetY}-${String(targetM+1).padStart(2,'0')}-${String(targetD).padStart(2,'0')}`;
}
// Acá también contamos las cuotas ya vencidas sin pagar (no solo las
// próximas), porque son las que más urge tildar y no queremos que se
// "pierdan" del badge una vez pasada la fecha.
function bankLoansDueSoonCount(days){
  const limit = new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  return (state.bankLoans.items||[]).reduce((s,l)=>
    s + (l.cuotas||[]).filter(c=>c.estado!=='pagado' && c.vencimiento && c.vencimiento<=limit).length, 0);
}
function loanSaldoPendiente(loan){
  return (loan.cuotas||[]).filter(c=>c.estado!=='pagado').reduce((s,c)=>s+c.monto,0);
}
function loanTotalPendienteGeneral(){
  return (state.bankLoans.items||[]).reduce((s,l)=>s+loanSaldoPendiente(l),0);
}
// Próxima cuota sin pagar de un préstamo (o undefined si ya están todas
// pagadas) — se usa tanto para ordenar la lista de préstamos por
// vencimiento como para mostrar "próx. fecha" en cada tarjeta.
function loanProximaCuota(loan){
  return [...(loan.cuotas||[])].filter(c=>c.estado!=='pagado').sort((a,b)=>(a.vencimiento||'').localeCompare(b.vencimiento||''))[0];
}

// Redibuja las filas de cuotas según "monto total" / "cantidad" / "1° cuota",
// sin pisar lo que el usuario ya haya tocado a mano en filas que sigan existiendo.
function rebuildBankLoanSplitRows(){
  const rowsEl = document.getElementById('bl-rows');
  if(!rowsEl) return;
  const total = Number(document.getElementById('bl-total')?.value) || 0;
  const n = Math.max(1, Math.min(60, Number(document.getElementById('bl-cantidad')?.value) || 1));
  const primera = document.getElementById('bl-primera')?.value || new Date().toISOString().slice(0,10);
  const per = n>0 ? Math.round((total/n)*100)/100 : 0;
  const prevRows = [...rowsEl.querySelectorAll('[data-row]')].map(row=>({
    monto: row.querySelector('.bl-row-monto')?.value || '',
    vto: row.querySelector('.bl-row-vto')?.value || '',
  }));
  let html = '';
  for(let i=0;i<n;i++){
    const prev = prevRows[i];
    const defaultVto = i===0 ? primera : addMonthsClamped(primera, i);
    html += `
      <div data-row style="display:flex; gap:8px; align-items:flex-end; margin-bottom:10px;">
        <div style="flex:none; width:56px; font-size:12px; color:rgba(255,255,255,0.5); padding-bottom:11px;">Cuota ${i+1}</div>

        <div style="flex:1;"><label style="font-size:11px; color:rgba(255,255,255,0.5); display:block; margin-bottom:4px;">Vencimiento</label>
          <input class="bl-row-vto" type="date" value="${prev&&prev.vto?prev.vto:defaultVto}" style="width:100%; padding:10px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-bd); color:var(--cream);"></div>
      </div>`;
  }
  rowsEl.innerHTML = html;
}

// Cuenta cuántos préstamos del preset todavía no están cargados en Bancos
// (comparando por "concepto"), para el botón aditivo de abajo.
function bbvaPresetMissingCount(){
  const existing = new Set((state.bankLoans.items||[]).map(l=>l.concepto));
  return BBVA_IMPORT_PRESET.filter(p=>!existing.has(p.concepto)).length;
}
// Suma al listado de Bancos los préstamos del preset que todavía no están
// cargados (por "concepto"), sin tocar los que ya existen ni sus cuotas
// marcadas como pagadas — a diferencia de importBbvaPreset(), que borra todo.
async function importBbvaPresetMissing(){
  const existing = new Set((state.bankLoans.items||[]).map(l=>l.concepto));
  const missing = BBVA_IMPORT_PRESET.filter(p=>!existing.has(p.concepto));
  if(!missing.length){ toast('No hay préstamos nuevos para agregar', 'err'); return; }
  if(!confirm(`Se van a agregar ${missing.length} préstamo(s) nuevo(s) sin tocar los que ya están cargados:\n${missing.map(m=>m.concepto).join(', ')}\n¿Continuar?`)) return;
  missing.forEach(preset=>{
    const cuotas = preset.rows.map((r,i)=>({id:paymentsId('bl'), nro:i+1, monto:r[1], vencimiento:r[0], estado:'pendiente'}));
    const montoTotal = cuotas.reduce((s,c)=>s+c.monto,0);
    state.bankLoans.items.push({id:paymentsId('bank'), banco:'BBVA', concepto:preset.concepto, montoTotal, createdAt:new Date().toISOString().slice(0,10), cuotas});
  });
  saveState(); render();
  try{ await apiSaveSetting('bank_loans', state.bankLoans); toast(missing.length+' préstamo(s) agregado(s)', 'ok'); }
  catch(e){ toast('Error al guardar: '+e.message, 'err'); }
}
// Reemplaza TODO lo que haya en la solapa Bancos por el preset actual —
// a pedido explícito de arrancar de cero con los cuadros de marcha nuevos,
// en vez de sumarse a una carga anterior (que podía tener otra numeración
// de préstamos y quedar mezclada con esta).
async function importBbvaPreset(){
  if(!confirm('Esto BORRA todos los préstamos que haya cargados ahora en Bancos y los reemplaza por los '+BBVA_IMPORT_PRESET.length+' cuadros de marcha que pasaste (incluye simulaciones repetidas del mismo préstamo, sin deduplicar). Se pierden las cuotas que ya estuvieran marcadas como pagadas. ¿Continuar?')) return;
  state.bankLoans.items = [];
  BBVA_IMPORT_PRESET.forEach(preset=>{
    const cuotas = preset.rows.map((r,i)=>({id:paymentsId('bl'), nro:i+1, monto:r[1], vencimiento:r[0], estado:'pendiente'}));
    const montoTotal = cuotas.reduce((s,c)=>s+c.monto,0);
    state.bankLoans.items.push({id:paymentsId('bank'), banco:'BBVA', concepto:preset.concepto, montoTotal, createdAt:new Date().toISOString().slice(0,10), cuotas});
  });
  saveState(); render();
  try{ await apiSaveSetting('bank_loans', state.bankLoans); toast(BBVA_IMPORT_PRESET.length+' préstamos cargados de cero', 'ok'); }
  catch(e){ toast('Error al guardar: '+e.message, 'err'); }

function openMarkPaidBeforeModal(){

function closeMarkPaidBeforeModal(){ const el=document.getElementById("markpaid-modal-overlay"); if(el) el.remove(); }
async function confirmMarkPaidBefore(){
  const fecha = document.getElementById("mp-fecha").value;
  if(!fecha){ toast("Elegí una fecha", "err"); return; }
  let count = 0;
  (state.bankLoans.items||[]).forEach(l=>{
    (l.cuotas||[]).forEach(c=>{
      if(c.estado!=='pagado' && c.vencimiento && c.vencimiento<fecha){ c.estado='pagado'; count++; }
    });
  });
  closeMarkPaidBeforeModal();
  saveState(); render();
  try{ await apiSaveSetting('bank_loans', state.bankLoans); toast(count+' cuota'+(count!==1?'s':'')+' marcada'+(count!==1?'s':'')+' como pagada'+(count!==1?'s':''), 'ok'); }
  catch(e){ toast('Error al guardar: '+e.message, 'err'); }
}
// Vuelve todas las cuotas de todos los préstamos a "pendiente" — para
// arrancar de cero cuando el corte por fecha (confirmMarkPaidBefore) marcó
// como pagadas cuotas que en realidad no se pagaron, porque el pago real
// no fue parejo entre préstamos (algunos atrasados, algunos nunca tomados).
async function resetAllLoansToPendiente(){
  if(!confirm('Esto vuelve TODAS las cuotas de TODOS los préstamos a "Pendiente", como recién importadas. ¿Continuar?')) return;
  let count = 0;
  (state.bankLoans.items||[]).forEach(l=>{
    (l.cuotas||[]).forEach(c=>{
      if(c.estado==='pagado'){ c.estado='pendiente'; count++; }
    });
  });
  saveState(); render();
  try{ await apiSaveSetting('bank_loans', state.bankLoans); toast(count+' cuota'+(count!==1?'s':'')+' vuelta'+(count!==1?'s':'')+' a pendiente', 'ok'); }
  catch(e){ toast('Error al guardar: '+e.message, 'err'); }
}
